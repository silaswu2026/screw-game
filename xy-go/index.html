<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1f2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小雨闯关</title>
<link rel="stylesheet" href="style.css?v=3061">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="hidden">
  <div class="names">
    <div id="lvlName">第1关</div>
    <div id="lvlEn">Level 1</div>
    <div id="bars">
      <div class="bar"><span>A</span><div class="track"><i id="hp1"></i></div></div>
      <div class="bar" id="bar2"><span>B</span><div class="track"><i id="hp2"></i></div></div>
      <div class="bar hidden" id="bar3"><span>C</span><div class="track"><i id="hp3"></i></div></div>
    </div>
  </div>
  <div class="stats"><span id="coinN">🪙 0</span><span id="starN">⭐ 0</span></div>
  <div id="netBanner" class="netBanner hidden" aria-live="polite"></div>
  <div class="hudBtns">
    <button id="mute" type="button" aria-label="静音 Mute">音</button>
    <button id="retry" type="button">重来</button>
  </div>
</div>
<div id="hint" class="hidden"></div>
<div id="toast"></div>

<div id="menu">
  <!-- 首页：只有单机 / 联网两个入口 -->
  <div class="view" id="homeView">
    <h1 class="logo">小雨闯关<small>忍者公园大冒险</small></h1>
    <div class="heroRow">
      <img src="ninjas/ninja-green.jpg" alt="绿忍者"><img src="ninjas/ninja-blue.jpg" alt="蓝忍者"><img src="ninjas/ninja-red.jpg" alt="红忍者">
    </div>
    <div class="bigBtns">
      <button id="play" class="bigBtn btnSolo" type="button">🥷 单机游玩</button>
      <button id="mode2" class="bigBtn btnNet" type="button">🤝 联机游玩</button>
    </div>
    <button id="mode1" type="button" class="on" aria-hidden="true" tabindex="-1">单机</button>
    <div class="subRow">
      <button id="netJoinC" class="chip" type="button" aria-pressed="false">🔴 小宇AI跟班</button>
      <button id="levelToggle" class="chip" type="button">🗺️ 选关</button>
      <a id="backClassroom" class="chip" href="../shuyang-ai/classroom/">← 教室</a>
    </div>
    <div class="picks hidden" id="picks">
      <button type="button" data-lv="0">第1关</button><button type="button" data-lv="1">第2关</button>
      <button type="button" data-lv="2">第3关</button><button type="button" data-lv="3">第4关</button>
      <button type="button" data-lv="4">第5关</button><button type="button" data-lv="5">第6关</button>
      <button type="button" data-lv="6">第7关</button><button type="button" data-lv="7">第8关</button>
    </div>
    <p class="keys">方向键 / AD 移动 · 空格跳 · F / J 投掷</p>
  </div>

  <!-- 联网对战：独立房间页 -->
  <div class="view hidden" id="netView">
    <div class="topBar">
      <button id="roomClose" class="backBtn" type="button">← 返回</button>
      <h2>联机游玩<small>自动匹配队友</small></h2>
      <b id="matchTimer" class="timer">00:00</b>
    </div>
    <div class="hidden" id="netChoice">
      <button id="netHost" type="button" tabindex="-1">创建房间</button>
      <button id="netJoin" type="button" tabindex="-1">加入房间</button>
      <div class="hidden" id="roomJoinBox"><input id="roomInput" tabindex="-1"><button id="roomJoinGo" type="button" tabindex="-1">进入</button></div>
    </div>
    <div class="card hidden" id="roomPanel" aria-hidden="true">
      <div class="matchHead"><span class="spinner" id="spinner"></span><b id="matchTitle">正在寻找队友…</b></div>
      <div class="slots">
        <div class="slot a" id="slotA"><img src="ninjas/ninja-green.jpg" alt=""><span id="slotAname">玩家A · 绿</span><span class="st" id="slotAst">等待</span><span class="me" id="slotAme"></span></div>
        <div class="vs">VS</div>
        <div class="slot b" id="slotB"><img src="ninjas/ninja-blue.jpg" alt=""><span id="slotBname">玩家B · 蓝</span><span class="st" id="slotBst">等待加入…</span><span class="me" id="slotBme"></span></div>
      </div>
      <p class="roomWait" id="roomWait">请稍等…</p>
      <p class="roomWait hidden" id="joinWait"></p>
      <b id="roomCode" class="hidden"></b>
      <div class="roomLv hidden" id="roomLv"></div>
      <button id="roomStart" type="button" class="hidden" disabled>开始游戏</button>
      <span id="roomTitle" class="hidden"></span><span id="roomSub" class="hidden"></span>
    </div>
    <p class="tip">另一位玩家也点「联机游玩」就会自动匹配</p>
  </div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <h2 id="panelTitle">过关了!</h2>
    <p id="panelSub">Level clear!</p>
    <button id="panelBtn" type="button">下一关</button>
  </div>
</div>
<div id="touch" class="hidden">
  <div class="cluster">
    <button id="btnL" type="button" aria-label="左 Left">◀</button>
    <button id="btnR" type="button" aria-label="右 Right">▶</button>
  </div>
  <div class="cluster">
    <button id="btnJ" type="button" aria-label="跳 Jump">跳<small>Jump</small></button>
    <button id="btnT" type="button" aria-label="投掷手里剑 Throw">投<small>Throw</small></button>
  </div>
</div>
<div id="coopTouch" class="hidden">
  <div class="half">
    <b>P1</b>
    <button id="p1L" type="button" aria-label="P1 左">◀</button>
    <button id="p1R" type="button" aria-label="P1 右">▶</button>
    <button id="p1J" type="button" aria-label="P1 跳">跳</button>
    <button id="p1T" type="button" aria-label="P1 投掷">投</button>
  </div>
  <div class="half">
    <b>P2</b>
    <button id="p2L" type="button" aria-label="P2 左">◀</button>
    <button id="p2R" type="button" aria-label="P2 右">▶</button>
    <button id="p2J" type="button" aria-label="P2 跳">跳</button>
    <button id="p2T" type="button" aria-label="P2 投掷">投</button>
  </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js?v=3061"></script>
</body>
</html>
