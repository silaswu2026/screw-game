<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d4e38">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小宇 / Xiao Yu</title>
<link rel="stylesheet" href="style.css?v=3031">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="hidden">
  <div class="names">
    <div id="lvlName">第1关</div>
    <div id="lvlEn">Level 1</div>
    <div id="bars">
      <div class="bar"><span>P1</span><div class="track"><i id="hp1"></i></div></div>
      <div class="bar" id="bar2"><span>P2</span><div class="track"><i id="hp2"></i></div></div>
      <div class="bar hidden" id="bar3"><span>C</span><div class="track"><i id="hp3"></i></div></div>
    </div>
  </div>
  <div class="stats"><span id="coinN">🪙 0</span><span id="starN">⭐ 0</span></div>
  <div class="hudBtns">
    <button id="mute" type="button" aria-label="静音 Mute">音</button>
    <button id="retry" type="button">重来 Retry</button>
  </div>
</div>
<div id="hint" class="hidden"></div>
<div id="toast"></div>
<div id="menu">
  <h1>小宇 <span>Xiao Yu</span></h1>
  <p class="lead">闯关 · A+B双人 · C可跟班AI</p>
  <div class="castRow" id="castRow">
    <button type="button" class="cast on" data-color="green" aria-label="绿色忍者">
      <img src="ninjas/ninja-green.jpg" alt="绿忍者">
      <span>绿 · 玩家A 芃芃</span>
    </button>
    <button type="button" class="cast" data-color="blue" aria-label="蓝色忍者">
      <img src="ninjas/ninja-blue.jpg" alt="蓝忍者">
      <span>蓝 · 玩家B 爸爸</span>
    </button>
    <button type="button" class="cast" data-color="red" id="castC" aria-label="红色忍者跟班">
      <img src="ninjas/ninja-red.jpg" alt="红忍者">
      <span>红 · C小宇 AI跟班</span>
    </button>
  </div>
  <div class="modes" id="modes">
    <button id="mode1" class="on" type="button">单人</button>
    <button id="mode2" type="button">同机双人</button>
  </div>
  <button id="play" type="button">开始 Start</button>
  <div class="netRow netCast" id="netRow">
    <button id="netHost" type="button" class="netCastBtn" aria-label="玩家A 绿色忍者">
      <img src="ninjas/ninja-green.jpg" alt="绿忍者">
      <span>玩家A</span>
      <small>芃芃 · 绿</small>
    </button>
    <button id="netJoin" type="button" class="netCastBtn" aria-label="玩家B 蓝色忍者">
      <img src="ninjas/ninja-blue.jpg" alt="蓝忍者">
      <span>玩家B</span>
      <small>爸爸 · 蓝</small>
    </button>
    <button id="netJoinC" type="button" class="netCastBtn" aria-label="玩家C 小宇跟班AI" aria-pressed="false">
      <img src="ninjas/ninja-red.jpg" alt="红忍者">
      <span>玩家C</span>
      <small>小宇 · AI跟班</small>
    </button>
  </div>
  <div class="picks">
    <button type="button" data-lv="0">第1关</button>
    <button type="button" data-lv="1">第2关</button>
    <button type="button" data-lv="2">第3关</button>
    <button type="button" data-lv="3">第4关</button>
    <button type="button" data-lv="4">第5关</button>
    <button type="button" data-lv="5">第6关</button>
    <button type="button" data-lv="6">第7关</button>
    <button type="button" data-lv="7">第8关</button>
  </div>
  <p class="keys">方向键 / AD 移动 · W / 空格跳 · F / J 投掷（默认站立，不自动跑）</p>
  <p class="netHint">联网：浏览器1点玩家A，浏览器2点玩家B（人类双人）。点玩家C可开关「小宇AI跟班」（本地笨AI，不占联网席）。微信用浏览器打开。见 TEST-AB.md</p>
</div>
<div id="roomPanel" class="hidden" aria-hidden="true">
  <div class="roomCard">
    <h2 id="roomTitle">联网配对</h2>
    <p id="roomSub">自动寻找搭档</p>
    <p class="roomWait" id="roomWait">请稍等…</p>
    <p class="roomWait hidden" id="joinWait"></p>
    <div id="roomHostBox" class="hidden"></div>
    <div id="roomJoinBox" class="hidden">
      <input id="roomInput" class="hidden" aria-hidden="true" tabindex="-1">
      <button id="roomJoinGo" class="hidden" type="button" aria-hidden="true">加入</button>
    </div>
    <canvas id="roomQr" class="hidden" width="1" height="1" aria-hidden="true"></canvas>
    <b id="roomCode" class="hidden" aria-hidden="true"></b>
    <button id="roomStart" class="hidden" type="button" aria-hidden="true">开始</button>
    <div class="roomLv hidden" aria-hidden="true">
      <button type="button" data-nlv="0">第1关</button>
      <button type="button" data-nlv="1">第2关</button>
      <button type="button" data-nlv="2">第3关</button>
      <button type="button" data-nlv="3">第4关</button>
      <button type="button" data-nlv="4">第5关</button>
      <button type="button" data-nlv="5">第6关</button>
      <button type="button" data-nlv="6">第7关</button>
      <button type="button" data-nlv="7">第8关</button>
    </div>
    <button id="roomClose" class="roomClose" type="button">取消</button>
  </div>
</div>
<div id="panel" class="hidden">
  <div class="card">
    <h2 id="panelTitle">过关了!</h2>
    <p id="panelSub">Level clear!</p>
    <button id="panelBtn" type="button">下一关 Next</button>
  </div>
</div>
<div id="touch" class="hidden">
  <div class="cluster">
    <button id="btnL" type="button" aria-label="左 Left">◀</button>
    <button id="btnR" type="button" aria-label="右 Right">▶</button>
  </div>
  <div class="cluster">
    <button id="btnJ" type="button" aria-label="跳 Jump">跳<small>Jump</small></button>
    <button id="btnT" type="button" aria-label="投掷手里剑 Throw">投<small>Throw</small></button>
  </div>
</div>
<div id="coopTouch" class="hidden">
  <div class="half">
    <b>P1</b>
    <button id="p1L" type="button" aria-label="P1 左">◀</button>
    <button id="p1R" type="button" aria-label="P1 右">▶</button>
    <button id="p1J" type="button" aria-label="P1 跳">跳</button>
    <button id="p1T" type="button" aria-label="P1 投掷">投</button>
  </div>
  <div class="half">
    <b>P2</b>
    <button id="p2L" type="button" aria-label="P2 左">◀</button>
    <button id="p2R" type="button" aria-label="P2 右">▶</button>
    <button id="p2J" type="button" aria-label="P2 跳">跳</button>
    <button id="p2T" type="button" aria-label="P2 投掷">投</button>
  </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js?v=3031"></script>
</body>
</html>
