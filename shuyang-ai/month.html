<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#12162f"/>
  <title>澍暘的 AI 冒险月</title>
  <link rel="stylesheet" href="style.css?v=11"/>
</head>
<body>
  <div id="app"></div>
    <script>
    (async function () {
      const app = document.getElementById('app');
      function fail(msg) {
        if (app) app.innerHTML = '<p style="padding:24px;color:#ffb4b4">页面加载失败：' + msg + '</p>';
      }
      function load(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error(src));
          document.body.appendChild(s);
        });
      }
      try {
        await load('course.js?v=11');
        await load('sync.js?v=11');
        await load('app.js?v=11');
      } catch (e) {
        fail(e && e.message ? e.message : '脚本');
      }
    })();
  </script>
</body>
</html>
