<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>成长屋共学教室</title>
<style>
  :root{
    --bg:#0b1a12;--card:#12261a;--line:#2a5a3a;--txt:#e8f5ea;--chat-bg:#0e1f14;
    --safe-b:env(safe-area-inset-bottom,0px);
    --chip-h:88px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    background:radial-gradient(900px 480px at 50% -8%,#1a3a24,var(--bg));
    color:var(--txt);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  header{
    padding:8px 10px;
    padding-top:max(8px, env(safe-area-inset-top, 0px));
    display:flex;
    gap:6px;
    flex-wrap:nowrap;
    align-items:center;
    border-bottom:1px solid #234;
    flex-shrink:0;
    background:#0d1f14ee;
    backdrop-filter:blur(8px);
    z-index:20;
  }
  h1{
    font-size:.88rem;
    margin:0;
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .btn{
    border:0;border-radius:999px;
    padding:7px 10px;
    font-weight:800;
    font-size:11px;
    cursor:pointer;
    background:linear-gradient(180deg,#78d484,#4ea85c);
    color:#083018;
    flex-shrink:0;
    white-space:nowrap;
  }
  .btn.ghost{background:#1c3324;color:var(--txt);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .btn.send{padding:10px 14px;border-radius:12px;font-size:14px}
  .btn.chat-toggle{position:relative}
  .btn.chat-toggle.has-new::after{
    content:"";
    position:absolute;top:2px;right:2px;
    width:8px;height:8px;border-radius:50%;
    background:#ff5a5a;box-shadow:0 0 0 2px #0d1f14;
  }

  main{
    flex:1;
    min-height:0;
    width:100%;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:0;
    padding:0;
    max-width:100%;
  }

  .panel{
    background:var(--card);
    border:0;
    border-radius:0;
    padding:0;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .panel h2{
    margin:0;
    font-size:11px;
    font-weight:700;
    opacity:.75;
    letter-spacing:.04em;
    padding:6px 10px 0;
  }
  .hint,.room-note,.cams>h2{display:none!important}

  .course{
    order:1;
    flex:1 1 0;
    min-height:0;
    border-bottom:1px solid var(--line);
  }
  .course h2{padding-bottom:4px}
  .course iframe{
    width:100%;
    flex:1;
    min-height:0;
    border:0;
    border-radius:0;
    background:#000;
  }

  .cams{
    order:2;
    flex:0 0 auto;
    border-bottom:0;
    background:#0f2218;
    padding-bottom:0;
  }
  .cams h2{padding:6px 10px 4px}
  .vids{
    display:flex;
    flex-direction:row;
    gap:8px;
    padding:8px 10px 8px;
    overflow-x:auto;
    overflow-y:visible;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
  }
  .vids::-webkit-scrollbar{display:none}
  .tile{
    background:#000;
    border-radius:14px;
    aspect-ratio:3/4;
    height:var(--chip-h);
    width:auto;
    overflow:hidden;
    position:relative;
    border:2px solid transparent;
    flex:0 0 auto;
    scroll-snap-align:start;
  }
  .tile.joinable{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .tile.joinable:hover,
  .tile.joinable:focus-visible{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 6px 18px #0007;
    outline:none;
  }
  .tile.joinable:active{transform:scale(.97)}
  .tile.joinable.me{border-color:#8af0a0;box-shadow:0 0 0 2px #8af0a088}
  .tile.joinable .tap-hint{
    position:absolute;left:50%;bottom:22px;z-index:3;
    transform:translateX(-50%);
    background:#000c;color:#e8f5ea;
    font-size:9px;font-weight:700;letter-spacing:.02em;
    padding:2px 7px;border-radius:999px;
    white-space:nowrap;pointer-events:none;
    opacity:.92;
  }
  .tile.joinable.live .tap-hint,
  .tile.joinable.me .tap-hint{display:none}
  .tile.rain.digital{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tile-inner{
    position:absolute;inset:0;
    border-radius:inherit;
    overflow:hidden;
    background:#000;
  }
  .tile.online{border-color:#6dcf7a}
  .tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile .name{
    position:absolute;left:4px;bottom:4px;z-index:2;
    background:#000a;padding:1px 6px;border-radius:7px;font-size:10px;
  }
  .tile .badge{
    position:absolute;right:4px;top:4px;z-index:2;
    background:#1e7a3a;padding:1px 5px;border-radius:7px;font-size:9px;font-weight:700;
  }
  .tile.rain{background:linear-gradient(160deg,#1a3d2a,#0d2418)}
  .tile img.avatar{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;transition:filter .25s ease, transform .25s ease}
  .tile.live video{display:block;width:100%;height:100%;object-fit:cover}
  .tile.live img.avatar{display:none}
  .tile.live .badge{background:#2a6fd4}
  .xy-bob{animation:xyBob 2.4s ease-in-out infinite;transform-origin:center bottom}
  @keyframes xyBob{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-6px) scale(1.02)}
  }
  .tile.rain.online{box-shadow:0 0 0 2px #6dcf7a, 0 0 14px #6dcf7a66}
  .tile.rain.speaking .xy-bob{animation-duration:0.9s}

  /* 小雨：可爱数字人头部 + 情绪动画 */
  .xy-glow{
    position:absolute;inset:-2px;z-index:1;pointer-events:none;border-radius:inherit;
    background:radial-gradient(circle at 50% 28%, #9dffb855, transparent 55%);
    opacity:.55;mix-blend-mode:screen;
  }
  .xy-sparkles{
    position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
  }
  .xy-sparkles span{
    position:absolute;font-size:11px;line-height:1;
    animation:xySpark 1.6s ease-in-out infinite;
  }
  .xy-sparkles span:nth-child(1){left:12%;top:14%;animation-delay:0s}
  .xy-sparkles span:nth-child(2){right:10%;top:22%;animation-delay:.35s}
  .xy-sparkles span:nth-child(3){left:18%;top:40%;animation-delay:.7s}
  .xy-face{
    position:absolute;left:50%;top:56%;
    transform:translate(-50%,-50%);
    font-size:clamp(16px, 26%, 34px);
    line-height:1;opacity:0;pointer-events:none;z-index:4;
    filter:drop-shadow(0 2px 4px #0008);
    transition:opacity .2s ease, transform .25s ease;
  }
  .tile.rain img.avatar{
    transform-origin:center 30%;
  }
  /* 静默 idle */
  .tile.rain.mood-idle .xy-bob{animation:xyIdle 3.2s ease-in-out infinite}
  .tile.rain.mood-idle .xy-glow{opacity:.35}
  .tile.rain.mood-idle .xy-sparkles{opacity:0}
  .tile.rain.mood-idle img.avatar{filter:saturate(.95) brightness(.98)}
  /* 开心 happy */
  .tile.rain.mood-happy .xy-bob{animation:xyHappy 1.4s ease-in-out infinite}
  .tile.rain.mood-happy .xy-glow{opacity:.85;background:radial-gradient(circle at 50% 28%, #ffe08a66, #9dffb844 40%, transparent 60%)}
  .tile.rain.mood-happy .xy-sparkles{opacity:.9}
  .tile.rain.mood-happy .xy-face{opacity:1}
  .tile.rain.mood-happy .xy-face::before{content:"😊"}
  .tile.rain.mood-happy img.avatar{filter:saturate(1.2) brightness(1.08)}
  /* 明星 / 兴奋 star */
  .tile.rain.mood-star .xy-bob{animation:xyStar 0.85s ease-in-out infinite}
  .tile.rain.mood-star .xy-glow{
    opacity:1;
    background:radial-gradient(circle at 50% 22%, #fff7a8aa, #ff9de266 35%, #9dffb833 55%, transparent 70%);
    animation:xyPulse 1.1s ease-in-out infinite;
  }
  .tile.rain.mood-star .xy-sparkles{opacity:1}
  .tile.rain.mood-star .xy-sparkles span{font-size:13px}
  .tile.rain.mood-star .xy-face{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  .tile.rain.mood-star .xy-face::before{content:"🌟"}
  .tile.rain.mood-star img.avatar{filter:saturate(1.35) brightness(1.12) contrast(1.05)}
  /* legacy expr aliases map to moods via JS; keep surprise/think/cheer soft hooks */
  .tile.rain.expr-smile{/* noop marker */}
  @keyframes xyIdle{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-4px) rotate(1deg)}
  }
  @keyframes xyHappy{
    0%,100%{transform:translateY(0) scale(1)}
    40%{transform:translateY(-8px) scale(1.04)}
    70%{transform:translateY(-2px) scale(1.02)}
  }
  @keyframes xyStar{
    0%,100%{transform:translateY(0) scale(1) rotate(0)}
    25%{transform:translateY(-10px) scale(1.06) rotate(-3deg)}
    50%{transform:translateY(-2px) scale(1.03) rotate(2deg)}
    75%{transform:translateY(-8px) scale(1.05) rotate(-2deg)}
  }
  @keyframes xySpark{
    0%,100%{opacity:.25;transform:translateY(0) scale(.85)}
    50%{opacity:1;transform:translateY(-6px) scale(1.15)}
  }
  @keyframes xyPulse{
    0%,100%{opacity:.75}
    50%{opacity:1}
  }
  .room-note{
    font-size:10px;opacity:.7;padding:0 10px 4px;line-height:1.35;
  }

  /* 文字气泡：完全在头像格上方，不挡脸 */
  /* speech bubbles removed — avatars stay clean; Douyin likes (.like-float) kept */
  .bubble{display:none !important}

  /* 抖音点赞：表情从头像升起漂浮淡出（不挡脸） */
  .like-layer{
    position:absolute;
    left:0;right:0;top:0;bottom:0;
    overflow:visible;
    pointer-events:none;
    z-index:8;
  }
  .like-float{
    position:absolute;
    left:50%;
    bottom:42%;
    font-size:22px;
    line-height:1;
    filter:drop-shadow(0 2px 4px #0007);
    animation:likeRise 1.35s ease-out forwards;
    will-change:transform, opacity;
  }
  @keyframes likeRise{
    0%{opacity:0;transform:translate(-50%, 8px) scale(.5) rotate(-8deg)}
    12%{opacity:1;transform:translate(-50%, 0) scale(1.15) rotate(0deg)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx, 0px)), -88px) scale(1.05) rotate(var(--rot, 12deg))}
  }

  /* 快捷表情条：两行六列共 12 */
  .react-bar{
    display:grid;
    grid-template-columns:repeat(6, minmax(0, 1fr));
    grid-template-rows:repeat(2, auto);
    gap:6px;
    padding:6px 10px max(8px, var(--safe-b));
    background:#0f2218;
    flex-shrink:0;
    overflow:visible;
    max-width:100%;
  }
  .react-bar::-webkit-scrollbar{display:none}
  .react{
    border:1px solid var(--line);
    background:#1a3022;
    color:var(--txt);
    border-radius:999px;
    min-width:0;
    width:100%;
    height:36px;
    padding:0 4px;
    font-size:17px;
    cursor:pointer;
    line-height:1;
  }
  .react:active{transform:scale(.94)}
  .react.bang{font-size:15px;font-weight:900}

  /* 音量 0–10（默认 3 → 0.3） */
  .vol-bar{
    display:flex;align-items:center;gap:8px;
    padding:4px 10px 2px;background:#0f2218;flex-shrink:0;
    font-size:11px;font-weight:700;opacity:.9;
  }
  .vol-bar label{white-space:nowrap;opacity:.8}
  .vol-bar input[type=range]{flex:1;min-width:0;accent-color:#6dcf7a}
  .vol-bar .vol-val{min-width:1.4em;text-align:right;font-variant-numeric:tabular-nums}

  /* 课程流程遮罩：小雨头像在上，文字在下（上方不放文案） */
  .course{position:relative}
  .course-shell{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
  .course-shell iframe{flex:1;min-height:0;width:100%;border:0;border-radius:0;background:#000}
  .course-flow{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:10px 14px max(12px, var(--safe-b));
    background:linear-gradient(180deg,#0e1a14f2,#122018f5 55%,#0f2218f8);
    overflow:auto;-webkit-overflow-scrolling:touch;
  }
  .course-flow[hidden]{display:none !important}
  .course-flow .xy-hero{
    width:min(42%, 160px);aspect-ratio:1;border-radius:50%;
    object-fit:cover;display:block;margin:4px auto 10px;
    box-shadow:0 0 0 3px #6dcf7a88, 0 8px 28px #000a;
    background:#1a3022;
  }
  .course-flow .cf-body{width:100%;max-width:28em;margin:0 auto;text-align:center}
  .course-flow .cf-theme{
    margin:0 0 8px;font-size:clamp(16px,4.6vw,20px);font-weight:800;line-height:1.35;color:#eafff0;
  }
  .course-flow .cf-overview{
    margin:0 0 14px;font-size:clamp(13px,3.6vw,15px);font-weight:700;line-height:1.5;opacity:.92;
  }
  .course-flow .cf-start{
    appearance:none;border:0;border-radius:999px;cursor:pointer;
    padding:12px 28px;min-height:46px;font-size:17px;font-weight:800;
    background:linear-gradient(180deg,#78d484,#4ea85c);color:#083018;
    box-shadow:0 3px 0 #2f6d3a;
  }
  .course-flow .cf-start:active{transform:translateY(1px)}
  .course-flow .cf-steps{display:none;width:100%;max-width:28em;margin:8px auto 0;text-align:left}
  .course-flow.steps-on .cf-intro{display:none}
  .course-flow.steps-on .cf-steps{display:block}
  .course-flow .cf-step{
    display:block;width:100%;text-align:left;margin:0 0 8px;
    padding:10px 12px;border-radius:14px;border:2px solid #3f8f4a66;
    background:#1e3a2c;color:#dff5e6;font-size:14px;font-weight:800;cursor:pointer;
  }
  .course-flow .cf-step .num{color:#ffe7a0;margin-right:6px}
  .course-flow .cf-step.active{
    background:linear-gradient(180deg,#78d484,#4ea85c);color:#083018;border-color:transparent;
  }
  .course-flow .cf-step.active .num{color:#083018}
  .course-flow .cf-next{
    appearance:none;border:0;border-radius:999px;cursor:pointer;display:none;
    margin:10px auto 0;padding:10px 22px;min-height:42px;font-size:15px;font-weight:800;
    background:#2a5540;color:#fff;
  }
  .course-flow.steps-on .cf-next{display:inline-flex;align-items:center;justify-content:center}
  .course-flow .cf-skip{
    margin-top:10px;background:transparent;border:0;color:#9bbfa8;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;
  }

  /* Chat modal */
  .chat-backdrop{
    position:fixed;
    inset:0;
    background:#000a;
    z-index:40;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .chat-backdrop.open{opacity:1;pointer-events:auto}
  .chat-modal{
    width:100%;
    max-width:480px;
    max-height:min(72dvh, 520px);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px 16px 0 0;
    box-shadow:0 -12px 40px #0008;
    display:flex;
    flex-direction:column;
    padding:10px 12px max(12px, var(--safe-b));
    transform:translateY(12px);
    transition:transform .18s ease;
    min-height:0;
  }
  .chat-backdrop.open .chat-modal{transform:translateY(0)}
  .chat-modal-head{
    display:flex;align-items:center;gap:8px;flex-shrink:0;margin-bottom:8px;
  }
  .chat-modal-head h2{margin:0;flex:1;font-size:14px;font-weight:800;opacity:.95;padding:0}
  .chat-close{
    background:#1c3324;color:var(--txt);border:1px solid var(--line);
    width:36px;height:36px;border-radius:10px;font-size:18px;line-height:1;cursor:pointer;flex-shrink:0;
  }
  .chat-reacts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chat-reacts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.chat-reacts .react{height:34px;min-width:0;width:100%;font-size:16px;padding:0 2px}
  #log{
    flex:1;font-size:13px;opacity:.92;white-space:pre-wrap;overflow:auto;
    background:var(--chat-bg);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin:0 0 10px;min-height:100px;line-height:1.45;
    -webkit-overflow-scrolling:touch;
  }
  .chat-compose{display:flex;gap:8px;flex-shrink:0}
  .chat-compose input{
    flex:1;border:1px solid var(--line);border-radius:12px;background:#0a1810;
    color:var(--txt);padding:11px 12px;font-size:16px;outline:none;
  }
  .chat-compose input:focus{border-color:#6dcf7a}

  @media(min-width:360px) and (orientation:portrait){ :root{--chip-h:92px} }
  @media(min-width:390px) and (orientation:portrait){ :root{--chip-h:96px} }

  @media (orientation: landscape), (min-width: 600px){
    body{overflow:hidden}
    header{
      padding:4px 8px;
      padding-top:max(4px, env(safe-area-inset-top, 0px));
      gap:5px;flex-wrap:nowrap;
    }
    h1{font-size:.8rem}
    .btn{padding:5px 8px;font-size:10px}
    .btn.send{padding:8px 12px;border-radius:10px;font-size:13px}

    main{
      display:grid;
      grid-template-columns:minmax(52px,72px) minmax(0,1fr);
      grid-template-areas:"cams course";
      gap:4px;
      padding:4px;
      padding-bottom:0;
      max-width:100%;
      flex:1;
      min-height:0;
    }
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;
    }
    .panel h2{font-size:10px;opacity:.85;padding:0 0 4px;letter-spacing:.03em}
    .hint{display:none}

    .cams{
      order:unset;grid-area:cams;flex:unset;max-height:none;min-height:0;
      border:1px solid var(--line);background:var(--card);padding:4px;
      display:flex;flex-direction:column;
    }
    .cams h2{font-size:9px;padding:0 0 2px}
    .room-note{display:none}
    .vids{
      flex-direction:column;overflow:auto;overflow-x:hidden;
      padding:6px 2px 2px;gap:10px;flex:1;min-height:0;scroll-snap-type:none;
    }
    .tile{
      width:100%;height:auto;max-height:none;aspect-ratio:3/4;
      border-radius:8px;flex:0 0 auto;
    }
    .tile .name{left:3px;bottom:3px;padding:1px 5px;border-radius:6px;font-size:9px}
    .tile .badge{right:3px;top:3px;padding:1px 4px;border-radius:6px;font-size:8px}
    .like-float{font-size:18px}
    .react-bar{padding:4px 6px 6px;gap:4px;background:transparent}.react{height:30px;font-size:14px}
    .react{min-width:32px;height:30px;font-size:15px;padding:0 6px}

    .course{
      order:unset;grid-area:course;flex:unset;min-height:0;
      border:1px solid var(--line);background:var(--card);
      padding:4px;
    }
    .course h2{padding:0 0 2px;font-size:10px}
    .course iframe{border-radius:8px;flex:1;min-height:0;height:auto}

    .chat-backdrop{align-items:center;padding:16px}
    .chat-modal{
      border-radius:16px;max-height:min(80dvh, 560px);
      width:min(92vw, 420px);box-shadow:0 16px 48px #000a;
    }
  }

  @media(min-width:901px){
    body{overflow:auto}
    header{padding:10px 14px;gap:8px;flex-wrap:wrap}
    h1{font-size:1rem}
    .btn{padding:10px 14px;font-size:13px}
    .btn.send{padding:8px 14px;border-radius:10px;font-size:13px}

    main{
      grid-template-columns:minmax(88px,110px) minmax(0,1fr);
      gap:10px;padding:10px;padding-bottom:0;max-width:1400px;
    }
    .panel{border-radius:16px;padding:10px}
    .panel h2{font-size:13px;opacity:.9;padding:0 0 8px}
    .hint{display:block;font-size:12px;opacity:.85;line-height:1.45;margin-bottom:8px}
    .cams{padding-bottom:0}
    .vids{gap:18px;padding-top:28px}
    .tile{border-radius:14px}
    .tile .name{left:6px;bottom:6px;padding:2px 7px;border-radius:8px;font-size:11px}
    .tile .badge{right:6px;top:6px;padding:2px 7px;border-radius:8px;font-size:10px}
    .like-float{font-size:24px}
    .react-bar{padding:6px 8px 8px;gap:6px}.vol-bar{padding:4px 8px 2px}
    .react{min-width:40px;height:36px;font-size:18px}
    .course{border-radius:16px}
    .course h2{padding:0 0 8px}

  });

}

  if (!el) return;

}

  setClassroomVolume(saved);

  if (slider) {

function getPublishLp(){
  return (room && room.localParticipant)

    || null;
}
async function publishRoomData(obj, { reliable = true } = {}){
  const lp = getPublishLp();
  if (!lp) return false;
  try {
    const data = new TextEncoder().encode(JSON.stringify(obj));
    await lp.publishData(data, { reliable });
    return true;
  } catch (e) {
    log('系统：同步发送失败: ' + (e.message || e));
    return false;
  }
}

}

  });
  setTimeout(() => { applyingRemoteSkel = false; }, 120);
}

  const d = ev && ev.data;

  if (d.type === 'skel-sync') {
    if (applyingRemoteSkel) return;
    publishRoomData({
      t: 'skel',
      camera: d.camera,
      target: d.target,
      sun: d.sun,
    }, { reliable: false });
    return;
  }
  if (d.type === 'skel-step' && typeof d.n === 'number') {
    if (applyingRemoteSkel) return;
    publishRoomData({ t: 'skel_step', n: d.n }, { reliable: true });
  }
});

  if (ov) ov.textContent = courseData.overview || '';

  }

function goCourseStep(idx, { speak = true, publish = true } = {}){
  if (!courseData || !courseData.steps || !courseData.steps.length) return;
  const i = Math.max(0, Math.min(courseData.steps.length - 1, idx));
  courseStepIdx = i;
  showCourseStepsUi();
  markCourseStepActive(i);
  const step = courseData.steps[i];
  if (step && typeof step.skelStep === 'number') {
    applyingRemoteSkel = true;
    postToCourse({ type: 'skel-set-step', n: step.skelStep });

  if (myRole === 'mom') return 'tile-mom';
  return 'tile-dad';
}
function isEmojiOnly(text){
  const t = String(text || '').trim();
  if (!t) return false;
  if (REACTIONS.has(t)) return true;
  // short emoji / bang
  return /^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}！!]{1,4}$/u.test(t);
}
function ensureLikeLayer(tileEl){
  let layer = tileEl.querySelector(':scope > .like-layer');
  if (!layer) {
    layer = document.createElement('div');
    layer.className = 'like-layer';
    layer.setAttribute('aria-hidden', 'true');
    tileEl.appendChild(layer);
  }
  return layer;
}
function spawnLikeFloat(tileEl, emoji){
  if (!tileEl) return;
  const layer = ensureLikeLayer(tileEl);
  const count = 3 + Math.floor(Math.random() * 2); // 3–4 floats like Douyin burst
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'like-float';
    el.textContent = emoji;
    const dx = (Math.random() * 48 - 24).toFixed(1) + 'px';
    const rot = (Math.random() * 28 - 14).toFixed(1) + 'deg';
    el.style.setProperty('--dx', dx);
    el.style.setProperty('--rot', rot);
    el.style.left = (42 + Math.random() * 16) + '%';
    el.style.bottom = (36 + Math.random() * 18) + '%';
    el.style.animationDelay = (i * 0.07).toFixed(2) + 's';
    el.style.fontSize = (18 + Math.random() * 10).toFixed(0) + 'px';
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}
function showBubble(tileEl, text){
  /* speech bubbles removed — only Douyin float likes for reactions */
  if (!tileEl) return;
  const t = String(text || '').trim();
  if (!t) return;
  if (REACTIONS.has(t) || isEmojiOnly(t)) spawnLikeFloat(tileEl, t);
}
function setXiaoyuMood(mood){
  const el = document.getElementById('tile-xiaoyu');
  if (!el) return;
  const allowed = ['idle','happy','star'];
  const m = allowed.includes(mood) ? mood : 'idle';
  el.classList.remove('mood-idle','mood-happy','mood-star','expr-smile','expr-surprise','expr-think','expr-cheer');
  el.classList.add('mood-' + m);
  const badge = document.getElementById('rainBadge');
  if (badge && !badge.textContent.startsWith('离线')) {
    // Prefer speak-mode badge; mood is visual on the avatar only
    if (typeof xiaoyuSpeakActive !== 'undefined' && xiaoyuSpeakActive) badge.textContent = '在线·可开口';
    else badge.textContent = m === 'happy' ? '在线·开心' : m === 'star' ? '在线·明星' : '在线·静默';
  }
  if (xyExprTimer) clearTimeout(xyExprTimer);
  if (m !== 'idle') {
    xyExprTimer = setTimeout(() => setXiaoyuMood('idle'), 4200);
  }
}
function setXiaoyuExpr(kind){
  // map legacy reaction kinds → moods
  if (kind === 'cheer' || kind === 'surprise') setXiaoyuMood('star');
  else if (kind === 'smile' || kind === 'think') setXiaoyuMood('happy');
  else if (!kind) setXiaoyuMood('idle');
  else setXiaoyuMood('happy');
}
function cycleXiaoyuMood(){
  const el = document.getElementById('tile-xiaoyu');
  const order = ['idle','happy','star'];
  let cur = 'idle';
  for (const m of order) if (el.classList.contains('mood-' + m)) cur = m;
  const next = order[(order.indexOf(cur) + 1) % order.length];
  setXiaoyuMood(next);
  /* mood visual only — no text bubble */
}
function maybeXiaoyuReact(who, text, identity){
  const tileId = whoToTileId(who, identity);
  if (tileId === 'tile-xiaoyu') {
    const expr = XY_EXPR[String(text||'').trim()] || (isEmojiOnly(text) ? 'cheer' : 'smile');
    setXiaoyuExpr(expr);
    return;
  }
  const expr = XY_EXPR[String(text||'').trim()];
  if (expr === 'surprise' || expr === 'cheer') setXiaoyuExpr(expr);
  else if (expr === 'smile') setXiaoyuMood('happy');
}
function presentMessage(who, text, identity){
  appendChat(who, text);
  const tile = document.getElementById(whoToTileId(who, identity));
  showBubble(tile, text);
  maybeXiaoyuReact(who, text, identity);
}

function markMeTile(){

  if (!myRole) return;

function ensureVideoTile(id, name){
  let el;
  if (id === 'dad' || id === 'local-dad') el = document.getElementById('tile-dad');
  else if (id === 'lucas' || id === 'kid') el = document.getElementById('tile-kid');
  else if (id === 'mom' || id === 'chunyan') el = document.getElementById('tile-mom');
  else if (isXiaoyuIdentity(id)) el = document.getElementById('tile-xiaoyu');
  else {
    el = document.getElementById('tile-'+id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'tile'; el.id = 'tile-'+id;
      el.innerHTML = '<div class="tile-inner"><img class="avatar" alt=""/><video autoplay playsinline muted hidden></video><div class="badge">卡通</div><div class="name"></div><div class="tile-spin" aria-hidden="true"><span>打开中…</span></div></div>';
      vids.insertBefore(el, document.getElementById('tile-xiaoyu'));

function setTileLoading(el, on){
  if (!el) return;
  el.classList.toggle('loading', !!on);
  el.setAttribute('aria-busy', on ? 'true' : 'false');
  let spin = el.querySelector('.tile-spin');
  if (on && !spin) {
    spin = document.createElement('div');
    spin.className = 'tile-spin';
    spin.setAttribute('aria-hidden', 'true');
    spin.innerHTML = '<span>打开中…</span>';
    const inner = el.querySelector('.tile-inner') || el;
    inner.appendChild(spin);
  }
}
function showLiveCamera(el, track){
  const v = el.querySelector('video');
  const img = el.querySelector('img.avatar');
  const badge = el.querySelector('.badge');
  if (!v) return;
  track.attach(v);
  v.hidden = false;
  v.muted = (el.id === 'tile-dad' || el.id === 'tile-kid' || el.id === 'tile-mom');
  applyVolumeToVideo(v);
  el.classList.add('live');
  setTileLoading(el, false);
  if (img) img.style.display = 'none';
  if (badge) badge.textContent = '摄像头';
}
function setRainOnline(on, detail){

  const badge = document.getElementById('rainBadge');
  if (!on) badge.textContent = '离线';
  else if (detail) badge.textContent = detail;
  else if (!/^在线/.test(badge.textContent)) badge.textContent = '在线·静默';
}
async function joinRainPresence(){
  try {
    const rainRoom = new Room();
    await rainRoom.connect(URL_WS, TOKENS.rain);
    setRainOnline(true, '在线·静默');
    setXiaoyuMood('idle');
    log('系统：小雨已进同房（数字人旁听）');
    rainRoom.on(RoomEvent.DataReceived, (payload, participant) => {
      try {
        if (room) return;
        const raw = new TextDecoder().decode(payload);
        handleRoomDataMessage(JSON.parse(raw), participant);
      } catch (_) {}
    });
    window.__rainRoom = rainRoom;
  } catch (e) {
    setRainOnline(true, '在线·示意');
    log('系统：小雨旁听: ' + (e.message||e));
  }
}
function applyXiaoyuSpeakUi(on){
  xiaoyuSpeakActive = !!on;
  const el = document.getElementById('tile-xiaoyu');
  if (el) el.classList.toggle('speaking', xiaoyuSpeakActive);
  const badge = document.getElementById('rainBadge');
  if (badge) {
    if (!el || !el.classList.contains('online')) badge.textContent = '离线';
    else badge.textContent = xiaoyuSpeakActive ? '在线·可开口' : '在线·静默';
  }
  if (xiaoyuSpeakActive) setXiaoyuMood('happy');
  else setXiaoyuMood('idle');
}
async function publishXiaoyuActive(on){
  const payload = new TextEncoder().encode(JSON.stringify({ t: 'xiaoyu_active', on: !!on }));
  const lp = (room && room.localParticipant)
    || (window.__rainRoom && window.__rainRoom.localParticipant);
  if (!lp) {
    log('系统：请先点爸爸/妈妈/芃芃头像进房，再点小雨开口');
    return false;
  }
  try {
    await lp.publishData(payload, { reliable: true });
    return true;
  } catch (e) {
    log('系统：无法通知小雨开口: ' + (e.message || e));
    return false;
  }
}
async function toggleXiaoyuSpeak(){
  const next = !xiaoyuSpeakActive;
  // Optimistic UI; listener echoes xiaoyu_active for sync
  applyXiaoyuSpeakUi(next);
  if (next) setXiaoyuMood('star'); // brief "activated" feedback; mood cycle still available via apply
  const ok = await publishXiaoyuActive(next);
  if (!ok) applyXiaoyuSpeakUi(false);
  else log(next ? '系统：已点小雨 — 可以开口（再点静音）' : '系统：小雨已静音旁听');
}
function handleRoomDataMessage(msg, participant){
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'xiaoyu_active') {
    applyXiaoyuSpeakUi(!!msg.on);
    return;
  }
  if (msg.t === 'skel') {
    applySkelFromNet(msg);
    return;
  }
  if (msg.t === 'skel_step' && typeof msg.n === 'number') {
    applyingRemoteSkel = true;
    postToCourse({ type: 'skel-set-step', n: msg.n });
    setTimeout(() => { applyingRemoteSkel = false; }, 120);
    return;
  }
  if (msg.t === 'course') {
    applyCourseFromNet(msg);
    return;
  }
  if (msg.t === 'heard' && typeof msg.text === 'string') {
    const who = msg.who || '家人';
    const wake = !!msg.wake;
    // STT log only — no avatar text bubbles
    log(wake
      ? `小雨听到了（喊到她）：[${who}] ${msg.text}`
      : `小雨听到了：[${who}] ${msg.text}`);
    return;
  }
  if (msg.t === 'chat' && typeof msg.text === 'string') {
    const who = (msg.who) || (participant && (participant.name || participant.identity)) || '对方';
    const identity = msg.id || (participant && participant.identity);
    const fromXy = isXiaoyuIdentity(identity) || who === '小雨';
    // Gate 小雨 reply bubbles/chat behind speak mode (system messages always ok)
    if (fromXy && who !== '系统' && !xiaoyuSpeakActive) return;
    presentMessage(who, msg.text, identity);
    if (fromXy && who === '小雨') {
      setXiaoyuMood(msg.mood === 'star' ? 'star' : 'happy');
    }
  }
}
function setupChatHandlers(r){
  r.on(RoomEvent.DataReceived, (payload, participant) => {
    try {
      const raw = new TextDecoder().decode(payload);
      handleRoomDataMessage(JSON.parse(raw), participant);
    } catch (_) { /* ignore non-chat */ }
  });
}
async function publishChat(text){
  const t = String(text || '').trim();
  if (!t) return;
  if (!myRole) {
    presentMessage(myChatName, t, null);
    log('系统：还没进房，气泡仅本地可见。点头像（爸爸/妈妈/芃芃）进同房后可同步。');
    return;
  }
  const identity = myRole === 'kid' ? 'lucas' : myRole;
  presentMessage(myChatName, t, identity);
  if (room && room.localParticipant) {
    try {
      const data = new TextEncoder().encode(JSON.stringify({ t: 'chat', who: myChatName, text: t, id: identity }));
      await room.localParticipant.publishData(data, { reliable: true });
    } catch (e) {
      log('系统：发送失败（本地已冒泡）: ' + (e.message||e));
    }
  }
}
async function sendChat(){
  const text = (chatInput.value || '').trim();
  if (!text) return;
  chatInput.value = '';
  await publishChat(text);
  closeChat();
}
function bindReactButtons(root){
  root.querySelectorAll('[data-react]').forEach(btn => {
    btn.addEventListener('click', () => {

      if (v) publishChat(v);
    });
  });
}

let joining = false;
async function leaveRoom({ keepRain = false } = {}){
  const prev = myRole;
  if (room) {
    try { await room.disconnect(); } catch(_){}
    room = null;
  }
  if (!keepRain && window.__rainRoom) {
    try { await window.__rainRoom.disconnect(); } catch(_){}
    window.__rainRoom = null;
    setRainOnline(false);
  }
  if (prev) resetLocalCameraTile(prev);
  myRole = null;
  myChatName = '我';
  markMeTile();
  document.getElementById('leave').disabled = true;
}
async function join(role){
  if (!TOKENS[role]) { log('系统：未知角色 ' + role); return; }
  if (joining) return;
  if (myRole === role && room) {
    log('系统：你已经是' + (role==='dad'?'爸爸':role==='mom'?'妈妈':'芃芃') + '，摄像头已开');
    return;
  }
  joining = true;
  const tileMap = { dad:'tile-dad', kid:'tile-kid', mom:'tile-mom' };
  const loadingTile = document.getElementById(tileMap[role]);
  setTileLoading(loadingTile, true);
  try {
    if (room) {
      log('系统：切换角色，先离开再以新身份进同房…');
      await leaveRoom({ keepRain: true });
      setTileLoading(loadingTile, true);
    }
    room = new Room({ adaptiveStream: true, dynacast: true });
    setupChatHandlers(room);
    room.on(RoomEvent.TrackSubscribed, (track, _pub, participant) => {
      // One 小雨 only: cartoon tile. Never spawn tile for xiaoyu / xiaoyu-listener.
      if (isXiaoyuIdentity(participant.identity)) {
        setRainOnline(true, xiaoyuSpeakActive ? '在线·可开口' : '在线·静默');
        if (track.kind === Track.Kind.Audio) attachRemoteAudio(track);
        return;
      }
      const el = ensureVideoTile(participant.identity, participant.name || participant.identity);
      if (track.kind === Track.Kind.Video) showLiveCamera(el, track);
      if (track.kind === Track.Kind.Audio) attachRemoteAudio(track);
    });
    room.on(RoomEvent.ParticipantConnected, (p) => {
      if (isXiaoyuIdentity(p.identity)) {
        setRainOnline(true, xiaoyuSpeakActive ? '在线·可开口' : '在线·静默');
        return;
      }
      log('系统：同房有人进：' + (p.name||p.identity));
    });
    room.on(RoomEvent.TrackUnsubscribed, (track) => track.detach());
    room.on(RoomEvent.Disconnected, () => {
      // ignore disconnect during intentional switch (joining may still be true)
      if (joining) return;
      log('系统：已离开同房');
      if (myRole) resetLocalCameraTile(myRole);
      room = null; myRole = null; myChatName = '我';
      markMeTile();
      document.getElementById('leave').disabled = true;
    });
    const label = role === 'dad' ? '爸爸' : role === 'mom' ? '妈妈' : '芃芃（伍澍暘）';
    log('系统：进入同房「chengzhangwu」作为 ' + label + ' …');
    await room.connect(URL_WS, TOKENS[role]);
    log('系统：已进同房: ' + room.name + ' · 身份=' + room.localParticipant.identity + ' · 一家人一起上课');
    myRole = role;
    const localId = role === 'dad' ? 'dad' : role === 'mom' ? 'mom' : 'lucas';
    myChatName = role === 'dad' ? '爸爸' : role === 'mom' ? '妈妈' : '芃芃';
    const localName = myChatName + '（我）';
    try {
      const tracks = await createLocalTracks({ audio: true, video: true });
      const local = ensureVideoTile(localId, localName);
      for (const track of tracks) {
        if (track.kind === Track.Kind.Video) showLiveCamera(local, track);
        await room.localParticipant.publishTrack(track);
      }
      log('系统：已打开摄像头并发布到同房');
    } catch (camErr) {
      ensureVideoTile(localId, localName + '·无摄像头');
      setTileLoading(loadingTile, false);
      log('系统：摄像头不可用（已进同房）: ' + camErr.message);
    }
    markMeTile();
    document.getElementById('leave').disabled = false;
    if (!window.__rainRoom) await joinRainPresence();
    /* no auto welcome bubble */
  } catch (joinErr) {
    setTileLoading(loadingTile, false);
    throw joinErr;
  } finally {
    joining = false;
    // If still not live (e.g. connect failed before tracks), drop spinner
    if (loadingTile && !loadingTile.classList.contains('live')) setTileLoading(loadingTile, false);
  }
}

function getFullscreenElement(){
  return document.fullscreenElement
    || document.webkitFullscreenElement
    || document.webkitCurrentFullScreenElement
    || document.msFullscreenElement
    || null;
}
function syncFsButton(){
  const on = !!getFullscreenElement();
  if (!courseFsBtn) return;
  courseFsBtn.classList.toggle('is-fs', on);
  courseFsBtn.setAttribute('aria-label', on ? '退出全屏' : '全屏');
  courseFsBtn.title = on ? '退出全屏' : '全屏';
  courseFsBtn.textContent = on ? '✕' : '⛶';
}
async function requestPageFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen
    || el.webkitRequestFullscreen
    || el.webkitRequestFullScreen
    || el.msRequestFullscreen;
  if (req) {
    await req.call(el, { navigationUI: 'hide' }).catch(() => req.call(el));
    return;
  }
  // iOS Safari sometimes only allows video; try body as fallback
  const bodyReq = document.body.requestFullscreen
    || document.body.webkitRequestFullscreen
    || document.body.webkitRequestFullScreen;
  if (bodyReq) {
    await bodyReq.call(document.body);
    return;
  }
  throw new Error('此浏览器不支持全屏');
}
async function exitPageFullscreen(){
  const ex = document.exitFullscreen
    || document.webkitExitFullscreen
    || document.webkitCancelFullScreen
    || document.msExitFullscreen;
  if (ex) await ex.call(document);
}
async function togglePageFullscreen(){
  if (getFullscreenElement()) await exitPageFullscreen();
  else await requestPageFullscreen();
  syncFsButton();
}
['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(ev => {
  document.addEventListener(ev, syncFsButton);
});
if (courseFsBtn) {
  courseFsBtn.addEventListener('click', (e) => {

    togglePageFullscreen().catch(err => log('系统：全屏失败: ' + (err && err.message ? err.message : err)));
  });
}
