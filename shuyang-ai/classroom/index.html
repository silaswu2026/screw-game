<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>成长屋共学教室</title>
<style>
  :root{
    --bg:#0b1a12;--card:#12261a;--line:#2a5a3a;--txt:#e8f5ea;--chat-bg:#0e1f14;
    --safe-b:env(safe-area-inset-bottom,0px);
    --chip-h:88px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    background:radial-gradient(900px 480px at 50% -8%,#1a3a24,var(--bg));
    color:var(--txt);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ===== MOBILE-FIRST (WeChat ~390px) ===== */
  header{
    padding:8px 10px;
    padding-top:max(8px, env(safe-area-inset-top, 0px));
    display:flex;
    gap:6px;
    flex-wrap:nowrap;
    align-items:center;
    border-bottom:1px solid #234;
    flex-shrink:0;
    background:#0d1f14ee;
    backdrop-filter:blur(8px);
    z-index:20;
  }
  h1{
    font-size:.92rem;
    margin:0;
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .btn{
    border:0;border-radius:999px;
    padding:8px 11px;
    font-weight:800;
    font-size:12px;
    cursor:pointer;
    background:linear-gradient(180deg,#78d484,#4ea85c);
    color:#083018;
    flex-shrink:0;
    white-space:nowrap;
  }
  .btn.ghost{background:#1c3324;color:var(--txt);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .btn.send{padding:10px 14px;border-radius:12px;font-size:14px}

  main{
    flex:1;
    min-height:0;
    width:100%;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:0;
    padding:0;
    max-width:100%;
  }

  .panel{
    background:var(--card);
    border:0;
    border-radius:0;
    padding:0;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .panel h2{
    margin:0;
    font-size:11px;
    font-weight:700;
    opacity:.75;
    letter-spacing:.04em;
    padding:6px 10px 0;
  }
  .hint{display:none}

  /* Course: largest on phone — almost full width, top */
  .course{
    order:1;
    flex:1.35 1 0;
    min-height:0;
    border-bottom:1px solid var(--line);
  }
  .course h2{padding-bottom:4px}
  .course iframe{
    width:100%;
    flex:1;
    min-height:0;
    border:0;
    border-radius:0;
    background:#000;
  }

  /* Cams: horizontal portrait chips under course */
  .cams{
    order:2;
    flex:0 0 auto;
    border-bottom:1px solid var(--line);
    background:#0f2218;
  }
  .cams h2{padding:6px 10px 4px}
  .vids{
    display:flex;
    flex-direction:row;
    gap:8px;
    padding:0 10px 10px;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
  }
  .vids::-webkit-scrollbar{display:none}
  .tile{
    background:#000;
    border-radius:14px;
    aspect-ratio:3/4;
    height:var(--chip-h);
    width:auto;
    overflow:hidden;
    position:relative;
    border:2px solid transparent;
    flex:0 0 auto;
    scroll-snap-align:start;
  }
  .tile.online{border-color:#6dcf7a}
  .tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile .name{
    position:absolute;left:4px;bottom:4px;
    background:#000a;padding:1px 6px;border-radius:7px;font-size:10px;
  }
  .tile .badge{
    position:absolute;right:4px;top:4px;
    background:#1e7a3a;padding:1px 5px;border-radius:7px;font-size:9px;font-weight:700;
  }
  .tile.rain{background:linear-gradient(160deg,#1a3d2a,#0d2418)}
  .tile img.avatar{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
  .tile.live video{display:block;width:100%;height:100%;object-fit:cover}
  .tile.live img.avatar{display:none}
  .tile.live .badge{background:#2a6fd4}
  .xy-bob{animation:xyBob 2.4s ease-in-out infinite;transform-origin:center bottom}
  @keyframes xyBob{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-6px) scale(1.02)}
  }
  .tile.rain.online{box-shadow:0 0 0 2px #6dcf7a, 0 0 14px #6dcf7a66}
  .tile.rain.speaking .xy-bob{animation-duration:0.9s}

  /* Chat: bottom sheet — thumb reach */
  .chat{
    order:3;
    flex:0 0 auto;
    max-height:38dvh;
    min-height:148px;
    background:#0c1c13;
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    box-shadow:0 -8px 28px #0006;
    padding-bottom:max(8px, var(--safe-b));
    z-index:15;
  }
  .chat h2{padding:8px 12px 4px}
  #log{
    flex:1;
    font-size:12px;
    opacity:.92;
    white-space:pre-wrap;
    overflow:auto;
    background:var(--chat-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    margin:0 10px 8px;
    min-height:64px;
    max-height:22dvh;
    line-height:1.45;
    -webkit-overflow-scrolling:touch;
  }
  .chat-compose{
    display:flex;
    gap:8px;
    flex-shrink:0;
    padding:0 10px 4px;
  }
  .chat-compose input{
    flex:1;
    border:1px solid var(--line);
    border-radius:12px;
    background:#0a1810;
    color:var(--txt);
    padding:11px 12px;
    font-size:16px; /* avoid iOS zoom */
    outline:none;
  }
  .chat-compose input:focus{border-color:#6dcf7a}

  /* Slightly larger chips on tall portrait phones */
  @media(min-width:360px) and (orientation:portrait){
    :root{--chip-h:92px}
  }
  @media(min-width:390px) and (orientation:portrait){
    :root{--chip-h:96px}
  }

  /* ===== LANDSCAPE / WIDE: cams | chat | course (横版) =====
     Phone held sideways, or any viewport ≥600px — horizontal 3-zone
     before waiting for the 901px desktop polish. */
  @media (orientation: landscape), (min-width: 600px){
    body{overflow:hidden}
    header{
      padding:4px 8px;
      padding-top:max(4px, env(safe-area-inset-top, 0px));
      gap:6px;
      flex-wrap:nowrap;
    }
    h1{font-size:.85rem}
    .btn{padding:6px 10px;font-size:11px}
    .btn.send{padding:8px 12px;border-radius:10px;font-size:13px}

    main{
      display:grid;
      grid-template-columns:minmax(72px,110px) minmax(140px,1fr) minmax(0,2.4fr);
      grid-template-areas:"cams chat course";
      gap:6px;
      padding:6px;
      padding-bottom:max(6px, env(safe-area-inset-bottom, 0px));
      max-width:100%;
      flex:1;
      min-height:0;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      padding:6px;
    }
    .panel h2{
      font-size:10px;
      opacity:.85;
      padding:0 0 4px;
      letter-spacing:.03em;
    }
    .hint{display:none}

    .cams{
      order:unset;
      grid-area:cams;
      flex:unset;
      max-height:none;
      min-height:0;
      border:1px solid var(--line);
      background:var(--card);
    }
    .vids{
      flex-direction:column;
      overflow:auto;
      overflow-x:hidden;
      padding:0;
      gap:5px;
      flex:1;
      min-height:0;
      scroll-snap-type:none;
      -webkit-overflow-scrolling:touch;
    }
    .tile{
      width:100%;
      height:auto;
      max-height:none;
      aspect-ratio:3/4;
      border-radius:10px;
      flex:0 0 auto;
    }
    .tile .name{left:3px;bottom:3px;padding:1px 5px;border-radius:6px;font-size:9px}
    .tile .badge{right:3px;top:3px;padding:1px 4px;border-radius:6px;font-size:8px}

    .chat{
      order:unset;
      grid-area:chat;
      flex:unset;
      max-height:none;
      min-height:0;
      border-radius:12px;
      border:1px solid var(--line);
      box-shadow:none;
      background:var(--card);
      padding-bottom:6px;
    }
    .chat h2{padding:0 0 4px}
    #log{
      margin:0 0 6px;
      min-height:0;
      max-height:none;
      flex:1;
      padding:6px 8px;
      font-size:11px;
      line-height:1.4;
      border-radius:8px;
    }
    .chat-compose{padding:0;gap:6px}
    .chat-compose input{
      font-size:14px;
      padding:8px 10px;
      border-radius:10px;
    }

    .course{
      order:unset;
      grid-area:course;
      flex:unset;
      min-height:0;
      border:1px solid var(--line);
      background:var(--card);
    }
    .course h2{padding:0 0 4px}
    .course iframe{
      border-radius:8px;
      flex:1;
      min-height:0;
      height:auto;
    }
  }

  /* ===== DESKTOP polish (≥901px) ===== */
  @media(min-width:901px){
    body{overflow:auto}
    header{padding:10px 14px;gap:8px;flex-wrap:wrap}
    h1{font-size:1rem}
    .btn{padding:10px 16px;font-size:14px}
    .btn.send{padding:8px 14px;border-radius:10px;font-size:13px}

    main{
      grid-template-columns:minmax(120px,150px) minmax(200px,1fr) minmax(0,2.6fr);
      gap:10px;
      padding:10px;
      max-width:1400px;
    }
    .panel{
      border-radius:16px;
      padding:10px;
    }
    .panel h2{font-size:13px;opacity:.9;padding:0 0 8px}
    .hint{display:block;font-size:12px;opacity:.85;line-height:1.45;margin-bottom:8px}

    .cams{background:var(--card)}
    .vids{gap:8px}
    .tile{
      border-radius:14px;
    }
    .tile .name{left:6px;bottom:6px;padding:2px 7px;border-radius:8px;font-size:11px}
    .tile .badge{right:6px;top:6px;padding:2px 7px;border-radius:8px;font-size:10px}

    .chat{
      min-height:280px;
      border-radius:16px;
      padding-bottom:10px;
    }
    .chat h2{padding:0 0 8px}
    #log{
      margin:0 0 8px;
      min-height:160px;
      padding:10px;
      font-size:12px;
      line-height:1.5;
      border-radius:10px;
    }
    .chat-compose{gap:8px}
    .chat-compose input{font-size:13px;padding:8px 10px;border-radius:10px}

    .course{border-radius:16px}
    .course h2{padding:0 0 8px}
    .course iframe{
      border-radius:12px;
      min-height:min(72vh,640px);
    }
  }
</style>
</head>
<body>
<header>
  <h1>成长屋共学教室</h1>
  <button class="btn" id="joinDad">爸爸进房</button>
  <button class="btn" id="joinKid">芃芃进房</button>
  <button class="btn ghost" id="leave" disabled>离开</button>
</header>
<main>
  <section class="panel course">
    <h2>课程同屏</h2>
    <iframe title="course" src="../learn/skeleton.html?v=mc14"></iframe>
  </section>

  <section class="panel cams">
    <h2>画面</h2>
    <div class="hint">竖屏卡通形象；进房开摄像头后换成真人。小雨保持角色动画。</div>
    <div class="vids" id="vids">
      <div class="tile online" id="tile-dad">
        <img class="avatar" src="../avatars/dad-wuxin.jpg" alt="爸爸"/>
        <video autoplay playsinline muted hidden></video>
        <div class="badge">卡通</div>
        <div class="name">爸爸</div>
      </div>
      <div class="tile online" id="tile-kid">
        <img class="avatar" src="../avatars/pengpeng.jpg" alt="芃芃"/>
        <video autoplay playsinline muted hidden></video>
        <div class="badge">卡通</div>
        <div class="name">芃芃</div>
      </div>
      <div class="tile online" id="tile-mom">
        <img class="avatar" src="../avatars/mom-chunyan.jpg" alt="妈妈"/>
        <video autoplay playsinline muted hidden></video>
        <div class="badge">卡通</div>
        <div class="name">妈妈</div>
      </div>
      <div class="tile rain online" id="tile-xiaoyu">
        <img class="avatar xy-bob" src="../avatars/xiaoyu.jpg" alt="小雨"/>
        <div class="badge" id="rainBadge">在线·待命</div>
        <div class="name">小雨</div>
      </div>
    </div>
  </section>

  <section class="panel chat">
    <h2>聊天</h2>
    <pre id="log"></pre>
    <div class="chat-compose">
      <input type="text" id="chatInput" placeholder="说点什么…" maxlength="500" autocomplete="off"/>
      <button class="btn send" id="chatSend" type="button">发送</button>
    </div>
  </section>
</main>
<script type="module">
import { Room, RoomEvent, createLocalTracks, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client@2.9.9/+esm';
const URL_WS = "wss://lucas-jqrm4vbp.livekit.cloud";
const TOKENS = {"dad": "eyJhbGciOiJIUzI1NiJ9.eyJuYW1lIjoi54i454i4IiwidmlkZW8iOnsicm9vbUpvaW4iOnRydWUsInJvb20iOiJjaGVuZ3poYW5nd3UiLCJjYW5QdWJsaXNoIjp0cnVlLCJjYW5TdWJzY3JpYmUiOnRydWV9LCJpc3MiOiJBUEluN0dxWjJMSjVqTm0iLCJleHAiOjE3OTU4NTY1OTIsIm5iZiI6MTc5MzI2NDU5Miwic3ViIjoiZGFkIn0.q7ont9o7nqmVxFyxYBH3ALqj09Z6m1flYMAgsNEDaHU", "kid": "eyJhbGciOiJIUzI1NiJ9.eyJuYW1lIjoi6IqD6IqDIiwidmlkZW8iOnsicm9vbUpvaW4iOnRydWUsInJvb20iOiJjaGVuZ3poYW5nd3UiLCJjYW5QdWJsaXNoIjp0cnVlLCJjYW5TdWJzY3JpYmUiOnRydWV9LCJpc3MiOiJBUEluN0dxWjJMSjVqTm0iLCJleHAiOjE3OTU4NTY1OTIsIm5iZiI6MTc5MzI2NDU5Miwic3ViIjoibHVjYXMifQ.9i_fVBr5Tu8ES-VSO_juYjLb5HGXGJTamXMomdYQY8k", "rain": "eyJhbGciOiJIUzI1NiJ9.eyJuYW1lIjoi5bCP6ZuoIiwidmlkZW8iOnsicm9vbUpvaW4iOnRydWUsInJvb20iOiJjaGVuZ3poYW5nd3UiLCJjYW5QdWJsaXNoIjp0cnVlLCJjYW5TdWJzY3JpYmUiOnRydWV9LCJpc3MiOiJBUEluN0dxWjJMSjVqTm0iLCJleHAiOjE3OTU4NTY1OTIsIm5iZiI6MTc5MzI2NDU5Miwic3ViIjoieGlhb3l1In0.7jL1nsyCmFYK6XqGLNHp8xLDAtByQ_n6_zv2hH-3eBA"};
const logEl = document.getElementById('log');
const vids = document.getElementById('vids');
const chatInput = document.getElementById('chatInput');
function log(m){ logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log(m); }
function appendChat(who, text){
  const line = who ? `[${who}] ${text}` : text;
  log(line);
}
let room = null;
let myChatName = '我';

function ensureVideoTile(id, name){
  let el;
  if (id === 'dad' || id === 'local-dad') el = document.getElementById('tile-dad');
  else if (id === 'lucas' || id === 'kid') el = document.getElementById('tile-kid');
  else {
    el = document.getElementById('tile-'+id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'tile'; el.id = 'tile-'+id;
      el.innerHTML = '<img class="avatar" alt=""/><video autoplay playsinline muted hidden></video><div class="badge">卡通</div><div class="name"></div>';
      vids.insertBefore(el, document.getElementById('tile-xiaoyu'));
    }
  }
  el.querySelector('.name').textContent = name;
  el.classList.add('online');
  return el;
}
function showLiveCamera(el, track){
  const v = el.querySelector('video');
  const img = el.querySelector('img.avatar');
  const badge = el.querySelector('.badge');
  if (!v) return;
  track.attach(v);
  v.hidden = false;
  v.muted = (el.id === 'tile-dad' || el.id === 'tile-kid');
  el.classList.add('live');
  if (img) img.style.display = 'none';
  if (badge) badge.textContent = '摄像头';
}
function setRainOnline(on, detail){
  document.getElementById('tile-xiaoyu').classList.toggle('online', !!on);
  document.getElementById('rainBadge').textContent = on ? (detail || '在线·听你们') : '离线';
}
async function joinRainPresence(){
  try {
    const rainRoom = new Room();
    await rainRoom.connect(URL_WS, TOKENS.rain);
    setRainOnline(true, '在线·听你们');
    log('系统：小雨已进房（旁听席）');
    window.__rainRoom = rainRoom;
  } catch (e) {
    setRainOnline(true, '在线·示意');
    log('系统：小雨旁听: ' + (e.message||e));
  }
}
function setupChatHandlers(r){
  r.on(RoomEvent.DataReceived, (payload, participant) => {
    try {
      const raw = new TextDecoder().decode(payload);
      const msg = JSON.parse(raw);
      if (msg && msg.t === 'chat' && typeof msg.text === 'string') {
        const who = (msg.who) || (participant && (participant.name || participant.identity)) || '对方';
        appendChat(who, msg.text);
      }
    } catch (_) { /* ignore non-chat */ }
  });
}
async function sendChat(){
  const text = (chatInput.value || '').trim();
  if (!text) return;
  chatInput.value = '';
  appendChat(myChatName, text);
  if (room && room.localParticipant) {
    try {
      const data = new TextEncoder().encode(JSON.stringify({ t: 'chat', who: myChatName, text }));
      await room.localParticipant.publishData(data, { reliable: true });
    } catch (e) {
      log('系统：聊天发送失败（已本地显示）: ' + (e.message||e));
    }
  }
}
async function join(role){
  if (room) return;
  room = new Room({ adaptiveStream: true, dynacast: true });
  setupChatHandlers(room);
  room.on(RoomEvent.TrackSubscribed, (track, _pub, participant) => {
    if (participant.identity === 'xiaoyu') return;
    const el = ensureVideoTile(participant.identity, participant.name || participant.identity);
    if (track.kind === Track.Kind.Video) showLiveCamera(el, track);
    if (track.kind === Track.Kind.Audio) { const a = track.attach(); a.autoplay = true; document.body.appendChild(a); }
  });
  room.on(RoomEvent.ParticipantConnected, (p) => {
    if (p.identity === 'xiaoyu') setRainOnline(true, '在线·听你们');
    log('系统：有人进房: ' + (p.name||p.identity));
  });
  room.on(RoomEvent.TrackUnsubscribed, (track) => track.detach());
  room.on(RoomEvent.Disconnected, () => { log('系统：已离开'); room = null; document.getElementById('leave').disabled = true; });
  log('系统：连接 LiveKit Cloud 作为 ' + role + ' …');
  await room.connect(URL_WS, TOKENS[role]);
  log('系统：已进房: ' + room.name + ' 身份=' + room.localParticipant.identity);
  const localId = role === 'dad' ? 'dad' : 'lucas';
  myChatName = role === 'dad' ? '爸爸' : '芃芃';
  const localName = role === 'dad' ? '爸爸（我）' : '芃芃（我）';
  try {
    const tracks = await createLocalTracks({ audio: true, video: true });
    const local = ensureVideoTile(localId, localName);
    for (const track of tracks) {
      if (track.kind === Track.Kind.Video) showLiveCamera(local, track);
      await room.localParticipant.publishTrack(track);
    }
    log('系统：已发布本地音视频');
  } catch (camErr) {
    ensureVideoTile(localId, localName + '·无摄像头');
    log('系统：摄像头不可用（进房仍成功）: ' + camErr.message);
  }
  document.getElementById('leave').disabled = false;
  if (!window.__rainRoom) await joinRainPresence();
}
document.getElementById('joinDad').onclick = () => join('dad').catch(e => log('系统：失败: ' + (e.message||e)));
document.getElementById('joinKid').onclick = () => join('kid').catch(e => log('系统：失败: ' + (e.message||e)));
document.getElementById('leave').onclick = async () => {
  if (room) await room.disconnect();
  if (window.__rainRoom) { await window.__rainRoom.disconnect(); window.__rainRoom = null; }
  setRainOnline(false);
};
document.getElementById('chatSend').onclick = () => sendChat();
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
});
setRainOnline(true, '在线·待命');
log('系统：已接 LiveKit Cloud。点爸爸/芃芃进房。横屏：画面|聊天|课程；竖屏：课程上·头像横滑·聊天下。');
</script>
</body>
</html>
