<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>成长屋共学教室</title>
<style>
  :root{
    --bg:#0b1a12;--card:#12261a;--line:#2a5a3a;--txt:#e8f5ea;--chat-bg:#0e1f14;
    --safe-b:env(safe-area-inset-bottom,0px);
    --chip-h:88px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    background:radial-gradient(900px 480px at 50% -8%,#1a3a24,var(--bg));
    color:var(--txt);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  header{
    padding:8px 10px;
    padding-top:max(8px, env(safe-area-inset-top, 0px));
    display:flex;
    gap:6px;
    flex-wrap:nowrap;
    align-items:center;
    border-bottom:1px solid #234;
    flex-shrink:0;
    background:#0d1f14ee;
    backdrop-filter:blur(8px);
    z-index:20;
  }
  h1{
    font-size:.88rem;
    margin:0;
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .btn{
    border:0;border-radius:999px;
    padding:7px 10px;
    font-weight:800;
    font-size:11px;
    cursor:pointer;
    background:linear-gradient(180deg,#78d484,#4ea85c);
    color:#083018;
    flex-shrink:0;
    white-space:nowrap;
  }
  .btn.ghost{background:#1c3324;color:var(--txt);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .btn.send{padding:10px 14px;border-radius:12px;font-size:14px}
  .btn.chat-toggle{position:relative}
  .btn.chat-toggle.has-new::after{
    content:"";
    position:absolute;top:2px;right:2px;
    width:8px;height:8px;border-radius:50%;
    background:#ff5a5a;box-shadow:0 0 0 2px #0d1f14;
  }

  main{
    flex:1;
    min-height:0;
    width:100%;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:0;
    padding:0;
    max-width:100%;
  }

  .panel{
    background:var(--card);
    border:0;
    border-radius:0;
    padding:0;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .panel h2{
    margin:0;
    font-size:11px;
    font-weight:700;
    opacity:.75;
    letter-spacing:.04em;
    padding:6px 10px 0;
  }
  .hint{display:none}

  .course{
    order:1;
    flex:1 1 0;
    min-height:0;
    border-bottom:1px solid var(--line);
  }
  .course h2{padding-bottom:4px}
  .course iframe{
    width:100%;
    flex:1;
    min-height:0;
    border:0;
    border-radius:0;
    background:#000;
  }

  .cams{
    order:2;
    flex:0 0 auto;
    border-bottom:0;
    background:#0f2218;
    padding-bottom:0;
  }
  .cams h2{padding:6px 10px 4px}
  .vids{
    display:flex;
    flex-direction:row;
    gap:8px;
    padding:12px 10px 8px; /* room for head bubbles */
    overflow-x:auto;
    overflow-y:visible;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
  }
  .vids::-webkit-scrollbar{display:none}
  .tile{
    background:#000;
    border-radius:14px;
    aspect-ratio:3/4;
    height:var(--chip-h);
    width:auto;
    overflow:visible; /* bubbles above head */
    position:relative;
    border:2px solid transparent;
    flex:0 0 auto;
    scroll-snap-align:start;
  }
  .tile-inner{
    position:absolute;inset:0;
    border-radius:inherit;
    overflow:hidden;
    background:#000;
  }
  .tile.online{border-color:#6dcf7a}
  .tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile .name{
    position:absolute;left:4px;bottom:4px;z-index:2;
    background:#000a;padding:1px 6px;border-radius:7px;font-size:10px;
  }
  .tile .badge{
    position:absolute;right:4px;top:4px;z-index:2;
    background:#1e7a3a;padding:1px 5px;border-radius:7px;font-size:9px;font-weight:700;
  }
  .tile.rain{background:linear-gradient(160deg,#1a3d2a,#0d2418)}
  .tile img.avatar{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;transition:filter .25s ease, transform .25s ease}
  .tile.live video{display:block;width:100%;height:100%;object-fit:cover}
  .tile.live img.avatar{display:none}
  .tile.live .badge{background:#2a6fd4}
  .xy-bob{animation:xyBob 2.4s ease-in-out infinite;transform-origin:center bottom}
  @keyframes xyBob{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-6px) scale(1.02)}
  }
  .tile.rain.online{box-shadow:0 0 0 2px #6dcf7a, 0 0 14px #6dcf7a66}
  .tile.rain.speaking .xy-bob{animation-duration:0.9s}

  /* 小雨表情（轻量 CSS / 叠加） */
  .xy-face{
    position:absolute;left:50%;top:58%;
    transform:translate(-50%,-50%);
    font-size:clamp(18px, 28%, 36px);
    line-height:1;
    opacity:0;
    pointer-events:none;
    z-index:3;
    filter:drop-shadow(0 2px 4px #0008);
    transition:opacity .2s ease, transform .25s ease;
  }
  .tile.rain.expr-smile img.avatar{filter:saturate(1.15) brightness(1.06)}
  .tile.rain.expr-surprise img.avatar{filter:saturate(1.2) contrast(1.05) brightness(1.08)}
  .tile.rain.expr-think img.avatar{filter:saturate(.85) brightness(.96) hue-rotate(-8deg)}
  .tile.rain.expr-cheer img.avatar{filter:saturate(1.25) brightness(1.1)}
  .tile.rain.expr-smile .xy-face,
  .tile.rain.expr-surprise .xy-face,
  .tile.rain.expr-think .xy-face,
  .tile.rain.expr-cheer .xy-face{opacity:1}
  .tile.rain.expr-smile .xy-face{content:""}
  .tile.rain.expr-smile .xy-face::before{content:"😊"}
  .tile.rain.expr-surprise .xy-face::before{content:"😮"}
  .tile.rain.expr-think .xy-face::before{content:"🤔"}
  .tile.rain.expr-cheer .xy-face::before{content:"🥳"}
  .tile.rain.expr-cheer .xy-bob{animation-duration:.7s}

  /* 头顶冒泡 */
  .bubble{
    position:absolute;
    left:50%;
    bottom:calc(100% + 4px);
    transform:translateX(-50%) translateY(8px) scale(.92);
    max-width:min(160px, 42vw);
    background:#fffef8;
    color:#1a2e20;
    border:2px solid #6dcf7a;
    border-radius:14px;
    padding:5px 9px;
    font-size:13px;
    font-weight:700;
    line-height:1.25;
    text-align:center;
    white-space:pre-wrap;
    word-break:break-word;
    box-shadow:0 6px 16px #0006;
    opacity:0;
    pointer-events:none;
    z-index:5;
    transition:opacity .22s ease, transform .28s ease;
  }
  .bubble::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:#6dcf7a;
  }
  .bubble.show{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
  }
  .bubble.emoji{
    font-size:22px;
    padding:4px 8px;
    line-height:1.1;
  }

  /* 快捷表情条 */
  .react-bar{
    display:flex;
    gap:6px;
    padding:0 10px max(8px, var(--safe-b));
    background:#0f2218;
    flex-shrink:0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .react-bar::-webkit-scrollbar{display:none}
  .react{
    border:1px solid var(--line);
    background:#1a3022;
    color:var(--txt);
    border-radius:999px;
    min-width:40px;
    height:36px;
    padding:0 10px;
    font-size:18px;
    cursor:pointer;
    flex:0 0 auto;
    line-height:1;
  }
  .react:active{transform:scale(.94)}
  .react.bang{font-size:16px;font-weight:900}

  /* Chat modal */
  .chat-backdrop{
    position:fixed;
    inset:0;
    background:#000a;
    z-index:40;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .chat-backdrop.open{opacity:1;pointer-events:auto}
  .chat-modal{
    width:100%;
    max-width:480px;
    max-height:min(72dvh, 520px);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px 16px 0 0;
    box-shadow:0 -12px 40px #0008;
    display:flex;
    flex-direction:column;
    padding:10px 12px max(12px, var(--safe-b));
    transform:translateY(12px);
    transition:transform .18s ease;
    min-height:0;
  }
  .chat-backdrop.open .chat-modal{transform:translateY(0)}
  .chat-modal-head{
    display:flex;align-items:center;gap:8px;flex-shrink:0;margin-bottom:8px;
  }
  .chat-modal-head h2{margin:0;flex:1;font-size:14px;font-weight:800;opacity:.95;padding:0}
  .chat-close{
    background:#1c3324;color:var(--txt);border:1px solid var(--line);
    width:36px;height:36px;border-radius:10px;font-size:18px;line-height:1;cursor:pointer;flex-shrink:0;
  }
  .chat-reacts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chat-reacts .react{height:34px;min-width:38px;font-size:17px}
  #log{
    flex:1;font-size:13px;opacity:.92;white-space:pre-wrap;overflow:auto;
    background:var(--chat-bg);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin:0 0 10px;min-height:100px;line-height:1.45;
    -webkit-overflow-scrolling:touch;
  }
  .chat-compose{display:flex;gap:8px;flex-shrink:0}
  .chat-compose input{
    flex:1;border:1px solid var(--line);border-radius:12px;background:#0a1810;
    color:var(--txt);padding:11px 12px;font-size:16px;outline:none;
  }
  .chat-compose input:focus{border-color:#6dcf7a}

  @media(min-width:360px) and (orientation:portrait){ :root{--chip-h:92px} }
  @media(min-width:390px) and (orientation:portrait){ :root{--chip-h:96px} }

  @media (orientation: landscape), (min-width: 600px){
    body{overflow:hidden}
    header{
      padding:4px 8px;
      padding-top:max(4px, env(safe-area-inset-top, 0px));
      gap:5px;flex-wrap:nowrap;
    }
    h1{font-size:.8rem}
    .btn{padding:5px 8px;font-size:10px}
    .btn.send{padding:8px 12px;border-radius:10px;font-size:13px}

    main{
      display:grid;
      grid-template-columns:minmax(80px,130px) minmax(0,1fr);
      grid-template-areas:"cams course";
      gap:6px;
      padding:6px;
      padding-bottom:0;
      max-width:100%;
      flex:1;
      min-height:0;
    }
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;
    }
    .panel h2{font-size:10px;opacity:.85;padding:0 0 4px;letter-spacing:.03em}
    .hint{display:none}

    .cams{
      order:unset;grid-area:cams;flex:unset;max-height:none;min-height:0;
      border:1px solid var(--line);background:var(--card);padding-bottom:0;
      display:flex;flex-direction:column;
    }
    .vids{
      flex-direction:column;overflow:auto;overflow-x:hidden;
      padding:10px 4px 4px;gap:14px;flex:1;min-height:0;scroll-snap-type:none;
    }
    .tile{
      width:100%;height:auto;max-height:none;aspect-ratio:3/4;
      border-radius:10px;flex:0 0 auto;
    }
    .tile .name{left:3px;bottom:3px;padding:1px 5px;border-radius:6px;font-size:9px}
    .tile .badge{right:3px;top:3px;padding:1px 4px;border-radius:6px;font-size:8px}
    .bubble{font-size:11px;max-width:110%;padding:4px 7px}
    .bubble.emoji{font-size:18px}
    .react-bar{padding:4px 4px 6px;gap:4px;background:transparent}
    .react{min-width:32px;height:30px;font-size:15px;padding:0 6px}

    .course{
      order:unset;grid-area:course;flex:unset;min-height:0;
      border:1px solid var(--line);background:var(--card);
    }
    .course h2{padding:0 0 4px}
    .course iframe{border-radius:8px;flex:1;min-height:0;height:auto}

    .chat-backdrop{align-items:center;padding:16px}
    .chat-modal{
      border-radius:16px;max-height:min(80dvh, 560px);
      width:min(92vw, 420px);box-shadow:0 16px 48px #000a;
    }
  }

  @media(min-width:901px){
    body{overflow:auto}
    header{padding:10px 14px;gap:8px;flex-wrap:wrap}
    h1{font-size:1rem}
    .btn{padding:10px 14px;font-size:13px}
    .btn.send{padding:8px 14px;border-radius:10px;font-size:13px}

    main{
      grid-template-columns:minmax(120px,150px) minmax(0,1fr);
      gap:10px;padding:10px;padding-bottom:0;max-width:1400px;
    }
    .panel{border-radius:16px;padding:10px}
    .panel h2{font-size:13px;opacity:.9;padding:0 0 8px}
    .hint{display:block;font-size:12px;opacity:.85;line-height:1.45;margin-bottom:8px}
    .cams{padding-bottom:0}
    .vids{gap:16px;padding-top:14px}
    .tile{border-radius:14px}
    .tile .name{left:6px;bottom:6px;padding:2px 7px;border-radius:8px;font-size:11px}
    .tile .badge{right:6px;top:6px;padding:2px 7px;border-radius:8px;font-size:10px}
    .bubble{font-size:13px;max-width:140%}
    .react-bar{padding:6px 2px 8px;gap:6px}
    .react{min-width:40px;height:36px;font-size:18px}
    .course{border-radius:16px}
    .course h2{padding:0 0 8px}
    .course iframe{border-radius:12px;min-height:min(72vh,640px)}
    .chat-modal{width:min(92vw, 460px);max-height:min(78vh, 600px);padding:14px}
    #log{font-size:13px;padding:12px;min-height:160px}
    .chat-compose input{font-size:14px;padding:10px 12px}
  }
</style>
</head>

<header>
  <h1>成长屋共学教室</h1>

      </div>

      <button type="button" class="react" data-react="❤️">❤️</button>
      <button type="button" class="react" data-react="🎉">🎉</button>
    </div>
  </section>
</main>

<div class="chat-backdrop" id="chatBackdrop" role="dialog" aria-modal="true" aria-labelledby="chatTitle" hidden>
  <div class="chat-modal" id="chatModal">
    <div class="chat-modal-head">
      <h2 id="chatTitle">聊天</h2>
      <button type="button" class="chat-close" id="closeChat" aria-label="关闭">×</button>
    </div>
    <div class="chat-reacts" id="chatReacts">
      <button type="button" class="react bang" data-react="！">！</button>
      <button type="button" class="react" data-react="😄">😄</button>
      <button type="button" class="react" data-react="👍">👍</button>
      <button type="button" class="react" data-react="❤️">❤️</button>
      <button type="button" class="react" data-react="🎉">🎉</button>
    </div>
    <pre id="log"></pre>
    <div class="chat-compose">
      <input type="text" id="chatInput" placeholder="说点什么…" maxlength="80" autocomplete="off"/>
      <button class="btn send" id="chatSend" type="button">发送</button>
    </div>
  </div>
</div>

const chatInput = document.getElementById('chatInput');
const chatBackdrop = document.getElementById('chatBackdrop');
const openChatBtn = document.getElementById('openChat');
const closeChatBtn = document.getElementById('closeChat');
let chatOpen = false;
let room = null;
let myChatName = '我';
let myRole = null; // dad | kid | mom
const bubbleTimers = new WeakMap();
let xyExprTimer = null;

function openChat(){
  chatOpen = true;
  chatBackdrop.hidden = false;
  requestAnimationFrame(() => chatBackdrop.classList.add('open'));
  openChatBtn.classList.remove('has-new');
  openChatBtn.setAttribute('aria-expanded', 'true');
  setTimeout(() => chatInput.focus(), 200);
}
function closeChat(){
  chatOpen = false;
  chatBackdrop.classList.remove('open');
  openChatBtn.setAttribute('aria-expanded', 'false');
  setTimeout(() => { if (!chatOpen) chatBackdrop.hidden = true; }, 200);
}
openChatBtn.addEventListener('click', () => chatOpen ? closeChat() : openChat());
closeChatBtn.addEventListener('click', closeChat);
chatBackdrop.addEventListener('click', (e) => { if (e.target === chatBackdrop) closeChat(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && chatOpen) { e.preventDefault(); closeChat(); }
});

function log(m){
  logEl.textContent += m + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  console.log(m);
  if (!chatOpen && !String(m).startsWith('系统：已接')) {
    openChatBtn.classList.add('has-new');
  }
}
function appendChat(who, text){
  log(who ? `[${who}] ${text}` : text);
}

function identityToTileId(identity){
  if (!identity) return null;
  const id = String(identity).toLowerCase();
  if (id === 'dad' || id === 'local-dad') return 'tile-dad';
  if (id === 'lucas' || id === 'kid') return 'tile-kid';
  if (id === 'mom' || id === 'chunyan') return 'tile-mom';
  if (id === 'xiaoyu' || id === 'rain') return 'tile-xiaoyu';
  return 'tile-' + identity;
}
function whoToTileId(who, identity){
  if (identity) {
    const t = identityToTileId(identity);
    if (t && document.getElementById(t)) return t;
  }
  const w = String(who || '');
  if (/爸爸|dad/i.test(w)) return 'tile-dad';
  if (/芃芃|澍暘|kid|lucas/i.test(w)) return 'tile-kid';
  if (/妈妈|mom/i.test(w)) return 'tile-mom';
  if (/小雨|xiaoyu|rain/i.test(w)) return 'tile-xiaoyu';
  if (myRole === 'dad') return 'tile-dad';
  if (myRole === 'kid') return 'tile-kid';
  if (myRole === 'mom') return 'tile-mom';
  return 'tile-dad';
}
function isEmojiOnly(text){
  const t = String(text || '').trim();
  if (!t) return false;
  if (REACTIONS.has(t)) return true;
  // short emoji / bang
  return /^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}！!]{1,4}$/u.test(t);
}
function showBubble(tileEl, text){
  if (!tileEl) return;
  let bubble = tileEl.querySelector(':scope > .bubble');
  if (!bubble) {
    bubble = document.createElement('div');
    bubble.className = 'bubble';
    tileEl.appendChild(bubble);
  }
  const t = String(text || '').trim();
  if (!t) return;
  bubble.textContent = t.length > 40 ? t.slice(0, 39) + '…' : t;
  bubble.classList.toggle('emoji', isEmojiOnly(t));
  bubble.classList.remove('show');
  // restart animation
  void bubble.offsetWidth;
  bubble.classList.add('show');
  const prev = bubbleTimers.get(tileEl);
  if (prev) clearTimeout(prev);
  const hideMs = isEmojiOnly(t) ? 2800 : 3800;
  bubbleTimers.set(tileEl, setTimeout(() => {
    bubble.classList.remove('show');
  }, hideMs));
}
function setXiaoyuExpr(kind){
  const el = document.getElementById('tile-xiaoyu');
  if (!el) return;
  el.classList.remove('expr-smile','expr-surprise','expr-think','expr-cheer');
  if (!kind) return;
  el.classList.add('expr-' + kind);
  if (xyExprTimer) clearTimeout(xyExprTimer);
  xyExprTimer = setTimeout(() => {
    el.classList.remove('expr-smile','expr-surprise','expr-think','expr-cheer');
  }, 3200);
}
function maybeXiaoyuReact(who, text, identity){
  const tileId = whoToTileId(who, identity);
  // If message is from/about xiaoyu or reaction maps, show face on xiaoyu when she "speaks"
  if (tileId === 'tile-xiaoyu') {
    const expr = XY_EXPR[String(text||'').trim()] || (isEmojiOnly(text) ? 'cheer' : 'smile');
    setXiaoyuExpr(expr);
    return;
  }
  // Kid-friendly: when anyone sends surprise/cheer emoji, xiaoyu mirrors lightly
  const expr = XY_EXPR[String(text||'').trim()];
  if (expr === 'surprise' || expr === 'cheer') {
    setXiaoyuExpr(expr);
  }
}
function presentMessage(who, text, identity){
  appendChat(who, text);
  const tile = document.getElementById(whoToTileId(who, identity));
  showBubble(tile, text);
  maybeXiaoyuReact(who, text, identity);
}

function ensureVideoTile(id, name){
  let el;
  if (id === 'dad' || id === 'local-dad') el = document.getElementById('tile-dad');
  else if (id === 'lucas' || id === 'kid') el = document.getElementById('tile-kid');
  else if (id === 'mom' || id === 'chunyan') el = document.getElementById('tile-mom');
  else if (id === 'xiaoyu' || id === 'rain') el = document.getElementById('tile-xiaoyu');
  else {
    el = document.getElementById('tile-'+id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'tile'; el.id = 'tile-'+id;
      el.innerHTML = '<div class="tile-inner"><img class="avatar" alt=""/><video autoplay playsinline muted hidden></video><div class="badge">卡通</div><div class="name"></div></div><div class="bubble" aria-hidden="true"></div>';
      vids.insertBefore(el, document.getElementById('tile-xiaoyu'));
    }
  }
  const nameEl = el.querySelector('.name');
  if (nameEl) nameEl.textContent = name;
  el.classList.add('online');
  return el;
}
function showLiveCamera(el, track){
  const v = el.querySelector('video');
  const img = el.querySelector('img.avatar');
  const badge = el.querySelector('.badge');
  if (!v) return;
  track.attach(v);
  v.hidden = false;
  v.muted = (el.id === 'tile-dad' || el.id === 'tile-kid' || el.id === 'tile-mom');
  el.classList.add('live');
  if (img) img.style.display = 'none';
  if (badge) badge.textContent = '摄像头';
}
function setRainOnline(on, detail){
  document.getElementById('tile-xiaoyu').classList.toggle('online', !!on);
  document.getElementById('rainBadge').textContent = on ? (detail || '在线·听你们') : '离线';
}
async function joinRainPresence(){
  try {
    const rainRoom = new Room();
    await rainRoom.connect(URL_WS, TOKENS.rain);
    setRainOnline(true, '在线·听你们');
    log('系统：小雨已进房（旁听席）');
    // listen so 小雨 presence can show bubbles if someone publishes as xiaoyu later
    rainRoom.on(RoomEvent.DataReceived, (payload, participant) => {
      try {
        const raw = new TextDecoder().decode(payload);
        const msg = JSON.parse(raw);
        if (msg && msg.t === 'chat' && typeof msg.text === 'string') {
          // ignore duplicates if main room also receives — only handle when no main room
          if (room) return;
          const who = msg.who || (participant && (participant.name || participant.identity)) || '对方';
          const identity = msg.id || (participant && participant.identity);
          presentMessage(who, msg.text, identity);
        }
      } catch (_) {}
    });
    window.__rainRoom = rainRoom;
  } catch (e) {
    setRainOnline(true, '在线·示意');
    log('系统：小雨旁听: ' + (e.message||e));
  }
}
function setupChatHandlers(r){
  r.on(RoomEvent.DataReceived, (payload, participant) => {
    try {
      const raw = new TextDecoder().decode(payload);
      const msg = JSON.parse(raw);
      if (msg && msg.t === 'chat' && typeof msg.text === 'string') {
        const who = (msg.who) || (participant && (participant.name || participant.identity)) || '对方';
        const identity = msg.id || (participant && participant.identity);
        presentMessage(who, msg.text, identity);
      }
    } catch (_) { /* ignore non-chat */ }
  });
}
async function publishChat(text){
  const t = String(text || '').trim();
  if (!t) return;
  if (!myRole) {
    // allow local demo bubble before join — default to dad tile visually but prompt
    presentMessage(myChatName, t, null);
    log('系统：还没进房，气泡仅本地可见。点爸爸/芃芃/妈妈进房后可同步。');
    return;
  }
  const identity = myRole === 'kid' ? 'lucas' : myRole;
  presentMessage(myChatName, t, identity);
  if (room && room.localParticipant) {
    try {
      const data = new TextEncoder().encode(JSON.stringify({ t: 'chat', who: myChatName, text: t, id: identity }));
      await room.localParticipant.publishData(data, { reliable: true });
    } catch (e) {
      log('系统：发送失败（本地已冒泡）: ' + (e.message||e));
    }
  }
}
async function sendChat(){
  const text = (chatInput.value || '').trim();
  if (!text) return;
  chatInput.value = '';
  await publishChat(text);
  closeChat();
}
function bindReactButtons(root){
  root.querySelectorAll('[data-react]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.getAttribute('data-react');
      if (v) publishChat(v);
    });
  });
}
bindReactButtons(document.getElementById('reactBar'));
bindReactButtons(document.getElementById('chatReacts'));

async function join(role){
  if (room) return;
  room = new Room({ adaptiveStream: true, dynacast: true });
  setupChatHandlers(room);
  room.on(RoomEvent.TrackSubscribed, (track, _pub, participant) => {
    if (participant.identity === 'xiaoyu') return;
    const el = ensureVideoTile(participant.identity, participant.name || participant.identity);
    if (track.kind === Track.Kind.Video) showLiveCamera(el, track);
    if (track.kind === Track.Kind.Audio) { const a = track.attach(); a.autoplay = true; document.body.appendChild(a); }
  });
  room.on(RoomEvent.ParticipantConnected, (p) => {
    if (p.identity === 'xiaoyu') setRainOnline(true, '在线·听你们');
    log('系统：有人进房: ' + (p.name||p.identity));
  });
  room.on(RoomEvent.TrackUnsubscribed, (track) => track.detach());
  room.on(RoomEvent.Disconnected, () => {
    log('系统：已离开');
    room = null; myRole = null; myChatName = '我';
    document.getElementById('leave').disabled = true;
  });
  log('系统：连接 LiveKit Cloud 作为 ' + role + ' …');
  await room.connect(URL_WS, TOKENS[role]);
  log('系统：已进房: ' + room.name + ' 身份=' + room.localParticipant.identity);
  myRole = role;
  const localId = role === 'dad' ? 'dad' : role === 'mom' ? 'mom' : 'lucas';
  myChatName = role === 'dad' ? '爸爸' : role === 'mom' ? '妈妈' : '芃芃';
  const localName = myChatName + '（我）';
  try {
    const tracks = await createLocalTracks({ audio: true, video: true });
    const local = ensureVideoTile(localId, localName);
    for (const track of tracks) {
      if (track.kind === Track.Kind.Video) showLiveCamera(local, track);
      await room.localParticipant.publishTrack(track);
    }
    log('系统：已发布本地音视频');
  } catch (camErr) {
    ensureVideoTile(localId, localName + '·无摄像头');
    log('系统：摄像头不可用（进房仍成功）: ' + camErr.message);
  }
  document.getElementById('leave').disabled = false;
  if (!window.__rainRoom) await joinRainPresence();
  // 小雨打个招呼表情
  setXiaoyuExpr('smile');
  showBubble(document.getElementById('tile-xiaoyu'), '你好呀～');
}
document.getElementById('joinDad').onclick = () => join('dad').catch(e => log('系统：失败: ' + (e.message||e)));
document.getElementById('joinKid').onclick = () => join('kid').catch(e => log('系统：失败: ' + (e.message||e)));
document.getElementById('joinMom').onclick = () => join('mom').catch(e => log('系统：失败: ' + (e.message||e)));
document.getElementById('leave').onclick = async () => {
  if (room) await room.disconnect();
  if (window.__rainRoom) { await window.__rainRoom.disconnect(); window.__rainRoom = null; }
  setRainOnline(false);
  myRole = null; myChatName = '我';
};
document.getElementById('chatSend').onclick = () => sendChat();
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
});
setRainOnline(true, '在线·待命');
log('系统：已接 LiveKit Cloud。点爸爸/芃芃/妈妈进房。说话会头顶冒泡；点 ！😄👍 发表情。');
</script>
