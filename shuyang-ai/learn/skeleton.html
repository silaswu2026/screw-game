<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('bone');
const stage = document.getElementById('stage');
const lessonEl = document.getElementById('lesson');
const badgeEl = document.getElementById('badge');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
// mc9–mc11: soft shadows; mc10 draggable sun; mc11 per-box-face skin + body material toggle
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(2.6, 1.9, 3.4);

scene.add(new THREE.AmbientLight(0xffffff, 0.48));
const hemi = new THREE.HemisphereLight(0xeafff2, 0x243528, 0.55);
scene.add(hemi);
// mc10/mc11: key light aims at figure; position driven by draggable 「小太阳」
const key = new THREE.DirectionalLight(0xfff5e0, 1.15);
key.position.set(2.0, 3.1, 2.2); // start upper-front, in-frame for kids
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2.5;
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.025;
key.target.position.set(0, 1.0, 0);
scene.add(key);
scene.add(key.target);
const fill = new THREE.DirectionalLight(0xa8d8ff, 0.35);
fill.position.set(-3, 2.2, -2);
scene.add(fill);

const BONE = new THREE.MeshStandardMaterial({
  color: 0xf2e6c9, roughness: 0.55, metalness: 0.05,
});
const JOINT = new THREE.MeshStandardMaterial({
  color: 0xffe7a0, roughness: 0.4, metalness: 0.08,
});
const ACCENT = new THREE.MeshStandardMaterial({
  color: 0xe8c878, roughness: 0.45, metalness: 0.05,
});

const figure = new THREE.Group();
scene.add(figure);

const rigMeshes = [];

function addBone(parent, ax, ay, az, bx, by, bz, radius = 0.055) {
  const a = new THREE.Vector3(ax, ay, az);
  const b = new THREE.Vector3(bx, by, bz);
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dir = b.clone().sub(a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, 10);
  const mesh = new THREE.Mesh(geo, BONE);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  rigMeshes.push(mesh);
  return mesh;
}

function addJoint(parent, x, y, z, r = 0.09) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), JOINT);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  rigMeshes.push(m);
  return m;
}

const hips = new THREE.Group();
hips.position.set(0, 1.05, 0);
figure.add(hips);

addJoint(hips, 0, 0, 0, 0.11);
addBone(hips, -0.16, 0, 0, 0.16, 0, 0, 0.05);
addJoint(hips, -0.18, 0, 0, 0.09);
addJoint(hips, 0.18, 0, 0, 0.09);

addBone(hips, 0, 0.05, 0, 0, 0.45, 0, 0.06);
addJoint(hips, 0, 0.45, 0, 0.08);
addBone(hips, 0, 0.45, 0, 0, 0.78, 0, 0.055);
addJoint(hips, 0, 0.78, 0, 0.085);

addBone(hips, -0.32, 0.76, 0, 0.32, 0.76, 0, 0.045);
addJoint(hips, -0.34, 0.76, 0, 0.095);
addJoint(hips, 0.34, 0.76, 0, 0.095);

addBone(hips, 0, 0.78, 0, 0, 0.98, 0, 0.04);
addJoint(hips, 0, 1.08, 0, 0.18);
const faceDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0x3a2a10 })
);
faceDot.position.set(-0.06, 1.1, 0.15);
hips.add(faceDot);
rigMeshes.push(faceDot);
const faceDot2 = faceDot.clone();
faceDot2.position.x = 0.06;
hips.add(faceDot2);
rigMeshes.push(faceDot2);
const smile = new THREE.Mesh(
  new THREE.TorusGeometry(0.06, 0.012, 6, 12, Math.PI),
  new THREE.MeshBasicMaterial({ color: 0x3a2a10 })
);
smile.position.set(0, 1.02, 0.155);
smile.rotation.x = Math.PI;
hips.add(smile);
rigMeshes.push(smile);

const shoulderL = new THREE.Group();
shoulderL.position.set(-0.34, 0.76, 0);
hips.add(shoulderL);
const upperArmL = new THREE.Group();
shoulderL.add(upperArmL);
addBone(upperArmL, 0, 0, 0, 0, -0.38, 0, 0.048);
addJoint(upperArmL, 0, -0.38, 0, 0.075);
const foreArmL = new THREE.Group();
foreArmL.position.set(0, -0.38, 0);
upperArmL.add(foreArmL);
addBone(foreArmL, 0, 0, 0, 0, -0.34, 0, 0.042);
addJoint(foreArmL, 0, -0.34, 0, 0.065);

const shoulderR = new THREE.Group();
shoulderR.position.set(0.34, 0.76, 0);
hips.add(shoulderR);
const upperArmR = new THREE.Group();
shoulderR.add(upperArmR);
addBone(upperArmR, 0, 0, 0, 0, -0.38, 0, 0.048);
addJoint(upperArmR, 0, -0.38, 0, 0.075);
const foreArmR = new THREE.Group();
foreArmR.position.set(0, -0.38, 0);
upperArmR.add(foreArmR);
addBone(foreArmR, 0, 0, 0, 0, -0.34, 0, 0.042);
addJoint(foreArmR, 0, -0.34, 0, 0.065);

const hipL = new THREE.Group();
hipL.position.set(-0.18, 0, 0);
hips.add(hipL);
const thighL = new THREE.Group();
hipL.add(thighL);
addBone(thighL, 0, 0, 0, 0, -0.48, 0, 0.055);
addJoint(thighL, 0, -0.48, 0, 0.085);
const shinL = new THREE.Group();
shinL.position.set(0, -0.48, 0);
thighL.add(shinL);
addBone(shinL, 0, 0, 0, 0, -0.48, 0, 0.048);
addJoint(shinL, 0, -0.48, 0, 0.07);
addBone(shinL, 0, -0.48, 0, 0, -0.48, 0.16, 0.04);
addJoint(shinL, 0, -0.48, 0.16, 0.055);

const hipR = new THREE.Group();
hipR.position.set(0.18, 0, 0);
hips.add(hipR);
const thighR = new THREE.Group();
hipR.add(thighR);
addBone(thighR, 0, 0, 0, 0, -0.48, 0, 0.055);
addJoint(thighR, 0, -0.48, 0, 0.085);
const shinR = new THREE.Group();
shinR.position.set(0, -0.48, 0);
thighR.add(shinR);
addBone(shinR, 0, 0, 0, 0, -0.48, 0, 0.048);
addJoint(shinR, 0, -0.48, 0, 0.07);
addBone(shinR, 0, -0.48, 0, 0, -0.48, 0.16, 0.04);
addJoint(shinR, 0, -0.48, 0.16, 0.055);

// ─── Step 2: LEGO / voxel-chunk body (few BIG different granules) ───
const PARTICLE_COLORS = [
  0xff8a65, 0xffd54f, 0x81c784, 0x64b5f6, 0xba68c8,
  0xffb74d, 0x4dd0e1, 0xf06292, 0xaed581, 0xffe082,
  0x90caf9, 0xce93d8, 0xffab91, 0x80cbc4, 0xfff176,
  0x2e7d32, 0x43a047, 0x37474f, 0x546e7a, 0xffcc80,
];

const particleMats = PARTICLE_COLORS.map((color) =>
  new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.06 })
);

const particles = [];
let particleReveal = null;
let chunkSeq = 0;

/** One large LEGO-style brick. `part` = head|torso|armL|armR|legL|legR for skin maps. */
function addChunk(parent, x, y, z, w, h, d, colorIdx, delay, part = 'torso') {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = particleMats[colorIdx % particleMats.length];
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  // tiny tilt so bricks read as separate pieces, not one fused blob
  const tilt = ((colorIdx * 17) % 7) * 0.015 - 0.045;
  mesh.rotation.y = tilt;
  mesh.userData.baseTilt = tilt;
  mesh.userData.part = part;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.visible = false;
  mesh.scale.setScalar(0.01);
  parent.add(mesh);
  particles.push({
    mesh,
    delay: delay ?? (chunkSeq * 0.035) % 0.7,
    colorMat: mat,
    part,
  });
  chunkSeq++;
  return mesh;
}

// Head — 2×2×2 big cubes (clear head block)
const HS = 0.2;
for (const xi of [-1, 1]) for (const yi of [-1, 1]) for (const zi of [-1, 1]) {
  addChunk(hips, xi * HS * 0.55, 1.08 + yi * HS * 0.55, zi * HS * 0.55, HS, HS, HS, chunkSeq, chunkSeq * 0.03, 'head');
}
// Neck
addChunk(hips, 0, 0.9, 0, 0.16, 0.14, 0.16, 3, 0.22, 'head');

// Torso — 2×3×2 stack of big bricks (full chest silhouette)
const TW = 0.22, TH = 0.22, TD = 0.16;
for (const xi of [-1, 1]) {
  for (let row = 0; row < 3; row++) {
    for (const zi of [-1, 1]) {
      addChunk(
        hips,
        xi * TW * 0.55,
        0.22 + row * TH * 0.95,
        zi * TD * 0.55,
        TW, TH, TD,
        4 + row + (xi > 0 ? 3 : 0),
        0.25 + row * 0.04 + (xi > 0 ? 0.02 : 0),
        'torso'
      );
    }
  }
}
// Pelvis
addChunk(hips, -0.12, 0.02, 0, 0.22, 0.18, 0.22, 10, 0.4, 'torso');
addChunk(hips, 0.12, 0.02, 0, 0.22, 0.18, 0.22, 11, 0.42, 'torso');
// Shoulder pads
addChunk(hips, -0.34, 0.76, 0, 0.2, 0.16, 0.2, 12, 0.44, 'armL');
addChunk(hips, 0.34, 0.76, 0, 0.2, 0.16, 0.2, 13, 0.46, 'armR');

// Arms — 2 stacked bricks each segment
addChunk(upperArmL, 0, -0.1, 0, 0.18, 0.22, 0.18, 14, 0.48, 'armL');
addChunk(upperArmL, 0, -0.3, 0, 0.18, 0.2, 0.18, 15, 0.5, 'armL');
addChunk(foreArmL, 0, -0.1, 0, 0.16, 0.2, 0.16, 16, 0.52, 'armL');
addChunk(foreArmL, 0, -0.28, 0, 0.16, 0.18, 0.16, 17, 0.54, 'armL');
addChunk(foreArmL, 0, -0.38, 0, 0.14, 0.12, 0.14, 18, 0.56, 'armL'); // hand

addChunk(upperArmR, 0, -0.1, 0, 0.18, 0.22, 0.18, 0, 0.48, 'armR');
addChunk(upperArmR, 0, -0.3, 0, 0.18, 0.2, 0.18, 1, 0.5, 'armR');
addChunk(foreArmR, 0, -0.1, 0, 0.16, 0.2, 0.16, 2, 0.52, 'armR');
addChunk(foreArmR, 0, -0.28, 0, 0.16, 0.18, 0.16, 3, 0.54, 'armR');
addChunk(foreArmR, 0, -0.38, 0, 0.14, 0.12, 0.14, 4, 0.56, 'armR');

// Legs
addChunk(thighL, 0, -0.12, 0, 0.2, 0.26, 0.2, 5, 0.58, 'legL');
addChunk(thighL, 0, -0.36, 0, 0.2, 0.24, 0.2, 6, 0.6, 'legL');
addChunk(shinL, 0, -0.12, 0, 0.18, 0.24, 0.18, 7, 0.62, 'legL');
addChunk(shinL, 0, -0.36, 0, 0.18, 0.24, 0.18, 8, 0.64, 'legL');
addChunk(shinL, 0, -0.48, 0.08, 0.2, 0.12, 0.26, 9, 0.66, 'legL'); // foot

addChunk(thighR, 0, -0.12, 0, 0.2, 0.26, 0.2, 10, 0.58, 'legR');
addChunk(thighR, 0, -0.36, 0, 0.2, 0.24, 0.2, 11, 0.6, 'legR');
addChunk(shinR, 0, -0.12, 0, 0.18, 0.24, 0.18, 12, 0.62, 'legR');
addChunk(shinR, 0, -0.36, 0, 0.18, 0.24, 0.18, 13, 0.64, 'legR');
addChunk(shinR, 0, -0.48, 0.08, 0.2, 0.12, 0.26, 14, 0.66, 'legR');

console.info('[skeleton] LEGO chunks', particles.length);

// ─── Step 3: finer denser cubes (still readable, not dust) ───
const fineParticles = [];
let fineReveal = null;
const FINE_COLORS = [
  0x66bb6a, 0x43a047, 0x2e7d32, 0x81c784, 0xa5d6a7,
  0xffcc80, 0xffab91, 0x90caf9, 0xce93d8, 0xffe082,
  0x78909c, 0x546e7a, 0xb0bec5, 0xff8a65, 0x4dd0e1,
];
const fineMats = FINE_COLORS.map((c) =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.05 })
);
let fineSeq = 0;

const fineGeoCache = {};
function fineGeo(s) {
  const k = (s * 100) | 0;
  if (!fineGeoCache[k]) fineGeoCache[k] = new THREE.BoxGeometry(s, s, s);
  return fineGeoCache[k];
}
function addFine(parent, x, y, z, size, colorIdx, delay) {
  const s = size * (0.85 + (fineSeq % 5) * 0.04);
  const mesh = new THREE.Mesh(
    fineGeo(s),
    fineMats[colorIdx % fineMats.length]
  );
  mesh.position.set(x, y, z);
  mesh.rotation.y = ((colorIdx * 13) % 9) * 0.02;
  mesh.visible = false;
  mesh.scale.setScalar(0.01);
  parent.add(mesh);
  fineParticles.push({
    mesh,
    delay: delay ?? (fineSeq * 0.012) % 0.7,
    colorMat: mesh.material,
  });
  fineSeq++;
}

function fillFineBox(parent, x0, y0, z0, x1, y1, z1, spacing, seed0) {
  const nx = Math.max(2, Math.round(Math.abs(x1 - x0) / spacing));
  const ny = Math.max(2, Math.round(Math.abs(y1 - y0) / spacing));
  const nz = Math.max(2, Math.round(Math.abs(z1 - z0) / spacing));
  let i = seed0;
  for (let ix = 0; ix <= nx; ix++) {
    for (let iy = 0; iy <= ny; iy++) {
      for (let iz = 0; iz <= nz; iz++) {
        const u = ix / nx, v = iy / ny, w = iz / nz;
        const j = spacing * 0.15;
        const jx = ((i * 17) % 10) / 10 * j - j / 2;
        const jy = ((i * 29) % 10) / 10 * j - j / 2;
        const jz = ((i * 43) % 10) / 10 * j - j / 2;
        addFine(
          parent,
          x0 + (x1 - x0) * u + jx,
          y0 + (y1 - y0) * v + jy,
          z0 + (z1 - z0) * w + jz,
          spacing * 0.85,
          i,
          (i * 0.012) % 0.7
        );
        i++;
      }
    }
  }
}

function fillFineLimb(parent, y0, y1, radius, spacing, seed0) {
  const len = Math.abs(y1 - y0);
  const nAlong = Math.max(3, Math.round(len / spacing));
  const nRad = Math.max(2, Math.round((radius * 2) / spacing));
  let i = seed0;
  for (let a = 0; a <= nAlong; a++) {
    const y = y0 + (y1 - y0) * (a / nAlong);
    for (let ix = -nRad; ix <= nRad; ix++) {
      for (let iz = -nRad; iz <= nRad; iz++) {
        const x = (ix / nRad) * radius;
        const z = (iz / nRad) * radius;
        if (x * x + z * z > radius * radius * 1.08) continue;
        addFine(parent, x, y, z, spacing * 0.85, i, (i * 0.012) % 0.7);
        i++;
      }
    }
  }
}

/** Cover-crop AI art onto opaque canvas (fills face once — no tiling). */
function paintCover(img, sx, sy, sw, sh, bgCss, outW, outH) {
  const c = document.createElement('canvas');
  c.width = outW || 512;
  c.height = outH || 512;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = bgCss;
  ctx.fillRect(0, 0, c.width, c.height);
  const scale = Math.max(c.width / sw, c.height / sh);
  const dw = sw * scale;
  const dh = sh * scale;
  const dx = (c.width - dw) / 2;
  const dy = (c.height - dh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 8;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  return tex;
}

function stickerCover(img, bbox, bgCss, outW, outH) {
  const [sx, sy, ex, ey] = bbox;
  return paintCover(img, sx, sy, ex - sx, ey - sy, bgCss, outW, outH);
}

/** Crop one face from a Minecraft skin atlas (coords in classic 64-space). */
function cropSkinFace(skinImg, sx, sy, sw, sh, outW, outH) {
  const scale = skinImg.naturalWidth / 64;
  const c = document.createElement('canvas');
  c.width = outW || Math.max(8, Math.round(sw * scale));
  c.height = outH || Math.max(8, Math.round(sh * scale));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(
    skinImg,
    sx * scale, sy * scale, sw * scale, sh * scale,
    0, 0, c.width, c.height
  );
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  return tex;
}

function matSkinFeel(tex, { rough = 0.55, metal = 0.04 } = {}) {
  // 皮肤感：会吃小太阳的光/影，略粗糙 + 一点点高光
  return new THREE.MeshStandardMaterial({
    map: tex, roughness: rough, metalness: metal,
  });
}

function matFlatPhoto(tex) {
  // 普通贴图：像平面照片贴纸，不受光照影响
  return new THREE.MeshBasicMaterial({
    map: tex, toneMapped: false,
  });
}

/**
 * Classic Steve UV → Three.js BoxGeometry face order: +X -X +Y -Y +Z -Z
 * Character faces +Z; +X = character left, -X = character right.
 * UV rects are [sx,sy,sw,sh] in 64-space.
 */
const MC_FACE_UV = {
  // our armL/legL sit on -X (screen-left) = Steve's right limb
  head: [
    [16, 8, 8, 8],  // +X left
    [0, 8, 8, 8],   // -X right
    [8, 0, 8, 8],   // +Y top (black hair)
    [16, 0, 8, 8],  // -Y bottom
    [8, 8, 8, 8],   // +Z front face
    [24, 8, 8, 8],  // -Z back
  ],
  torso: [
    [28, 20, 4, 12],
    [16, 20, 4, 12],
    [20, 16, 8, 4],
    [28, 16, 8, 4],
    [20, 20, 8, 12], // belly / chest
    [32, 20, 8, 12], // back
  ],
  armL: [ // Steve right arm
    [48, 20, 4, 12],
    [40, 20, 4, 12],
    [44, 16, 4, 4],
    [48, 16, 4, 4],
    [44, 20, 4, 12],
    [52, 20, 4, 12],
  ],
  armR: [ // Steve left arm
    [40, 52, 4, 12],
    [32, 52, 4, 12],
    [36, 48, 4, 4],
    [40, 48, 4, 4],
    [36, 52, 4, 12],
    [44, 52, 4, 12],
  ],
  legL: [ // Steve right leg
    [8, 20, 4, 12],
    [0, 20, 4, 12],
    [4, 16, 4, 4],
    [8, 16, 4, 4],
    [4, 20, 4, 12],
    [12, 20, 4, 12],
  ],
  legR: [ // Steve left leg
    [24, 52, 4, 12],
    [16, 52, 4, 12],
    [20, 48, 4, 4],
    [24, 48, 4, 4],
    [20, 52, 4, 12],
    [28, 52, 4, 12],
  ],
};

function makePartMatsPair(skinImg, part) {
  const uvs = MC_FACE_UV[part];
  if (!uvs) return null;
  const flat = [];
  const skin = [];
  uvs.forEach(([sx, sy, sw, sh], i) => {
    const tex = cropSkinFace(skinImg, sx, sy, sw, sh);
    const isFront = i === 4;
    const isTop = i === 2;
    flat.push(matFlatPhoto(tex));
    skin.push(matSkinFeel(tex, {
      rough: isTop ? 0.72 : (isFront ? 0.48 : 0.62),
      metal: isFront ? 0.04 : 0.02,
    }));
  });
  return { flat, skin };
}

function addMcBox(part, x, y, z, w, h, d) {

    delay: PART_SKIN_DELAY[part] ?? 0.3,
    skinMats: null,
    flatMats: null,
    colorMat: placeholder,
  });
  return mesh;
}

function buildMcSkins(skinImg, decalImgs) {
  for (const box of mcBoxes) {
    const pair = makePartMatsPair(skinImg, box.part);
    box.flatMats = pair.flat;
    box.skinMats = pair.skin;
  }
  applyBodyMaterialMode(true); // default: 皮肤感 so movable sun reads clearly
  const map = {
    head: decalImgs.head, torso: decalImgs.torso, legs: decalImgs.legs,
  };
  for (const d of skinDecals) {
    const img = map[d.name];
    if (!img) continue;
    const tex = texFromImage(img);
    d.mat.map = tex;
    d.mat.transparent = true;
    d.mat.alphaTest = 0.02;
    d.mat.needsUpdate = true;
  }
  console.info('[skeleton] mc11 per-box-face + flat/skin-feel toggle', mcBoxes.length);
}

const sunRay = new THREE.Raycaster();
const sunPtr = new THREE.Vector2();
const sunDragPlane = new THREE.Plane();
const sunHitPt = new THREE.Vector3();
const _camDir = new THREE.Vector3();
let draggingSun = false;

function pointerToNDC(e) {
  const src = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0]
    : (e.touches && e.touches[0] ? e.touches[0] : e);
  const rect = canvas.getBoundingClientRect();
  sunPtr.x = ((src.clientX - rect.left) / rect.width) * 2 - 1;
  sunPtr.y = -((src.clientY - rect.top) / rect.height) * 2 + 1;
}

function clampSunPos(v) {
  v.y = Math.max(0.75, Math.min(4.6, v.y));
  const xz = Math.hypot(v.x, v.z);
  const maxR = 4.2;
  if (xz > maxR) {
    v.x = (v.x / xz) * maxR;
    v.z = (v.z / xz) * maxR;
  }
  return v;
}

function onSunPointerDown(e) {
  if (!sunGroup.visible) return;
  pointerToNDC(e);
  sunRay.setFromCamera(sunPtr, camera);
  const hits = sunRay.intersectObject(sunHit, false);
  if (!hits.length) return;
  draggingSun = true;
  sunGroup.userData.dragged = true;
  controls.enabled = false;
  camera.getWorldDirection(_camDir);
  sunDragPlane.setFromNormalAndCoplanarPoint(_camDir.clone().negate(), sunGroup.position.clone());
  canvas.setPointerCapture?.(e.pointerId);
  e.preventDefault();
  e.stopImmediatePropagation();
}

function onSunPointerMove(e) {
  if (!draggingSun) return;
  pointerToNDC(e);
  sunRay.setFromCamera(sunPtr, camera);
  if (sunRay.ray.intersectPlane(sunDragPlane, sunHitPt)) {
    clampSunPos(sunHitPt);
    sunGroup.position.copy(sunHitPt);
    syncKeyFromSun();
  }
  e.preventDefault();
  e.stopPropagation();
}

function onSunPointerUp(e) {
  if (!draggingSun) return;
  draggingSun = false;
  controls.enabled = true;
  try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
}

// capture:true so we beat OrbitControls when grabbing the sun

  // Face front so 脸/肚子对孩子一眼可读
  hips.rotation.set(0, 0, 0);
  camera.position.set(0, 1.15, 3.4);
  controls.target.set(0, 0.95, 0);
  controls.update();
  skinReveal = { t0: performance.now(), dur: 2800 };
  swayOn = true; // hips yaw only while step 4 (see frame)
}

function setStep(n) {
  step = n;
  document.getElementById('stepBones').classList.toggle('active', n === 1);
  document.getElementById('stepBig').classList.toggle('active', n === 2);
  document.getElementById('stepFine').classList.toggle('active', n === 3);
  document.getElementById('stepSkin').classList.toggle('active', n === 4);
  const L = LESSONS[n];
  lessonEl.innerHTML = L.html;
  badgeEl.textContent = L.badge;

  if (n === 1) {
    showRig();
    clearCubeSkin();
    hideBigChunks();
    hideFineParticles();
    setSunVisible(false);
    swayOn = true;
  } else if (n === 2) {
    showRig();
    showBigChunks();
    setSunVisible(false);
    swayOn = true;
  } else if (n === 3) {
    showRig();
    showFineAssembling();
    setSunVisible(false);
    swayOn = true;
  } else {
    showSkinStaggered();
    setSunVisible(true);
  }
}

document.getElementById('stepBones').addEventListener('click', () => setStep(1));
document.getElementById('stepBig').addEventListener('click', () => setStep(2));
document.getElementById('stepFine').addEventListener('click', () => setStep(3));
document.getElementById('stepSkin').addEventListener('click', () => setStep(4));

function resetPose() {
  poseAnim = null;
  thighL.rotation.set(0, 0, 0);
  shinL.rotation.set(0, 0, 0);
  thighR.rotation.set(0, 0, 0);
  shinR.rotation.set(0, 0, 0);
  upperArmL.rotation.set(0, 0, 0);
  upperArmR.rotation.set(0, 0, 0);
  foreArmL.rotation.set(0, 0, 0);
  foreArmR.rotation.set(0, 0, 0);
  shoulderL.rotation.set(0, 0, 0);
  shoulderR.rotation.set(0, 0, 0);
  hips.rotation.set(0, 0, 0);
  swayOn = true;
}

function runPose(dur, apply) {
  swayOn = false;
  thighL.rotation.set(0, 0, 0);
  shinL.rotation.set(0, 0, 0);
  thighR.rotation.set(0, 0, 0);
  shinR.rotation.set(0, 0, 0);
  upperArmL.rotation.set(0, 0, 0);
  upperArmR.rotation.set(0, 0, 0);
  foreArmL.rotation.set(0, 0, 0);
  foreArmR.rotation.set(0, 0, 0);
  shoulderL.rotation.set(0, 0, 0);
  shoulderR.rotation.set(0, 0, 0);
  hips.rotation.set(0, 0, 0);
  poseAnim = { t0: performance.now(), dur, apply };
}

document.getElementById('bendKnee').addEventListener('click', () => {
  runPose(1400, (u) => {
    const wave = Math.sin(u * Math.PI);
    thighL.rotation.x = -0.55 * wave;
    shinL.rotation.x = 1.15 * wave;
  });
});

document.getElementById('bendArm').addEventListener('click', () => {
  runPose(1400, (u) => {
    const wave = Math.sin(u * Math.PI);
    upperArmR.rotation.x = -1.2 * wave;
    foreArmR.rotation.x = -0.6 * wave;
  });
});

document.getElementById('resetPose').addEventListener('click', resetPose);

function easeOutBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function frame(now) {
  if (poseAnim) {
    const u = Math.min(1, (now - poseAnim.t0) / poseAnim.dur);
    poseAnim.apply(u);
    if (u >= 1) {
      poseAnim = null;
      thighL.rotation.x = 0;
      shinL.rotation.x = 0;
      upperArmR.rotation.x = 0;
      foreArmR.rotation.x = 0;
      swayOn = true;
    }
  } else if (swayOn) {
    const t = now / 1000;
    hips.rotation.y = Math.sin(t * 0.7) * 0.06;
    if (step === 4) {
      // 6-box MC body is rigid under hips — only yaw so orbit reads as one figure
    } else {
      upperArmL.rotation.x = Math.sin(t * 1.1) * 0.08;
      upperArmR.rotation.x = Math.sin(t * 1.1 + 0.4) * -0.08;
      thighL.rotation.x = Math.sin(t * 0.9) * 0.04;
      thighR.rotation.x = Math.sin(t * 0.9 + Math.PI) * 0.04;
    }
  }

  if (particleReveal) {
    const u = (now - particleReveal.t0) / particleReveal.dur;
    let allDone = true;
    for (const p of particles) {
      const local = (u - p.delay) / 0.3;
      if (local < 0) {
        p.mesh.scale.setScalar(0.01);
        allDone = false;
      } else if (local < 1) {
        p.mesh.scale.setScalar(Math.max(0.01, easeOutBack(local)));
        allDone = false;
      } else {
        p.mesh.scale.setScalar(1);
      }
    }
    if (u >= 1.35 && allDone) particleReveal = null;
  }

  if (fineReveal) {
    const u = (now - fineReveal.t0) / fineReveal.dur;
    let allDone = true;
    for (const p of fineParticles) {
      const local = (u - p.delay) / 0.28;
      if (local < 0) {
        p.mesh.scale.setScalar(0.01);
        allDone = false;
      } else if (local < 1) {
        p.mesh.scale.setScalar(Math.max(0.01, easeOutBack(local)));
        allDone = false;
      } else {
        p.mesh.scale.setScalar(1);
      }
    }
    if (u >= 1.35 && allDone) fineReveal = null;
  }

  if (skinReveal) {
    const u = (now - skinReveal.t0) / skinReveal.dur;
    let allDone = true;
    for (const b of mcBoxes) {
      const local = (u - b.delay) / 0.28;
      if (local < 0) {
        b.mesh.scale.setScalar(0.01);
        allDone = false;
      } else if (local < 1) {
        b.mesh.scale.setScalar(Math.max(0.01, easeOutBack(local)));
        allDone = false;
      } else {
        b.mesh.scale.setScalar(1);
      }
    }
    // Teaching stickers: fade in briefly, then fade out so only per-face mats remain
    for (const d of skinDecals) {
      const local = (u - d.delay) / 0.22;
      if (local < 0) {
        d.mat.opacity = 0;
        allDone = false;
      } else if (local < 1) {
        d.mat.opacity = local * 0.85;
        allDone = false;
      } else if (u < 0.72) {
        d.mat.opacity = 0.85;
      } else {
        const fade = 1 - Math.min(1, (u - 0.72) / 0.22);
        d.mat.opacity = Math.max(0, 0.85 * fade);
        if (fade > 0) allDone = false;
        if (fade <= 0) d.mesh.visible = false;
      }
    }
    for (const w of wrapFaces) {
      w.mat.opacity = 0;
      w.mesh.visible = false;
    }
    if (u >= 1.05 && allDone) skinReveal = null;
  }

  if (sunGroup.visible) {
    const pulse = 1 + Math.sin((now - _sunPulse.t0) / 1000 * 2.2) * 0.06;
    sunCore.scale.setScalar(pulse);
    sunGlow.scale.setScalar(pulse);
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Load green ninja assets from repo
function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('fail ' + url));
    img.src = url;
  });
}

(async () => {
  try {
    const [skinImg, dHead, dTorso, dLegs] = await Promise.all([
      loadImage('../../assets/sprites/mc-ninja/mc-skin-256.png?v=mc11'),
      loadImage('../../assets/sprites/mc-ninja/sticker-head.png'),
      loadImage('../../assets/sprites/mc-ninja/sticker-torso.png'),
      loadImage('../../assets/sprites/mc-ninja/sticker-legs.png'),
    ]);
    buildMcSkins(skinImg, { head: dHead, torso: dTorso, legs: dLegs });
    skinReady = true;
    if (step === 4) showSkinStaggered();
  } catch (err) {
    console.error(err);
    lessonEl.innerHTML = '④ 绿色忍者皮肤加载失败——请检查网络后刷新';
  }
})();
</script>
