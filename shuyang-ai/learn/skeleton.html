<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('bone');
const stage = document.getElementById('stage');
const lessonEl = document.getElementById('lesson');
const badgeEl = document.getElementById('badge');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(2.6, 1.9, 3.4);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff5e0, 1.15);
key.position.set(3.5, 6, 2.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xa8d8ff, 0.35);
fill.position.set(-3, 2, -2);
scene.add(fill);

// Cartoon bone palette (ivory / warm cream — not medical)
const BONE = new THREE.MeshStandardMaterial({
  color: 0xf2e6c9, roughness: 0.55, metalness: 0.05,
});
const JOINT = new THREE.MeshStandardMaterial({
  color: 0xffe7a0, roughness: 0.4, metalness: 0.08,
});
const ACCENT = new THREE.MeshStandardMaterial({
  color: 0xe8c878, roughness: 0.45, metalness: 0.05,
});

const figure = new THREE.Group();
scene.add(figure);

/** Create a bone cylinder between two world-ish local points, parented to `parent`. */
function addBone(parent, ax, ay, az, bx, by, bz, radius = 0.055) {
  const a = new THREE.Vector3(ax, ay, az);
  const b = new THREE.Vector3(bx, by, bz);
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dir = b.clone().sub(a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, 10);
  const mesh = new THREE.Mesh(geo, BONE);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  parent.add(mesh);
  return mesh;
}

function addJoint(parent, x, y, z, r = 0.09) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), JOINT);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

// Hierarchy for optional bends: hip → thigh → shin, shoulder → upper → forearm
const hips = new THREE.Group();
hips.position.set(0, 1.05, 0);
figure.add(hips);

// Pelvis / torso / head (static relative to hips root)
addJoint(hips, 0, 0, 0, 0.11); // pelvis center
addBone(hips, -0.16, 0, 0, 0.16, 0, 0, 0.05);
addJoint(hips, -0.18, 0, 0, 0.09);
addJoint(hips, 0.18, 0, 0, 0.09);

// Spine
addBone(hips, 0, 0.05, 0, 0, 0.45, 0, 0.06);
addJoint(hips, 0, 0.45, 0, 0.08);
addBone(hips, 0, 0.45, 0, 0, 0.78, 0, 0.055);
addJoint(hips, 0, 0.78, 0, 0.085); // chest / neck base

// Shoulders
addBone(hips, -0.32, 0.76, 0, 0.32, 0.76, 0, 0.045);
addJoint(hips, -0.34, 0.76, 0, 0.095);
addJoint(hips, 0.34, 0.76, 0, 0.095);

// Neck + head (cartoon sphere head)
addBone(hips, 0, 0.78, 0, 0, 0.98, 0, 0.04);
addJoint(hips, 0, 1.08, 0, 0.18); // head
// tiny "face" dots so front is clear
const faceDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0x3a2a10 })
);
faceDot.position.set(-0.06, 1.1, 0.15);
hips.add(faceDot);
const faceDot2 = faceDot.clone();
faceDot2.position.x = 0.06;
hips.add(faceDot2);
const smile = new THREE.Mesh(
  new THREE.TorusGeometry(0.06, 0.012, 6, 12, Math.PI),
  new THREE.MeshBasicMaterial({ color: 0x3a2a10 })
);
smile.position.set(0, 1.02, 0.155);
smile.rotation.x = Math.PI;
hips.add(smile);

// Arms — left
const shoulderL = new THREE.Group();
shoulderL.position.set(-0.34, 0.76, 0);
hips.add(shoulderL);
const upperArmL = new THREE.Group();
shoulderL.add(upperArmL);
addBone(upperArmL, 0, 0, 0, 0, -0.38, 0, 0.048);
addJoint(upperArmL, 0, -0.38, 0, 0.075); // elbow
const foreArmL = new THREE.Group();
foreArmL.position.set(0, -0.38, 0);
upperArmL.add(foreArmL);
addBone(foreArmL, 0, 0, 0, 0, -0.34, 0, 0.042);
addJoint(foreArmL, 0, -0.34, 0, 0.065); // wrist/hand blob

// Arms — right
const shoulderR = new THREE.Group();
shoulderR.position.set(0.34, 0.76, 0);
hips.add(shoulderR);
const upperArmR = new THREE.Group();
shoulderR.add(upperArmR);
addBone(upperArmR, 0, 0, 0, 0, -0.38, 0, 0.048);
addJoint(upperArmR, 0, -0.38, 0, 0.075);
const foreArmR = new THREE.Group();
foreArmR.position.set(0, -0.38, 0);
upperArmR.add(foreArmR);
addBone(foreArmR, 0, 0, 0, 0, -0.34, 0, 0.042);
addJoint(foreArmR, 0, -0.34, 0, 0.065);

// Legs — left
const hipL = new THREE.Group();
hipL.position.set(-0.18, 0, 0);
hips.add(hipL);
const thighL = new THREE.Group();
hipL.add(thighL);
addBone(thighL, 0, 0, 0, 0, -0.48, 0, 0.055);
addJoint(thighL, 0, -0.48, 0, 0.085); // knee
const shinL = new THREE.Group();
shinL.position.set(0, -0.48, 0);
thighL.add(shinL);
addBone(shinL, 0, 0, 0, 0, -0.48, 0, 0.048);
addJoint(shinL, 0, -0.48, 0, 0.07); // ankle
// foot
addBone(shinL, 0, -0.48, 0, 0, -0.48, 0.16, 0.04);
addJoint(shinL, 0, -0.48, 0.16, 0.055);

// Legs — right
const hipR = new THREE.Group();
hipR.position.set(0.18, 0, 0);
hips.add(hipR);
const thighR = new THREE.Group();
hipR.add(thighR);
addBone(thighR, 0, 0, 0, 0, -0.48, 0, 0.055);
addJoint(thighR, 0, -0.48, 0, 0.085);
const shinR = new THREE.Group();
shinR.position.set(0, -0.48, 0);
thighR.add(shinR);
addBone(shinR, 0, 0, 0, 0, -0.48, 0, 0.048);
addJoint(shinR, 0, -0.48, 0, 0.07);
addBone(shinR, 0, -0.48, 0, 0, -0.48, 0.16, 0.04);
addJoint(shinR, 0, -0.48, 0.16, 0.055);

// ─── Step 2: particle / block body (many different granules) ───
const PARTICLE_COLORS = [
  0xff8a65, 0xffd54f, 0x81c784, 0x64b5f6, 0xba68c8,
  0xffb74d, 0x4dd0e1, 0xf06292, 0xaed581, 0xffe082,
  0x90caf9, 0xce93d8, 0xffab91, 0x80cbc4, 0xfff176,
];

const particles = []; // { mesh, delay, fromScale }
let particleReveal = null; // { t0, dur }

function seeded(i) {
  // simple deterministic pseudo-random from index
  const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

function addParticlesAlong(parent, ax, ay, az, bx, by, bz, count, radius, seedBase) {
  const a = new THREE.Vector3(ax, ay, az);
  const b = new THREE.Vector3(bx, by, bz);
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const r1 = seeded(seedBase + i * 3);
    const r2 = seeded(seedBase + i * 3 + 1);
    const r3 = seeded(seedBase + i * 3 + 2);
    const ang = r1 * Math.PI * 2;
    const rad = radius * (0.35 + r2 * 0.85);
    const along = a.clone().lerp(b, t);
    along.x += Math.cos(ang) * rad;
    along.z += Math.sin(ang) * rad;
    along.y += (r3 - 0.5) * radius * 0.5;

    const color = PARTICLE_COLORS[(seedBase + i) % PARTICLE_COLORS.length];
    const size = 0.04 + r2 * 0.055;
    const isBox = (seedBase + i) % 3 !== 0;
    const geo = isBox
      ? new THREE.BoxGeometry(size, size * (0.7 + r1 * 0.6), size * (0.7 + r3 * 0.6))
      : new THREE.SphereGeometry(size * 0.55, 8, 6);
    const mat = new THREE.MeshStandardMaterial({
      color, roughness: 0.55, metalness: 0.08,
      transparent: true, opacity: 1,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(along);
    mesh.rotation.set(r1 * 1.2, r2 * 1.5, r3 * 0.8);
    mesh.visible = false;
    mesh.scale.setScalar(0.01);
    parent.add(mesh);
    particles.push({
      mesh,
      delay: (seedBase * 0.01 + i * 0.028) % 0.85,
      targetScale: 1,
    });
  }
}

// Torso / head / pelvis hull particles (on hips)
addParticlesAlong(hips, 0, 0.05, 0, 0, 0.78, 0, 18, 0.16, 10);
addParticlesAlong(hips, -0.12, 0.2, 0, 0.12, 0.7, 0, 10, 0.14, 40);
addParticlesAlong(hips, 0, 0.95, 0, 0, 1.18, 0, 12, 0.14, 70); // head cloud
addParticlesAlong(hips, -0.14, -0.02, 0, 0.14, 0.08, 0, 8, 0.12, 95); // pelvis

// Arms
addParticlesAlong(upperArmL, 0, 0, 0, 0, -0.38, 0, 8, 0.09, 110);
addParticlesAlong(foreArmL, 0, 0, 0, 0, -0.34, 0, 7, 0.08, 130);
addParticlesAlong(upperArmR, 0, 0, 0, 0, -0.38, 0, 8, 0.09, 150);
addParticlesAlong(foreArmR, 0, 0, 0, 0, -0.34, 0, 7, 0.08, 170);

// Legs
addParticlesAlong(thighL, 0, 0, 0, 0, -0.48, 0, 9, 0.1, 190);
addParticlesAlong(shinL, 0, 0, 0, 0, -0.48, 0, 8, 0.09, 210);
addParticlesAlong(thighR, 0, 0, 0, 0, -0.48, 0, 9, 0.1, 230);
addParticlesAlong(shinR, 0, 0, 0, 0, -0.48, 0, 8, 0.09, 250);

// ─── Step 3: skin patches stuck on one by one ───
function makeSkinTexture(baseHex, freckleHex) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#' + baseHex.toString(16).padStart(6, '0');
  ctx.fillRect(0, 0, 64, 64);
  // soft blotches so each patch looks like a different skin scrap
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#' + freckleHex.toString(16).padStart(6, '0');
  for (let i = 0; i < 18; i++) {
    const x = (Math.sin(i * 7.1 + baseHex) * 0.5 + 0.5) * 64;
    const y = (Math.cos(i * 5.3 + freckleHex) * 0.5 + 0.5) * 64;
    ctx.beginPath();
    ctx.arc(x, y, 3 + (i % 5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 2;
  ctx.strokeRect(2, 2, 60, 60);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const skinPatches = []; // { mesh, delay }
let skinReveal = null;

function addSkinPatch(parent, opts) {
  const {
    w, h, x, y, z, rx = 0, ry = 0, rz = 0,
    color = 0xf5c9a8, freckle = 0xe8a882, delay = 0, isBox = false, d = 0.04,
  } = opts;
  const tex = makeSkinTexture(color, freckle);
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.75, metalness: 0.02,
    transparent: true, opacity: 0, side: THREE.DoubleSide,
  });
  const geo = isBox
    ? new THREE.BoxGeometry(w, h, d)
    : new THREE.PlaneGeometry(w, h);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.visible = false;
  parent.add(mesh);
  skinPatches.push({ mesh, delay, mat });
  return mesh;
}

// Head “face / scalp” scraps
addSkinPatch(hips, { w: 0.38, h: 0.38, x: 0, y: 1.08, z: 0.12, color: 0xffd7b5, freckle: 0xf0b090, delay: 0.00 });
addSkinPatch(hips, { w: 0.36, h: 0.36, x: 0, y: 1.08, z: -0.12, ry: Math.PI, color: 0xf5c9a8, freckle: 0xe0a070, delay: 0.06 });
addSkinPatch(hips, { w: 0.34, h: 0.34, x: 0.14, y: 1.08, z: 0, ry: Math.PI / 2, color: 0xf8d0b0, freckle: 0xe8b080, delay: 0.12 });
addSkinPatch(hips, { w: 0.34, h: 0.34, x: -0.14, y: 1.08, z: 0, ry: -Math.PI / 2, color: 0xf2c4a0, freckle: 0xd89870, delay: 0.18 });

// Torso front / back / sides (piece by piece)
addSkinPatch(hips, { w: 0.42, h: 0.55, x: 0, y: 0.42, z: 0.14, color: 0xf5c9a8, freckle: 0xe8a882, delay: 0.24, isBox: true, d: 0.05 });
addSkinPatch(hips, { w: 0.42, h: 0.55, x: 0, y: 0.42, z: -0.14, color: 0xeeb896, freckle: 0xd89070, delay: 0.32, isBox: true, d: 0.05 });
addSkinPatch(hips, { w: 0.28, h: 0.5, x: 0.2, y: 0.4, z: 0, ry: Math.PI / 2, color: 0xf0c0a0, freckle: 0xe0a078, delay: 0.40, isBox: true, d: 0.04 });
addSkinPatch(hips, { w: 0.28, h: 0.5, x: -0.2, y: 0.4, z: 0, ry: -Math.PI / 2, color: 0xf8d0b0, freckle: 0xe8b088, delay: 0.48, isBox: true, d: 0.04 });

// Pelvis wrap
addSkinPatch(hips, { w: 0.4, h: 0.22, x: 0, y: 0.02, z: 0.1, color: 0xe8b890, freckle: 0xd09060, delay: 0.55, isBox: true, d: 0.06 });

// Upper arms
addSkinPatch(upperArmL, { w: 0.16, h: 0.36, x: 0, y: -0.19, z: 0.08, color: 0xf5c9a8, freckle: 0xe8a882, delay: 0.60, isBox: true, d: 0.12 });
addSkinPatch(upperArmR, { w: 0.16, h: 0.36, x: 0, y: -0.19, z: 0.08, color: 0xf2c4a0, freckle: 0xe0a070, delay: 0.66, isBox: true, d: 0.12 });
addSkinPatch(foreArmL, { w: 0.14, h: 0.3, x: 0, y: -0.17, z: 0.07, color: 0xffd7b5, freckle: 0xf0b090, delay: 0.72, isBox: true, d: 0.1 });
addSkinPatch(foreArmR, { w: 0.14, h: 0.3, x: 0, y: -0.17, z: 0.07, color: 0xf8d0b0, freckle: 0xe8b080, delay: 0.78, isBox: true, d: 0.1 });

// Legs
addSkinPatch(thighL, { w: 0.18, h: 0.44, x: 0, y: -0.24, z: 0.09, color: 0xf0c0a0, freckle: 0xd89870, delay: 0.84, isBox: true, d: 0.14 });
addSkinPatch(thighR, { w: 0.18, h: 0.44, x: 0, y: -0.24, z: 0.09, color: 0xeeb896, freckle: 0xd89070, delay: 0.90, isBox: true, d: 0.14 });
addSkinPatch(shinL, { w: 0.15, h: 0.42, x: 0, y: -0.24, z: 0.08, color: 0xf5c9a8, freckle: 0xe8a882, delay: 0.96, isBox: true, d: 0.12 });
addSkinPatch(shinR, { w: 0.15, h: 0.42, x: 0, y: -0.24, z: 0.08, color: 0xf2c4a0, freckle: 0xe0a070, delay: 1.02, isBox: true, d: 0.12 });

// Soft ground ring
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(1.35, 48),
  new THREE.MeshStandardMaterial({ color: 0x1e3a28, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.02;
scene.add(ground);
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(1.2, 0.025, 8, 48),
  ACCENT
);
ring.rotation.x = Math.PI / 2;
ring.position.y = 0.03;
scene.add(ring);

figure.position.y = 0;

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * 0.92;
controls.enablePan = false;
controls.update();

function resize() {
  const w = stage.clientWidth || 320;
  const h = stage.clientHeight || 340;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
resize();
new ResizeObserver(resize).observe(stage);

// Mild idle sway (stops briefly while posing animation runs)
let swayOn = true;
let poseAnim = null; // { t0, dur, apply(u) }
let step = 1;

const LESSONS = {
  1: {
    html: '① <strong>只看骨头</strong>——里面先有一副会动的骨头架。',
    badge: '🦴 只看骨头',
  },
  2: {
    html: '② <strong>模型＝很多不同的小颗粒拼起来的</strong>——不是一整块魔法固体哦！',
    badge: '🧱 颗粒模型',
  },
  3: {
    html: '③ <strong>皮肤＝一块一块（一张一张）贴上去的</strong>——不是一下子画上去的！',
    badge: '🩹 贴皮肤',
  },
};

function hideAllParticles() {
  particleReveal = null;
  for (const p of particles) {
    p.mesh.visible = false;
    p.mesh.scale.setScalar(0.01);
  }
}

function hideAllSkin() {
  skinReveal = null;
  for (const s of skinPatches) {
    s.mesh.visible = false;
    s.mat.opacity = 0;
  }
}

function showParticlesAssembling() {
  hideAllSkin();
  for (const p of particles) {
    p.mesh.visible = true;
    p.mesh.scale.setScalar(0.01);
  }
  particleReveal = { t0: performance.now(), dur: 1100 };
}

function showSkinStaggered() {
  // keep particles visible under / with skin
  for (const p of particles) {
    p.mesh.visible = true;
    p.mesh.scale.setScalar(1);
  }
  particleReveal = null;
  for (const s of skinPatches) {
    s.mesh.visible = true;
    s.mat.opacity = 0;
  }
  skinReveal = { t0: performance.now(), dur: 1600 };
}

function setStep(n) {
  step = n;
  document.getElementById('stepBones').classList.toggle('active', n === 1);
  document.getElementById('stepParticles').classList.toggle('active', n === 2);
  document.getElementById('stepSkin').classList.toggle('active', n === 3);
  const L = LESSONS[n];
  lessonEl.innerHTML = L.html;
  badgeEl.textContent = L.badge;

  if (n === 1) {
    hideAllParticles();
    hideAllSkin();
  } else if (n === 2) {
    showParticlesAssembling();
  } else {
    showSkinStaggered();
  }
}

document.getElementById('stepBones').addEventListener('click', () => setStep(1));
document.getElementById('stepParticles').addEventListener('click', () => setStep(2));
document.getElementById('stepSkin').addEventListener('click', () => setStep(3));

function resetPose() {
  poseAnim = null;
  thighL.rotation.set(0, 0, 0);
  shinL.rotation.set(0, 0, 0);
  thighR.rotation.set(0, 0, 0);
  shinR.rotation.set(0, 0, 0);
  upperArmL.rotation.set(0, 0, 0);
  upperArmR.rotation.set(0, 0, 0);
  foreArmL.rotation.set(0, 0, 0);
  foreArmR.rotation.set(0, 0, 0);
  shoulderL.rotation.set(0, 0, 0);
  shoulderR.rotation.set(0, 0, 0);
  hips.rotation.set(0, 0, 0);
  swayOn = true;
}

function runPose(dur, apply) {
  swayOn = false;
  thighL.rotation.set(0, 0, 0);
  shinL.rotation.set(0, 0, 0);
  thighR.rotation.set(0, 0, 0);
  shinR.rotation.set(0, 0, 0);
  upperArmL.rotation.set(0, 0, 0);
  upperArmR.rotation.set(0, 0, 0);
  foreArmL.rotation.set(0, 0, 0);
  foreArmR.rotation.set(0, 0, 0);
  shoulderL.rotation.set(0, 0, 0);
  shoulderR.rotation.set(0, 0, 0);
  hips.rotation.set(0, 0, 0);
  poseAnim = { t0: performance.now(), dur, apply };
}

document.getElementById('bendKnee').addEventListener('click', () => {
  runPose(1400, (u) => {
    const wave = Math.sin(u * Math.PI);
    thighL.rotation.x = -0.55 * wave;
    shinL.rotation.x = 1.15 * wave;
  });
});

document.getElementById('bendArm').addEventListener('click', () => {
  runPose(1400, (u) => {
    const wave = Math.sin(u * Math.PI);
    upperArmR.rotation.x = -1.2 * wave;
    foreArmR.rotation.x = -0.6 * wave;
  });
});

document.getElementById('resetPose').addEventListener('click', resetPose);

function easeOutBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function frame(now) {
  if (poseAnim) {
    const u = Math.min(1, (now - poseAnim.t0) / poseAnim.dur);
    poseAnim.apply(u);
    if (u >= 1) {
      poseAnim = null;
      thighL.rotation.x = 0;
      shinL.rotation.x = 0;
      upperArmR.rotation.x = 0;
      foreArmR.rotation.x = 0;
      swayOn = true;
    }
  } else if (swayOn) {
    const t = now / 1000;
    hips.rotation.y = Math.sin(t * 0.7) * 0.06;
    upperArmL.rotation.x = Math.sin(t * 1.1) * 0.08;
    upperArmR.rotation.x = Math.sin(t * 1.1 + 0.4) * -0.08;
    thighL.rotation.x = Math.sin(t * 0.9) * 0.04;
    thighR.rotation.x = Math.sin(t * 0.9 + Math.PI) * 0.04;
  }

  // Particle assemble animation
  if (particleReveal) {
    const u = (now - particleReveal.t0) / particleReveal.dur;
    let allDone = true;
    for (const p of particles) {
      const local = (u - p.delay) / 0.35;
      if (local < 0) {
        p.mesh.scale.setScalar(0.01);
        allDone = false;
      } else if (local < 1) {
        const s = easeOutBack(local);
        p.mesh.scale.setScalar(Math.max(0.01, s));
        allDone = false;
      } else {
        p.mesh.scale.setScalar(1);
      }
    }
    if (u >= 1.4 && allDone) particleReveal = null;
  }

  // Skin patch stagger fade-in
  if (skinReveal) {
    const u = (now - skinReveal.t0) / skinReveal.dur;
    let allDone = true;
    for (const s of skinPatches) {
      const local = (u - s.delay * 0.55) / 0.28;
      if (local < 0) {
        s.mat.opacity = 0;
        allDone = false;
      } else if (local < 1) {
        s.mat.opacity = local;
        allDone = false;
      } else {
        s.mat.opacity = 1;
      }
    }
    if (u >= 1.5 && allDone) skinReveal = null;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
