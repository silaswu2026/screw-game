<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>玩我的关 · Cocos · 第9关沼泽</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1520 url(../../../xy-go/scenes/canopy-night.jpg) center/cover no-repeat}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#f7f4ff;height:100dvh;height:100vh;position:relative}
.bar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;gap:6px;padding:4px 8px;align-items:center;background:#05070f99;min-height:32px;backdrop-filter:blur(4px)}
.bar a,.bar button.net{color:#fff;font-weight:800;text-decoration:none;background:#3b4590;border:0;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.bar button.net{background:linear-gradient(180deg,#78d484,#4ea85c);color:#083018}
h1{margin:0;font-size:13px;color:#ffe7a0;flex:1;text-align:center;font-weight:900}
.badge{font-size:10px;font-weight:800;color:#1a2040;background:linear-gradient(180deg,#9ff0a8,#4ea85c);border-radius:999px;padding:3px 8px}
#orientTip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:34px;z-index:12;font-size:11px;font-weight:800;color:#ffe7a0;background:#1a2048cc;padding:3px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
#orientTip.on{display:block}
.shell{position:fixed;inset:0;z-index:0;width:100%;height:100%;background:#0b1520 url(../../../xy-go/scenes/canopy-night.jpg) center/cover no-repeat;display:block}
.cvwrap{position:absolute;inset:0;width:100%;height:100%;background:transparent;overflow:hidden;line-height:0}
#gameCanvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;background:#0b1520 url(../../../xy-go/scenes/canopy-night.jpg) center/cover no-repeat;touch-action:none;opacity:0;transition:opacity .05s linear}
/* HUD — xy-go style: level card + green bar + coins (no six hearts) */
.hud{position:fixed;top:40px;left:8px;right:8px;z-index:28;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.lvlcard{background:#102016ee;border-radius:10px;padding:7px 12px;min-width:132px;min-height:44px;border:1px solid #9ff0a855;box-shadow:0 2px 8px #0006}
#lvlChip{display:block;font-size:14px;font-weight:900;color:#fff;line-height:1.3;min-height:18px;margin:0 0 5px;white-space:nowrap}
#hp{display:flex;align-items:center;gap:6px;min-height:14px}
#hp .hpchip{font-size:11px;font-weight:900;color:#9ff0a8;background:#1a3a24;border-radius:999px;padding:2px 7px;line-height:1.2}
#hp .hpbar{display:inline-block;width:84px;height:10px;background:#1a3020;border-radius:5px;overflow:hidden;vertical-align:middle;border:1px solid #4ea85c66}
#hp .hpbar i{display:block;height:100%;min-height:8px;background:linear-gradient(90deg,#4ea85c,#9ff0a8);width:100%}
#coins{font-size:14px;color:#ffe7a0;font-weight:800;text-shadow:0 1px 3px #000a;background:#102016ee;border-radius:10px;padding:6px 10px;border:1px solid #ffe7a044}
#bossBar{display:none;position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:28;background:#102016ee;border-radius:10px;padding:6px 12px;min-width:200px;max-width:90%;pointer-events:none;border:1px solid #ff5a5a66}
#bossBar.on{display:block}
#bossBar .bn{font-size:13px;font-weight:800;color:#fff;margin:0 0 4px;text-align:center}
#bossBar .bb{height:8px;background:#3a1818;border-radius:4px;overflow:hidden}
#bossBar .bb i{display:block;height:100%;background:#ff5a5a;width:100%}
#msg{position:fixed;top:128px;left:0;right:0;z-index:28;text-align:center;font-weight:800;font-size:12px;color:#fff;text-shadow:0 1px 4px #000c;pointer-events:none;padding:0 8px}
#boot{display:none;position:absolute;inset:0;z-index:15;align-items:center;justify-content:center;text-align:center;font-size:13px;color:#ffb4b4;font-weight:800;background:#05070fcc;padding:16px}
#boot.err{display:flex}
#netBanner{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:11;font-size:12px;font-weight:800;background:#1a2048ee;color:#9ff0a8;padding:4px 12px;border-radius:999px;white-space:nowrap}
#netBanner.on{display:block}
#netPanel{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;background:rgba(8,10,20,.82)}
#netPanel.on{display:flex}
#netPanel .card{background:linear-gradient(180deg,#2a3360,#1a2048);border:2px solid #9ff0a866;border-radius:16px;padding:16px 18px;text-align:center;max-width:92%;min-width:260px}
#netPanel h2{margin:0 0 8px;font-size:18px;color:#ffe7a0}
#netPanel p{margin:0 0 10px;font-size:13px;color:#c9c3ef;font-weight:700}
#netPanel .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
/* Touch — ALWAYS in view on desktop too (was display:none ≥900px → 投丢失) */
.touch{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-between;gap:10px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));user-select:none;pointer-events:none;background:transparent}
.touch .cluster{display:flex;gap:8px;pointer-events:auto}
.touch button{border:0;border-radius:16px;width:64px;height:64px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(180deg,#5a6ab0dd,#3b4590ee);box-shadow:0 3px 0 #2a3268;touch-action:none}
.touch button:active,.touch button.on{transform:translateY(2px);box-shadow:none;background:linear-gradient(180deg,#78d484,#4ea85c)}
.touch #btnJ{width:72px;background:linear-gradient(180deg,#ffb06bdd,#e2793bee);box-shadow:0 3px 0 #a35a20;font-size:16px}
.touch #btnT{width:72px;background:linear-gradient(180deg,#7ab0ffdd,#3b6fd4ee);box-shadow:0 3px 0 #274a8a;font-size:16px}
.dock{position:absolute;z-index:9;right:8px;top:44px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.go{border:0;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(180deg,#78d484,#4ea85c);box-shadow:0 2px 0 #2f6d3a;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.go.sec{background:linear-gradient(180deg,#7ab0ff,#3b6fd4);box-shadow:0 2px 0 #274a8a;font-size:11px}
#result{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;background:rgba(8,10,28,.75)}
#result.show{display:flex}
#result .card{background:linear-gradient(180deg,#2a3360,#1a2048);border:2px solid #ffe7a066;border-radius:18px;padding:14px 18px;text-align:center;max-width:92%}
#result .big{font-size:28px;font-weight:900;margin:0 0 6px}
#result .sub{font-size:13px;color:#c9c3ef;font-weight:800;margin:0 0 10px}
#result .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (orientation:portrait){
  #orientTip.on{display:block}
  .touch button{width:72px;height:72px}.touch #btnJ,.touch #btnT{width:88px}
  .hud{top:38px}.lvlcard{min-height:48px}#lvlChip{font-size:15px}#bossBar{top:100px}#msg{top:134px}
}
@media (orientation:landscape),(max-height:480px){
  #orientTip{display:none!important}
  .bar{min-height:26px;padding:2px 8px}h1{font-size:12px}.badge{display:none}
  .touch{background:transparent}
  .touch button{width:52px;height:52px;font-size:18px}.touch #btnJ,.touch #btnT{width:64px;font-size:14px}
  .hud{top:32px}#msg{font-size:11px;top:110px}#bossBar{top:84px}
}
@media (min-width:900px) and (min-height:520px){
  /* Keep touch visible; no bottom black letterbox strip */
  .touch{padding-bottom:14px;background:transparent}
  .touch button{width:58px;height:58px}
  .touch #btnJ,.touch #btnT{width:70px}
  .dock{top:auto;bottom:78px;right:12px}
  .cvwrap{border-radius:0}
  html,body{background:#0b1520 url(../../../xy-go/scenes/canopy-night.jpg) center/cover no-repeat}
}
</style>
<script>document.ccConfig={debugMode:0,frameRate:60,id:"gameCanvas",renderMode:1,showFPS:false};</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>
</head>
<body>
<div class="bar">
  <a href="../level-design.html?path=tonight&s=3">← 回玩完</a>
  <h1>🎮 玩我的关</h1>
  <button class="net" id="btnNet" type="button">🤝 联机游玩</button>
  <span class="badge">Cocos</span>
</div>
<div id="orientTip">📱 竖屏可玩 · 比例同横屏</div>
<div id="netBanner"></div>
    <div class="hud">
      <div class="lvlcard">
        <div id="lvlChip">第9关 我的关卡</div>
        <div id="hp"><span class="hpchip">A 绿</span><span class="hpbar"><i style="width:100%"></i></span></div>
      </div>
      <div id="coins">🪙 0</div>
    </div>
    <div id="bossBar"><div class="bn">鳄鱼王</div><div class="bb"><i style="width:100%"></i></div></div>
    <div id="msg">←→移动 · 跳 · F/J投 · 打鳄王</div>
<div class="shell" id="shell">
  <div class="cvwrap" id="cvwrap">
    <canvas id="gameCanvas" width="640" height="520"></canvas>
    <div id="boot"></div>
    <div class="dock">
      <button class="go" id="retry" type="button">重来</button>
    </div>
    <div id="result" aria-live="polite">
      <div class="card">
        <p class="big" id="resultBig">过关！</p>
        <p class="sub" id="resultSub"></p>
        <div class="ctl">
          <button type="button" class="go" id="again">再玩一次</button>
          <a class="go sec" href="../level-design.html?path=tonight&s=3">去答「和预计一样吗」</a>
        </div>
      </div>
    </div>
    <div class="touch" id="touch">
      <div class="cluster">
        <button type="button" id="btnL" aria-label="左">◀</button>
        <button type="button" id="btnR" aria-label="右">▶</button>
      </div>
      <div class="cluster">
        <button type="button" id="btnJ" aria-label="跳">跳</button>
        <button type="button" id="btnT" aria-label="投">投</button>
      </div>
    </div>
  </div>
</div>
<div id="netPanel">
  <div class="card">
    <h2>🤝 联机游玩</h2>
    <p id="netWait">PeerJS 自动匹配队友…</p>
    <div class="row">
      <button class="go" id="netStart" type="button" style="display:none">开始游戏</button>
      <button class="go sec" id="netCancel" type="button">取消</button>
    </div>
  </div>
</div>
<script src="custom-play.js?v=c19"></script>
</body>
</html>
