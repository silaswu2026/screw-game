<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>玩我的关 · Cocos · 伍澍暘</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#f7f4ff;background:linear-gradient(180deg,#0f1230,#24305f);display:flex;flex-direction:column;min-height:100dvh}
.bar{display:flex;gap:8px;padding:6px 10px 2px;align-items:center;flex-shrink:0}
.bar a{color:#fff;font-weight:800;text-decoration:none;background:#3b4590;border-radius:999px;padding:6px 12px;font-size:13px}
h1{margin:0;font-size:17px;color:#ffe7a0;flex:1;text-align:center;font-weight:900}
.badge{font-size:11px;font-weight:800;color:#1a2040;background:linear-gradient(180deg,#9ff0a8,#4ea85c);border-radius:999px;padding:4px 10px}
main{flex:1;display:flex;flex-direction:column;gap:6px;padding:0 10px 8px;max-width:1100px;width:100%;margin:0 auto;min-height:0}
.cvwrap{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;background:transparent;border-radius:16px;border:2px solid #ffffff33;overflow:hidden}
#gameCanvas{width:100%!important;height:auto!important;max-height:100%;aspect-ratio:960/420;background:#3a5c96;display:block;border-radius:14px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;flex-shrink:0}
#hp{font-size:20px;letter-spacing:1px}
#coins{font-size:16px;color:#ffe7a0}
#msg{text-align:center;font-weight:800;font-size:14px;color:#c9c3ef;min-height:1.2em;flex-shrink:0}
#boot{display:none;text-align:center;font-size:13px;color:#ffb4b4;font-weight:800}
#boot.err{display:block}
.touch{display:flex;justify-content:space-between;gap:10px;padding:4px 0 2px;flex-shrink:0;user-select:none}
.touch .cluster{display:flex;gap:10px}
.touch button{border:0;border-radius:18px;width:72px;height:72px;font-size:28px;font-weight:900;color:#fff;background:linear-gradient(180deg,#5a6ab0,#3b4590);box-shadow:0 4px 0 #2a3268;touch-action:none}
.touch button:active,.touch button.on{transform:translateY(3px);box-shadow:none;background:linear-gradient(180deg,#78d484,#4ea85c)}
.touch #btnJ{width:88px;background:linear-gradient(180deg,#ffb06b,#e2793b);box-shadow:0 4px 0 #a35a20;font-size:22px}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex-shrink:0}
.go{border:0;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(180deg,#78d484,#4ea85c);box-shadow:0 3px 0 #2f6d3a;text-decoration:none;display:inline-flex;align-items:center}
.go.sec{background:linear-gradient(180deg,#7ab0ff,#3b6fd4);box-shadow:0 3px 0 #274a8a;font-size:13px}
#result{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;background:rgba(8,10,28,.75);border-radius:14px}
#result.show{display:flex}
#result .card{background:linear-gradient(180deg,#2a3360,#1a2048);border:2px solid #ffe7a066;border-radius:20px;padding:18px 22px;text-align:center;max-width:92%}
#result .big{font-size:34px;font-weight:900;margin:0 0 8px}
#result .sub{font-size:14px;font-weight:800;color:#c9c3ef;margin:0 0 12px}
.note{text-align:center;font-size:11px;font-weight:800;color:#ffe7a088;margin:0;flex-shrink:0}
@media (max-height:480px){
  .bar{padding:2px 8px}h1{font-size:13px}.badge{display:none}
  .touch button{width:56px;height:56px;font-size:22px}.touch #btnJ{width:68px;font-size:16px}
  #msg,.note{font-size:11px}
}
</style>
<script>document.ccConfig={debugMode:0,frameRate:60,id:"gameCanvas",renderMode:1,showFPS:false};</script>
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>
</head>
<body>
<div class="bar">
  <a href="../level-design.html?path=tonight&s=3">← 回玩完</a>
  <h1>🎮 玩我的关</h1>
  <span class="badge">Cocos ≈ xy-go</span>
</div>
<main>
  <div class="hud"><div id="hp">❤❤❤❤❤❤</div><div id="coins">🪙 0</div></div>
  <div class="cvwrap">
    <canvas id="gameCanvas" width="960" height="420"></canvas>
    <div id="result" aria-live="polite">
      <div class="card">
        <p class="big" id="resultBig">过关！</p>
        <p class="sub" id="resultSub"></p>
        <div class="ctl">
          <button type="button" class="go" id="again">再玩一次</button>
          <a class="go sec" href="../level-design.html?path=tonight&s=3">去答「和预计一样吗」</a>
        </div>
      </div>
    </div>
  </div>
  <div id="boot"></div>
  <div id="msg">← → 移动 · 跳 · 躲刺</div>
  <div class="touch" id="touch">
    <div class="cluster">
      <button type="button" id="btnL" aria-label="左">◀</button>
      <button type="button" id="btnR" aria-label="右">▶</button>
    </div>
    <div class="cluster">
      <button type="button" id="btnJ" aria-label="跳">跳</button>
    </div>
  </div>
  <div class="ctl">
    <button class="go" id="retry" type="button">重来</button>
    <a class="go sec" href="../../xy-go/?custom=1">旧版 xy-go（备用）</a>
  </div>
  <p class="note">同 JSON v1.1 · 绿忍者 · 刺/火/币 · 可操作（非自动跑死）</p>
</main>
<script src="custom-play.js?v=c3"></script>
</body>
</html>
