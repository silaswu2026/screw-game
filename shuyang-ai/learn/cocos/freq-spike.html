<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>频率刺 · Cocos2d-JS 教学台 · 伍澍暘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#f7f4ff;background:linear-gradient(180deg,#0f1230,#24305f);display:flex;flex-direction:column;min-height:100dvh}
.bar{display:flex;gap:8px;padding:10px 12px;align-items:center;flex-wrap:wrap}
.bar a{color:#9ff0a8;font-weight:800;text-decoration:none}
h1{margin:0;font-size:18px;color:#ffe7a0;flex:1;text-align:center}
main{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 12px 12px;max-width:960px;width:100%;margin:0 auto}
.cvwrap{flex:1;min-height:220px;display:flex;align-items:center;justify-content:center;background:#0006;border-radius:14px;border:2px solid #ffffff22;overflow:hidden}
#gameCanvas{width:100%!important;height:auto!important;max-height:56vh;background:#1a2040;display:block;border-radius:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-weight:800}
.ctl input[type=range]{width:min(240px,50vw);height:28px;vertical-align:middle}
.ctl b{font-size:28px;color:#ffe7a0}
.n4{display:flex;gap:4px;justify-content:center;font-size:13px;font-weight:800}
.n4 span{padding:2px 9px;border-radius:999px;background:#ffffff14;color:#c9c3ef}
.n4 span.on{background:#e23b3b;color:#fff}.n4 span.done{background:#2f7a45;color:#fff}
.go{border:0;border-radius:999px;padding:10px 18px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,#78d484,#4ea85c);box-shadow:0 3px 0 #2f6d3a;cursor:pointer}
.go.tw{background:linear-gradient(180deg,#ffb06b,#e2793b);box-shadow:0 3px 0 #a35a20}
.go.ex{background:linear-gradient(180deg,#ff8a8a,#e23b3b);box-shadow:0 3px 0 #8a2020}
#hp,#msg{text-align:center;font-weight:800;font-size:18px;min-height:1.4em}
#msg{font-size:16px;color:#c9c3ef}
#boot{opacity:.55;font-size:11px!important}
.kidsub{text-align:center;font-size:14px;font-weight:800;color:#c9c3ef;margin:0}
.tag{font-size:11px;opacity:.7;text-align:center}
@media (max-height:500px){.bar{padding:4px}.ctl b{font-size:20px}.go{padding:6px 12px;font-size:14px;box-shadow:none}}
</style>
<script>
/* Cocos2d-JS Lite: config BEFORE engine script */
document.ccConfig = {
  debugMode: 1,
  frameRate: 60,
  id: "gameCanvas",
  renderMode: 1, /* canvas preferred for phone teaching */
  showFPS: false
  /* no jsList — [] hangs Lite prepare */
};
</script>
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>
</head>
<body>
<div class="bar">
  <a href="../level-design.html?s=2">← ld27 画布课</a>
  <h1>⏱️ 频率刺 · Cocos2d-JS</h1>
  <span class="tag">engine: cocos2d-js-v3.13-lite</span>
</div>
<main>
  <p class="kidsub">频率=节奏多久来一次 · 好关卡用「节奏组」· 教练变考</p>
  <div class="n4" id="n4"></div>
  <div class="ctl">每 <input type="range" id="fI" min="1" max="5" value="3"> <b id="fIv">3</b> 秒冒一次刺</div>
  <div class="cvwrap"><canvas id="gameCanvas" width="960" height="360"></canvas></div>
  <div id="boot" style="text-align:center;font-size:12px;color:#ffe7a0;min-height:1em">booting…</div>
  <div id="hp">❤❤❤❤❤❤</div>
  <div id="msg">拖滑条看次数；再点 练 / 变 / 考</div>
  <div class="ctl">
    <button class="go" id="fRun">🏃 练：跑一次</button>
    <button class="go tw" id="fTw">🔀 变：每1秒！</button>
    <button class="go ex" id="fEx">🏁 考：最后一跑</button>
  </div>
</main>
<script src="freq-spike.js"></script>
</body>
</html>
