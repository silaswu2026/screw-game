<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>频率刺 · 伍澍暘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#f7f4ff;background:linear-gradient(180deg,#0f1230,#24305f);display:flex;flex-direction:column;min-height:100dvh}
.bar{display:flex;gap:8px;padding:8px 12px 2px;align-items:center}
.bar a{color:#fff;font-weight:800;text-decoration:none;background:#3b4590;border-radius:999px;padding:6px 12px;font-size:14px}
h1{margin:0;font-size:20px;color:#ffe7a0;flex:1;text-align:center;font-weight:900}
main{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 12px 12px;max-width:960px;width:100%;margin:0 auto;min-height:0}
/* hug the canvas — never grow a black letterbox above/below the stage */
.cvwrap{position:relative;flex:0 0 auto;width:100%;display:block;background:transparent;border-radius:16px;border:2px solid #ffffff33;overflow:hidden;line-height:0}
#gameCanvas{width:100%!important;height:auto!important;max-height:none;aspect-ratio:960/300;background:#3a5c96;display:block;vertical-align:top;border-radius:14px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-weight:800}
.ctl input[type=range]{width:min(280px,58vw);height:32px;vertical-align:middle;accent-color:#7ab0ff}
.ctl b#fIv{font-size:36px;color:#ffe7a0;min-width:1.2em;display:inline-block;text-align:center}
.go{border:0;border-radius:999px;padding:12px 20px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(180deg,#78d484,#4ea85c);box-shadow:0 3px 0 #2f6d3a;cursor:pointer;transition:transform .08s}
.go:active{transform:translateY(2px);box-shadow:none}
.go.tw{background:linear-gradient(180deg,#ffb06b,#e2793b);box-shadow:0 3px 0 #a35a20}
.go.ex{background:linear-gradient(180deg,#ff8a8a,#e23b3b);box-shadow:0 3px 0 #8a2020}
.go.on{outline:3px solid #ffe7a0;outline-offset:2px}
#hp{text-align:center;font-weight:800;font-size:22px;letter-spacing:1px}
#msg{text-align:center;font-weight:800;font-size:17px;color:#c9c3ef;min-height:1.4em}
#boot{display:none;text-align:center;font-size:12px;color:#ffb4b4}
#boot.err{display:block}
.kidsub{text-align:center;font-size:15px;font-weight:800;color:#c9c3ef;margin:0}
#result{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;background:rgba(8,10,28,.72);backdrop-filter:blur(2px);border-radius:14px}
#result.show{display:flex}
#result .card{background:linear-gradient(180deg,#2a3360,#1a2048);border:2px solid #ffe7a066;border-radius:20px;padding:22px 28px;text-align:center;box-shadow:0 12px 40px #0008;max-width:90%}
#result .big{font-size:42px;font-weight:900;line-height:1.2;margin:0 0 8px}
#result.win .big{color:#9ff0a8}
#result.fail .big{color:#ffb4b4}
#result .sub{font-size:16px;font-weight:800;color:#c9c3ef;margin:0 0 16px}
#result button{border:0;border-radius:999px;padding:14px 28px;font-size:20px;font-weight:900;color:#1a2040;background:linear-gradient(180deg,#ffe7a0,#f0c45a);box-shadow:0 4px 0 #b88920;cursor:pointer}
#result button:active{transform:translateY(2px);box-shadow:none}
@media (max-height:560px){
  .bar{padding:4px 8px}.bar a{padding:4px 10px;font-size:12px}h1{font-size:15px}
  .kidsub{font-size:12px}.ctl b#fIv{font-size:26px}
  .go{padding:8px 14px;font-size:14px;box-shadow:none}
  #result .big{font-size:32px}#result button{padding:10px 22px;font-size:17px}
}
</style>
<script>
document.ccConfig = {
  debugMode: 0,
  frameRate: 60,
  id: "gameCanvas",
  renderMode: 1,
  showFPS: false
};
</script>
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>
</head>
<body>
<div class="bar">
  <a href="../level-design.html?s=2">← 回频率课</a>
  <h1>⏱️ 频率刺</h1>
  <span style="width:88px"></span>
</div>
<main>
  <p class="kidsub">拖滑条改刺的间隔 · 点下面按钮让忍者跑</p>
  <div class="ctl">每 <input type="range" id="fI" min="1" max="5" value="3"> <b id="fIv">3</b> 秒冒一次刺</div>
  <div class="cvwrap">
    <canvas id="gameCanvas" width="960" height="300"></canvas>
    <div id="result" aria-live="polite">
      <div class="card">
        <p class="big" id="resultBig"></p>
        <p class="sub" id="resultSub"></p>
        <button type="button" id="resultBtn">再试一次</button>
      </div>
    </div>
  </div>
  <div id="boot"></div>
  <div id="hp">❤❤❤❤❤❤</div>
  <div id="msg">每 <b style="color:#ffe7a0">3</b> 秒 → 变密就更疼</div>
  <div class="ctl" id="acts">
    <button class="go" id="fRun" type="button">🏃 练：跑一次</button>
    <button class="go tw" id="fTw" type="button">🔀 变：每1秒！</button>
    <button class="go ex" id="fEx" type="button">🏁 考：最后一跑</button>
  </div>
</main>
<script src="freq-spike.js?v=p3b"></script>
</body>
</html>
