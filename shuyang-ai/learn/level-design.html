<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>关卡设计台 · 伍澍暘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#f7f4ff;background:linear-gradient(180deg,#0f1230,#24305f);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.bar{display:flex;gap:6px;padding:8px 10px 4px;align-items:center}
.pp{margin:0;text-align:center;font-size:11px;font-weight:800;color:#ffe7a0;line-height:1.1}.bar img{width:46px;height:46px;display:block;border-radius:50%;object-fit:cover;object-position:center 18%;border:2px solid #ffe7a0}
.st{flex:1;text-align:center;padding:6px 2px;border-radius:999px;background:#ffffff14;font-weight:800;font-size:15px;color:#c9c3ef;cursor:pointer}
.st.on{background:#4ea85c;color:#fff}.st.done{background:#2f7a4588;color:#fff}
main{flex:1;min-height:0;padding:4px 12px;display:flex;flex-direction:column;gap:6px;max-width:900px;width:100%;margin:0 auto}
.stage{display:none;flex:1;min-height:0;flex-direction:column;gap:6px}.stage.on{display:flex}
h2{margin:0;font-size:20px;color:#ffe7a0;text-align:center}
.row{display:flex;gap:8px;flex:1;min-height:0}.row>*{flex:1;min-width:0}
.card{background:#12183acc;border:2px solid #ffffff22;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800}
.big{font-size:28px}.msg{font-size:16px;text-align:center}
.steps{display:flex;align-items:flex-end;gap:6px;height:100%;min-height:70px;width:100%}
.steps div{flex:1;background:#78d484;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:20px;color:#12162f;padding-top:2px}
svg{width:100%;height:100%;min-height:0}
.trap{flex-direction:row;gap:8px;justify-content:flex-start}
.trap .e{font-size:34px}.trap label{display:flex;flex-direction:column;font-size:13px;flex:1}
.trap input{width:100%}.trap b{color:#ffe7a0;font-size:18px}
.grid{display:grid;gap:2px;width:100%}
.cell{min-width:0;overflow:hidden;aspect-ratio:1.6;border-radius:3px;background:#ffffff0d;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.cell.g{background:#6b4f2f}.cell.p{background:#8a6a40}
.pal button,.th button{border:0;border-radius:999px;padding:5px 10px;font-size:16px;font-weight:800;background:#3b4590;color:#fff;margin:2px}
.pal button.on,.th button.on{background:#4ea85c}
.foot{display:flex;justify-content:space-between;padding:6px 12px 10px;gap:8px}
.foot button,.go{border:0;border-radius:999px;padding:10px 26px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(180deg,#78d484,#4ea85c);box-shadow:0 3px 0 #2f6d3a;text-decoration:none;cursor:pointer}
.foot .back{background:#3b4590;box-shadow:none}
.ok{color:#9ff0a8}.bad{color:#ffb4b4}.chk{font-size:15px}
@media (max-height:500px){.s1h{display:none}.dim input{margin:0}.dim{gap:0!important}.cell{aspect-ratio:2.4}.bar img{width:40px;height:40px}.st{font-size:13px}h2{font-size:17px}}
</style></head><body>
<div class="bar"><figure class="pp"><img src="../avatars/xiaoyu.jpg" alt="小雨" style="object-position:32% 34%"><figcaption>小雨</figcaption></figure>
<div class="st" data-s="0">① 看图学习</div><div class="st" data-s="1">② 动手</div><div class="st" data-s="2">③ 预览</div><div class="st" data-s="3">④ 设计·摆位置</div><div class="st" data-s="4">⑤ 实验·单机玩</div>
<figure class="pp"><img src="../avatars/dad-wuxin.jpg" alt="爸爸"><figcaption>爸爸</figcaption></figure><figure class="pp"><img src="../avatars/mom-chunyan.jpg" alt="妈妈"><figcaption>妈妈</figcaption></figure></div>
<main>
<section class="stage" id="s0"><h2><button class="back sl" id="slp" style="border:0;border-radius:999px;background:#3b4590;color:#fff;font-size:16px;padding:3px 12px">◀</button> <span id="slt">好关卡：先简单，再变难</span> <span id="sld" style="font-size:13px"></span> <button class="sl" id="sln" style="border:0;border-radius:999px;background:#3b4590;color:#fff;font-size:16px;padding:3px 12px">▶</button> <button class="go" id="play0" style="font-size:15px;padding:4px 14px">▶ 播放</button></h2>
<canvas id="cv0" width="960" height="300" style="width:100%;flex:1;min-height:0;background:#0006;border-radius:12px"></canvas>
<div class="msg" style="font-size:14px">🧠 策划故意这样设计 → 让人想「再来一次」· 我们要 ⏰ 适度玩</div></section>

<section class="stage" id="s1"><h2 class="s1h">点关卡里的陷阱，拉数字</h2>
<canvas id="strip" width="960" height="150" style="width:100%;height:56px;flex:none;background:#0006;border-radius:12px;cursor:pointer"></canvas>
<div class="row" id="traps" style="flex-wrap:wrap;gap:4px;align-content:flex-start"></div></section>

<section class="stage" id="sP"><h2>👀 忍者自动闯关</h2>
<canvas id="cv" width="960" height="220" style="width:100%;flex:1;min-height:0;background:#0006;border-radius:12px"></canvas>
<div class="msg" id="res" style="min-height:24px"></div>
<div style="text-align:center"><button class="go" id="run" style="font-size:18px;padding:6px 22px">👀 预览</button></div></section>
<section class="stage" id="s2"><h2>选主题，点格子放东西</h2>
<div class="th" style="text-align:center"><span id="th"></span> <span id="len"></span></div>
<div class="pal" id="pal" style="text-align:center"></div>
<div class="grid" id="grid"></div><div id="scene" style="display:none"><svg id="sv"></svg><div class="chk" style="text-align:center"><button class="pal" id="ov" style="border:0;border-radius:999px;background:#3b4590;color:#fff;font-weight:800;padding:4px 12px">🔲 格子 开/关</button> 1格 = 40像素 · 🥷 1格宽 2格高 · 跳 3格远</div></div>
<div class="chk" id="chk" style="text-align:center"></div><div style="text-align:center"><button class="go" id="prev2" style="font-size:16px;padding:5px 18px">👀 再预览</button></div></section>

<section class="stage" id="s3"><h2>🧪 实验：我的关卡 → 单机玩</h2>
<div class="row"><div class="card"><div class="msg" id="sumt"></div><div id="sumseg" style="display:flex;gap:4px;width:100%"></div><div class="msg" id="sumtot"></div></div>
<div class="card"><a class="go" id="play" href="../../xy-go/?custom=1">🎮 单机玩「我的关卡」</a><div class="msg" id="saved" style="color:#9ff0a8"></div><div class="msg" style="font-size:13px">玩完说：和预计一样吗？</div></div></div></section>
</main>
<div class="foot"><button class="back" id="back">上一步</button><div id="hp" style="align-self:center;font-weight:800;font-size:16px;text-align:center"></div><button id="next">下一步 ▶</button></div>
<script>
(function(){
let COLS=12;const SW=()=>COLS/6,SEG=x=>Math.min(5,Math.floor(x/SW()));const KEY='xygo-custom-level',ROWS=4,$=id=>document.getElementById(id);
const CURVE=[1,2,1,3,2,4];
const E={mud:'🟫',bubble:'🫧',sand:'⏳',mist:'☠️',wave:'🌊',shark:'🦈',rock:'🪨',meteor:'☄️',fire:'🔥',lowg:'🌙',spring:'🌀',shield:'🛡️',coin:'⭐',flag:'🚩'};
const TH={swamp:['沼泽',['mud','bubble','sand']],ocean:['海洋',['wave','shark','rock']],space:['太空',['meteor','lowg','fire']]};
const NUM={rock:['落石'],fire:['火'],sand:['流沙'],meteor:['陨石'],shark:['鲨鱼'],wave:['浪'],mud:['淤泥'],bubble:['毒泡'],lowg:['低重力']};
const DEF={interval:2,speed:3,damage:1,dur:3};
const DIMS=[['interval','⏱️ 频率','每几秒',1,5],['speed','💨 速度','',1,6],['damage','💥 伤害','',1,3],['dur','⏳ 持续','几秒',1,10],['gap','📏 间距','离前一个',1,5]];
let st={theme:'swamp',tiles:[],traps:{},curve:CURVE.slice()};
for(const k in NUM)st.traps[k]=Object.assign({},DEF);
function preset(th){const [a,b,c]=TH[th][1],t=[];for(let x=0;x<COLS;x++)t.push({x,y:ROWS-1,type:'g'});
 const at=f=>Math.min(COLS-1,Math.round(f*COLS));
 // 4 traps easy→hard, rest gap in the middle with 2 props
 [[.2,a],[.4,b],[.55,'flag'],[.65,'shield'],[.8,c],[.93,c]].forEach(([f,ty])=>t.push({x:at(f),y:ROWS-2,type:ty}));return t;}
{const q=new URLSearchParams(location.search);if([8,12,16].includes(+q.get('len')))COLS=+q.get('len');}st.tiles=preset('swamp');
// stage 2 trap cards (show current theme + rock/fire)
function trapHits(p){return ((p.interval<=1?2:p.interval<=2?1:0)+(p.speed>=5?1:0)+(p.dur>=7?1:0))*p.damage;}
const RISK={};
let sel=null,stripAnim=null;
const trapTiles=()=>st.tiles.filter(t=>NUM[t.type]).sort((a,b)=>a.x-b.x);
function segDiff(){const d=[0,0,0,0,0,0];for(const r of simulate())d[SEG(r.x)]+=r.h;return d.map(v=>Math.max(1,Math.min(5,1+v)));}
const totalHits=()=>simulate().reduce((a,b)=>a+b.h,0);
let selI=0;
function selTile(){const tt=trapTiles();selI=Math.min(selI,tt.length-1);return tt[selI];}
function gapOf(t){const tt=trapTiles(),i=tt.indexOf(t);return i>0?t.x-tt[i-1].x:t.x+1;}
function dimVal(t,k){return k==='gap'?gapOf(t):st.traps[t.type][k];}
function traps(){const t=selTile();if(!t){$('traps').innerHTML='';return;}
 $('traps').innerHTML=DIMS.map(([k,n,u,mn,mx])=>`<div class="card dim" style="flex:1 1 18%;padding:4px"><div style="font-size:14px">${n}</div><canvas id="m-${k}" width="120" height="44" style="width:100%;height:26px"></canvas><b id="v-${k}" style="font-size:18px;color:#ffe7a0">${dimVal(t,k)}</b><input type="range" min="${mn}" max="${mx}" value="${dimVal(t,k)}" data-f="${k}" style="width:100%"><div id="h-${k}" style="font-size:14px"></div></div>`).join('')+'<div id="sumtab" style="flex:1 1 100%;font-size:12px"></div>';
 dimRes();cancelAnimationFrame(stripAnim);const t0=performance.now();(function f(now){drawStrip((now-t0)/1000);stripAnim=requestAnimationFrame(f);})(t0);}

function dimRes(){const t=selTile();if(!t)return;const now=totalHits(),ty=[...new Set(trapTiles().map(x=>x.type))];
 const rows=DIMS.map(([k,n])=>{let ch=[],dl;
  if(k==='gap'){const keep=JSON.parse(JSON.stringify(st.tiles)),pre=preset(st.theme);const moved=st.tiles.some((x,i)=>!pre[i]||pre[i].x!==x.x||pre[i].type!==x.type);if(moved)ch.push('挪了');st.tiles=pre;const h0=totalHits();st.tiles=keep;dl=now-h0;}
  else{const keep={};ty.forEach(y=>{const v=st.traps[y][k];keep[y]=v;if(v!==DEF[k])ch.push((NUM[y]||[y])[0]+DEF[k]+'→'+v);st.traps[y][k]=DEF[k];});const h0=totalHits();ty.forEach(y=>st.traps[y][k]=keep[y]);dl=now-h0;}
  const el=$('h-'+k);if(el)el.innerHTML=dl>0?`<span class="bad">-${dl}❤</span>`:dl<0?`<span class="ok">+${-dl}❤</span>`:'—';
  return [n,ch.length?ch.join(' '):'默认',dl?(dl>0?'-'+dl+'❤':'+'+(-dl)+'❤'):'0❤'];});
 $('sumtab').innerHTML='<table style="width:100%;text-align:center"><tr><th>维度</th>'+rows.map(r=>`<th>${r[0]}</th>`).join('')+'</tr><tr><td>调了</td>'+rows.map(r=>`<td>${r[1]}</td>`).join('')+'</tr><tr><td>结果</td>'+rows.map(r=>`<td>${r[2]}</td>`).join('')+`</tr></table>`;}
function mini(t){const tl=selTile();if(!tl)return;const p=st.traps[tl.type],e=E[tl.type];
 for(const [k] of DIMS){const c=$('m-'+k);if(!c)continue;const g=c.getContext('2d');g.clearRect(0,0,120,44);g.font='22px sans-serif';
  if(k==='interval'){const ph=(t%p.interval)/p.interval;g.fillText(e,50,8+ph*34);g.fillStyle='#c9c3ef';g.font='11px sans-serif';g.fillText('每'+p.interval+'秒',2,42);}
  if(k==='speed'){g.fillText(e,((t*p.speed*20)%140)-20,32);}
  if(k==='damage'){for(let i=0;i<3;i++)g.fillText(i<p.damage&&(t%1)<.6?'💔':'❤',4+i*38,32);}
  if(k==='dur'){g.fillText(e,2,32);g.fillStyle='#ffffff22';g.fillRect(34,16,80,12);g.fillStyle='#ff9f5a';g.fillRect(34,16,80*p.dur/10*((t%2)<1.5?1:0),12);}
  if(k==='gap'){const gp=gapOf(tl);g.fillText('🪤',4,32);g.fillText(e,4+gp*20,32);g.fillStyle=gp<=2?'#ff6b6b':'#9ff0a8';g.font='bold 11px sans-serif';g.fillText(gp<=2?'挤!':'有喘气',70,42);}}}
function drawStrip(t){mini(t);const cv=$('strip'),g=cv.getContext('2d'),W=cv.width,H=cv.height,cw=W/COLS,gy=H-28,sd=segDiff(),stl=selTile();g.clearRect(0,0,W,H);
 for(let s=0;s<6;s++){g.fillStyle=s%2?'#ffffff08':'#ffffff14';g.fillRect(s*SW()*cw,0,SW()*cw,H);const v=sd[s];g.fillStyle=['','#78d484','#b6e07a','#ffe07a','#ffb06b','#ff6b6b'][v];g.font='bold 22px sans-serif';g.fillText('难'+v,s*SW()*cw+6,24);}
 g.fillStyle='#6b4f2f';g.fillRect(0,gy,W,28);const fs=Math.min(40,cw*.8);
 for(const it of st.tiles.filter(t=>t.y===ROWS-2)){const x=it.x*cw+cw*.1,p=st.traps[it.type];let y=gy-6,al=1;
  if(p){const ph=(t%p.interval)/p.interval;if(it.type==='rock'||it.type==='meteor')y=30+Math.min(1,ph*p.speed)*(gy-36);else al=ph<Math.min(.9,p.dur/10+.2)?1:.3;}
  g.globalAlpha=al;g.font=fs+'px sans-serif';g.fillText(E[it.type]||'',x,y);g.globalAlpha=1;
  if(it===stl){g.strokeStyle='#ffe7a0';g.lineWidth=4;g.strokeRect(it.x*cw+2,30,cw-4,gy-30);}}}
$('strip').onclick=e=>{const r=e.target.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*COLS);const tt=trapTiles();let bi=0;tt.forEach((t,i)=>{if(Math.abs(t.x-x)<Math.abs(tt[bi].x-x))bi=i;});selI=bi;traps();};
$('traps').oninput=e=>{const i=e.target,k=i.dataset.f,t=selTile();if(!k||!t)return;const v=+i.value;
 if(k==='gap'){const tt=trapTiles(),ix=tt.indexOf(t),px=ix>0?tt[ix-1].x:-1,nx=Math.min(COLS-1,px+v);if(!st.tiles.some(o=>o!==t&&o.x===nx&&o.y===t.y))t.x=nx;}
 else st.traps[t.type][k]=v;$('v-'+k).textContent=dimVal(t,k);dimRes();};
let brush='g';
function design(){
 $('th').innerHTML=Object.entries(TH).map(([k,v])=>`<button data-t="${k}" class="${k===st.theme?'on':''}">${v[0]}</button>`).join('');
 const pl=['g',...TH[st.theme][1],'shield','coin','flag','x'];
 $('pal').innerHTML=pl.map(k=>`<button data-b="${k}" class="${k===brush?'on':''}">${k==='g'?'🟤地':k==='x'?'🧽':E[k]}</button>`).join('');
 $('grid').style.gridTemplateColumns=`repeat(${COLS},minmax(0,1fr))`;$('len').innerHTML=[[8,'短'],[12,'中'],[16,'长']].map(([n,l])=>`<button data-n="${n}" class="${n===COLS?'on':''}">${l} ${n}格</button>`).join('')+`<button data-v="1" class="${scene?'on':''}">🖼️ 格子↔画面</button>`;$('grid').style.display=scene?'none':'grid';$('scene').style.display=scene?'block':'none';$('pal').style.display=scene?'none':'block';$('chk').style.display=scene?'none':'block';if(scene)drawScene();
 let h='';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const ts=st.tiles.filter(t=>t.x===x&&t.y===y);const base=ts.find(t=>t.type==='g'||t.type==='p');const it=ts.find(t=>t!==base);
  h+=`<div class="cell ${base?base.type:''}" data-x="${x}" data-y="${y}">${it?E[it.type]:''}</div>`;}
 $('grid').innerHTML=h;
 const isT=t=>TH[st.theme][1].includes(t.type)||NUM[t.type];
 const seg=[0,1,2,3,4,5].map(s=>st.tiles.filter(t=>isT(t)&&SEG(t.x)===s).length);
 const a=seg[0]<=1&&seg[5]>=Math.max(...seg),b=seg.some((v,i)=>i&&v<seg[i-1]);
 $('chk').innerHTML=`陷阱数 ${seg.join('-')} &nbsp; <span class="${a?'ok':'bad'}">${a?'✅':'🤔'}先易后难</span> &nbsp; <span class="${b?'ok':'bad'}">${b?'✅':'🤔'}有喘气</span>`;}
let scene=new URLSearchParams(location.search).get('scene')==='1',ov=true;
function drawScene(){const C=40,W=COLS*C,H=(ROWS+1)*C;let h=`<rect width="${W}" height="${H}" fill="#3a4a8a"/>`;
 for(const t of st.tiles){const X=t.x*C,Y=(t.y+1)*C;if(t.type==='g')h+=`<rect x="${X}" y="${Y}" width="${C}" height="${C}" fill="#6b4f2f"/><rect x="${X}" y="${Y}" width="${C}" height="6" fill="#4ea85c"/>`;else h+=`<text x="${X+4}" y="${Y+32}" font-size="30">${E[t.type]||''}</text>`;}
 h+=`<text x="2" y="${ROWS*C-4}" font-size="38">🥷</text><rect x="0" y="${(ROWS-1)*C}" width="${C}" height="${2*C}" fill="none" stroke="#ffe7a0" stroke-width="3" transform="translate(0,-${C})"/>`;
 h+=`<path d="M${C/2},${(ROWS-1)*C} Q${C*2},${C*.3} ${C*3.5},${(ROWS-1)*C}" fill="none" stroke="#ffe7a0" stroke-width="3" stroke-dasharray="6 4"/><text x="${C*1.4}" y="${C*.9}" fill="#ffe7a0" font-size="16" font-weight="800">跳 3格</text>`;
 if(ov){for(let x=0;x<=COLS;x++)h+=`<line x1="${x*C}" x2="${x*C}" y1="0" y2="${H}" stroke="#fff6" />${x<COLS?`<text x="${x*C+3}" y="12" fill="#fff" font-size="10">${x*C}</text>`:''}`;for(let y=0;y<=ROWS+1;y++)h+=`<line y1="${y*C}" y2="${y*C}" x1="0" x2="${W}" stroke="#fff6"/>`;}
 const sv=$('sv');sv.setAttribute('viewBox',`0 0 ${W} ${H}`);sv.style.maxHeight=(innerHeight<500?'115px':'220px');sv.style.width='100%';sv.innerHTML=h;}
$('ov').onclick=()=>{ov=!ov;drawScene();};
$('len').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v){scene=!scene;}else{COLS=+b.dataset.n;st.tiles=preset(st.theme);}design();};
$('th').onclick=e=>{const t=e.target.dataset.t;if(t){st.theme=t;st.tiles=preset(t);design();}};
$('pal').onclick=e=>{const b=e.target.dataset.b;if(b){brush=b;design();}};
$('grid').onclick=e=>{const c=e.target.closest('.cell');if(!c)return;const x=+c.dataset.x,y=+c.dataset.y,terr=brush==='g';
 st.tiles=st.tiles.filter(t=>!(t.x===x&&t.y===y&&(brush==='x'||(terr?t.type==='g'||t.type==='p':t.type!=='g'&&t.type!=='p'))));
 if(brush!=='x')st.tiles.push({x,y,type:brush});design();};
function save(){const used=new Set(st.tiles.map(t=>t.type)),tr={};for(const k in st.traps)if(used.has(k)){const q=st.traps[k];tr[k]=Object.assign({},q,{burn:q.dur,sink:q.dur,slow:Math.min(90,q.dur*10),height:q.speed>4?3:2});}
 localStorage.setItem(KEY,JSON.stringify({theme:st.theme,cols:COLS,rows:ROWS,tiles:st.tiles,traps:tr,curve:st.curve,savedAt:new Date().toISOString(),by:'伍澍暘'}));
 const r=simulate(),sh=[0,0,0,0,0,0];r.forEach(x=>sh[SEG(x.x)]+=x.h);const tot=sh.reduce((a,b)=>a+b,0);
 $('sumt').textContent=TH[st.theme][0]+'关 · '+COLS+'格 · 预计掉血';
 $('sumseg').innerHTML=sh.map((v,i)=>`<div style="flex:1;text-align:center;background:#ffffff12;border-radius:8px;padding:4px"><div style="font-size:12px;color:#c9c3ef">第${i+1}段</div><div style="font-size:20px;color:${v?'#ff6b6b':'#9ff0a8'}">${v?'-'+v+'❤':'✓'}</div></div>`).join('');
 $('sumtot').innerHTML='总难度 <b style="font-size:24px">'+Math.max(1,Math.min(5,1+Math.round(tot/2)))+'</b> / 5 · 共掉 '+tot+' ❤';$('saved').textContent='已保存 ✅';}
$('play').onclick=save;


let anim=null;
let last=null;
function simulate(){const tr=trapTiles();let shield=0;const out=[];
