<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#12162f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>澍暘的 AI 冒险月</title>
  <link rel="stylesheet" href="style.css?v=11"/>
  <style>
    .welcome {
      max-width: 480px; margin: 0 auto; min-height: 100dvh;
      padding: calc(22px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; text-align: center;
      color: #f7f4ff;
      font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(900px 420px at 80% -10%, #5a3d9a55, transparent 60%),
        radial-gradient(700px 380px at 10% 0%, #2f6f8f44, transparent 55%),
        linear-gradient(180deg, #0f1230, #1b2152 48%, #24305f);
    }
    .welcome .date {
      margin: 0 0 10px; color: #ffe7a0; font-weight: 800; letter-spacing: .06em; font-size: 15px;
    }
    .welcome h1 { margin: 0 0 8px; font-size: clamp(28px, 8vw, 36px); font-weight: 800; }
    .welcome .lead { margin: 0 0 22px; font-size: 17px; font-weight: 700; opacity: .92; line-height: 1.45; }
    .cast {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%;
      margin: 0 0 22px;
    }
    .cast figure { margin: 0; }
    .cast img {
      width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; display: block;
      border: 3px solid #ffe9a088; background: #1a2048;
    }
    .cast .dad, .cast .mom, .cast .son { object-position: center 16%; }
    .cast .xiaoyu { object-position: 32% 34%; }
    .cast figcaption {
      margin-top: 8px; color: #ffe7a0; font-size: 14px; font-weight: 800;
    }
    .welcome .go {
      appearance: none; border: 0; width: 100%; max-width: 360px; min-height: 56px;
      border-radius: 999px; background: linear-gradient(180deg, #78d484, #4ea85c);
      color: #fff; font-size: 20px; font-weight: 800; box-shadow: 0 4px 0 #2f6d3a;
      text-decoration: none; display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .welcome .go:active { transform: translateY(2px); box-shadow: 0 2px 0 #2f6d3a; }
    .welcome .sub {
      color: #c9c3ef; font-size: 14px; font-weight: 700; text-decoration: none; margin-top: 6px;
    }
    .welcome .lesson-chip {
      margin: 0 0 18px; padding: 10px 16px; border-radius: 999px;
      background: #2f7a45; color: #fff; font-weight: 800; font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="welcome">
    <p class="date" id="todayDate">2026年10月30日 · 周五</p>
    <h1>澍暘的 AI 冒险月</h1>
    <p class="lead">爸爸 · 妈妈 · 伍澍暘 · 小雨<br>一起上今晚的课 · <a href="learn/level-design.html?v=ld12" style="color:#ffe7a0">直接打开关卡设计台</a></p>
    <div class="cast" aria-label="一家人">
      <figure>
        <img class="xiaoyu" src="avatars/xiaoyu.jpg?v=11" alt="小雨"/>
        <figcaption>小雨</figcaption>
      </figure>
      <figure>
        <img class="dad" src="avatars/dad-wuxin.jpg?v=11" alt="爸爸"/>
        <figcaption>爸爸</figcaption>
      </figure>
      <figure>
        <img class="mom" src="avatars/mom-chunyan.jpg?v=11" alt="妈妈"/>
        <figcaption>妈妈</figcaption>
      </figure>
      <figure>
        <img class="son" src="avatars/pengpeng.jpg?v=11" alt="伍澍暘"/>
        <figcaption>伍澍暘</figcaption>
      </figure>
    </div>
    <p class="lesson-chip">今晚 · 道具和关卡是怎么设计的</p>
    <a class="go" href="kid.html?v=ld1">进入今晚课程</a>
    <a class="sub" href="course-home.html?v=11">完整月历版（可选）</a>
  </main>
  <script>
    (function () {
      // Keep date label honest to local calendar (Asia/Shanghai page for family)
      try {
        const fmt = new Intl.DateTimeFormat('zh-CN', {
          timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
        });
        const el = document.getElementById('todayDate');
        if (el) el.textContent = fmt.format(new Date());
      } catch (e) {}
    })();
  </script>
</body>
</html>
