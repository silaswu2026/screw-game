<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#12162f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>今晚 · 逐帧动画</title>
  <link rel="stylesheet" href="kid.css?v=mc12"/>
</head>
<body>
  <div id="app"></div>
  <script>
    (async function () {
      const app = document.getElementById('app');
      function fail(msg) {
        if (app) app.innerHTML = '<p class="boom">页面没打开：' + msg + '</p>';
      }
      function load(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error(src));
          document.body.appendChild(s);
        });
      }
      try {
        await load('sync.js?v=11');
        await load('kid.js?v=ld2');
      } catch (e) {
        fail(e && e.message ? e.message : '脚本');
      }
    })();
  </script>
</body>
</html>
