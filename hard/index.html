<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4e0">
<title>困难拧螺丝</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{
  "three":"../vendor/three.module.js",
  "three/addons/":"../vendor/addons/"
}}</script>
</head>
<body>
<div id="bg"></div>

<div id="map" class="screen">
  <header class="hdr">
    <div class="title">困难拧螺丝</div>
    <button class="btn small" id="tplBtn" type="button">模式 1/3</button>
    <button class="btn small" id="themeBtn" type="button">主题</button>
    <button class="btn small" id="helpBtn" type="button">规则</button>
    <button class="btn small" id="soundBtn" type="button">音效</button>
  </header>
  <p id="modeBlurb" class="blurb"></p>
  <div id="meta" class="meta"></div>
  <div id="path"></div>
  <a class="back" href="../">返回普通版</a>
</div>

<div id="hud" class="screen hidden">
  <div id="top">
    <div class="bar">
      <button class="btn small" id="toMap" type="button">地图</button>
      <div id="lvl">第1关</div>
      <button class="btn small" id="tplBtn2" type="button">模式</button>
      <button class="btn small" id="restart" type="button">重来</button>
    </div>
    <div id="stats">
      <div class="pill" id="hearts"></div>
      <div class="pill" id="steps"></div>
      <div class="pill" id="badgePill">🏅 <b id="badgeCount">0</b>/10</div>
      <div class="pill" id="coins">💖 0</div>
    </div>
    <div id="boxes"></div>
    <div id="bufLabel">暂存</div>
    <div id="buf"></div>
  </div>
  <div id="tip"></div>
  <div id="items"></div>
  <div id="hand">👆</div>
</div>

<div id="flash"></div>
<div id="toast"></div>

<div id="modal" class="modal hidden">
  <div class="card">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalBtns"></div>
  </div>
</div>

<div id="chest" class="modal hidden">
  <div class="card chestCard">
    <div id="chestArt">🎁</div>
    <h2 id="chestTitle">小宝箱打开啦</h2>
    <p id="chestText"></p>
    <button class="btn" id="chestOk" type="button">收下</button>
  </div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
